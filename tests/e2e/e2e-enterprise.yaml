name: e2e-enterprise
description: >
  Heavy enterprise services: CI/CD platforms, code analysis, orchestration.
  These images are large (500MB-2.5GB) with long startup times. Tests the
  full chain per service: port identification → postexploit module routing
  → credential harvest or code execution.
tags: [e2e, postexploit, enterprise, authorized]
weight: 100

services:
  jenkins:
    image: jenkins/jenkins:lts-jdk17
    ports: ["9650:8080"]
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false
      - JENKINS_OPTS=--argumentsRealm.roles.user=admin --argumentsRealm.passwd.admin=admin --argumentsRealm.roles.admin=admin

  sonarqube:
    image: sonarqube:9.9-community
    ports: ["9651:9000"]
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"

  airflow:
    image: apache/airflow:2.7.0
    ports: ["9652:8080"]
    environment:
      - AIRFLOW__CORE__LOAD_EXAMPLES=true
      - AIRFLOW__API__AUTH_BACKENDS=airflow.api.auth.backend.basic_auth
      - _AIRFLOW_DB_MIGRATE=true
      - _AIRFLOW_WWW_USER_CREATE=true
      - _AIRFLOW_WWW_USER_USERNAME=airflow
      - _AIRFLOW_WWW_USER_PASSWORD=airflow
    command: ["standalone"]

  argocd:
    image: quay.io/argoproj/argocd:v2.8.0
    ports: ["9653:8080"]
    command: ["argocd-server", "--insecure", "--disable-auth"]

  teamcity:
    image: jetbrains/teamcity-server:2023.05
    ports: ["9654:8111"]
    environment:
      - TEAMCITY_SERVER_MEM_OPTS=-Xmx512m

  gitlab:
    image: gitlab/gitlab-ce:16.4.0-ce.0
    ports: ["9655:80"]
    environment:
      - GITLAB_OMNIBUS_CONFIG=gitlab_rails['initial_root_password'] = 'password123'; gitlab_rails['gitlab_shell_ssh_port'] = 2222;

  solr:
    image: solr:8.11.0
    ports: ["9656:8983"]
    command: ["solr-precreate", "beacon_test"]

  confluence:
    image: atlassian/confluence:7.13.6
    ports: ["9657:8090"]
    environment:
      - JVM_MINIMUM_MEMORY=512m
      - JVM_MAXIMUM_MEMORY=1024m

ready:
  cmd: >
    curl -sf http://localhost:9650/ 2>/dev/null | grep -qi jenkins &&
    curl -sf http://localhost:9651/api/system/status 2>/dev/null | grep -q UP &&
    curl -sf -u airflow:airflow http://localhost:9652/api/v1/dags 2>/dev/null | grep -q dags &&
    curl -sfk http://localhost:9653/api/v1/applications 2>/dev/null | grep -q items &&
    curl -sf http://localhost:9654/app/rest/server 2>/dev/null | grep -qE 'version|buildDate' &&
    curl -sf http://localhost:9656/solr/admin/info/system 2>/dev/null | grep -q solr
  timeout: 300s
  interval: 10s

assertions:
  # --- Jenkins: identify + exploit (unauthenticated Script Console) ---
  - name: jenkins-identified
    type: beacon
    target: "localhost"
    args: ["--no-enrich", "--scanners", "portscan", "--ports", "9650"]
    expect:
      check_id: port.service_identified

  - name: jenkins-rce-exploited
    type: beacon
    target: "localhost"
    args: ["--no-enrich", "--scanners", "portscan", "--authorized", "--deep", "--permission-confirmed", "--ports", "9650"]
    expect:
      check_id: exploit.code_execution

  # --- SonarQube: identify + exploit (default admin/admin) ---
  - name: sonarqube-identified
    type: beacon
    target: "localhost"
    args: ["--no-enrich", "--scanners", "portscan", "--ports", "9651"]
    expect:
      check_id: port.service_identified

  - name: sonarqube-data-extracted
    type: beacon
    target: "localhost"
    args: ["--no-enrich", "--scanners", "portscan", "--authorized", "--deep", "--permission-confirmed", "--ports", "9651"]
    expect:
      check_id: exploit.data_extracted

  # --- Airflow: identify + exploit (default airflow/airflow creds) ---
  - name: airflow-identified
    type: beacon
    target: "localhost"
    args: ["--no-enrich", "--scanners", "portscan", "--ports", "9652"]
    expect:
      check_id: port.service_identified

  - name: airflow-connections-exploited
    type: beacon
    target: "localhost"
    args: ["--no-enrich", "--scanners", "portscan", "--authorized", "--deep", "--permission-confirmed", "--ports", "9652"]
    expect:
      check_id: exploit.code_execution

  # --- ArgoCD: identify + exploit (disabled auth) ---
  - name: argocd-identified
    type: beacon
    target: "localhost"
    args: ["--no-enrich", "--scanners", "portscan", "--ports", "9653"]
    expect:
      check_id: port.service_identified

  - name: argocd-apps-exploited
    type: beacon
    target: "localhost"
    args: ["--no-enrich", "--scanners", "portscan", "--authorized", "--deep", "--permission-confirmed", "--ports", "9653"]
    expect:
      check_id: exploit.code_execution

  # --- TeamCity: identify + exploit (guest access) ---
  - name: teamcity-identified
    type: beacon
    target: "localhost"
    args: ["--no-enrich", "--scanners", "portscan", "--ports", "9654"]
    expect:
      check_id: port.service_identified

  - name: teamcity-data-exploited
    type: beacon
    target: "localhost"
    args: ["--no-enrich", "--scanners", "portscan", "--authorized", "--deep", "--permission-confirmed", "--ports", "9654"]
    expect:
      check_id: exploit.code_execution

  # --- GitLab: identify + exploit (unauthenticated API) ---
  - name: gitlab-identified
    type: beacon
    target: "localhost"
    args: ["--no-enrich", "--scanners", "portscan", "--ports", "9655"]
    expect:
      check_id: port.service_identified

  - name: gitlab-data-extracted
    type: beacon
    target: "localhost"
    args: ["--no-enrich", "--scanners", "portscan", "--authorized", "--deep", "--permission-confirmed", "--ports", "9655"]
    expect:
      check_id: exploit.data_extracted

  # --- Solr (Log4Shell): identify (CVE-gated, needs nuclei for exploit) ---
  - name: solr-identified
    type: beacon
    target: "localhost"
    args: ["--no-enrich", "--scanners", "portscan", "--ports", "9656"]
    expect:
      check_id: port.service_identified

  - name: solr-log4shell-exploited
    type: beacon
    target: "localhost"
    args: ["--no-enrich", "--scanners", "portscan", "--authorized", "--deep", "--permission-confirmed", "--ports", "9656"]
    expect:
      check_id: exploit.code_execution

  # --- Confluence: identify + exploit (CVE-2021-26084 OGNL) ---
  - name: confluence-identified
    type: beacon
    target: "localhost"
    args: ["--no-enrich", "--scanners", "portscan", "--ports", "9657"]
    expect:
      check_id: port.service_identified

  - name: confluence-rce-exploited
    type: beacon
    target: "localhost"
    args: ["--no-enrich", "--scanners", "portscan", "--authorized", "--deep", "--permission-confirmed", "--ports", "9657"]
    expect:
      check_id: exploit.code_execution

  # --- Full scan: all enterprise services at once ---
  - name: full-enterprise-scan-finds-all
    type: beacon
    target: "localhost"
    args: ["--no-enrich", "--scanners", "portscan", "--authorized", "--deep", "--permission-confirmed",
           "--ports", "9650,9651,9652,9653,9654,9655,9656,9657"]
    expect:
      min_findings: 10

timeout: 25m
