name: full-pipeline-surface
description: >
  End-to-end pipeline test: asset classify, playbook matching, multi-scanner
  execution, and dedup all run without --scanners. Validates that the full
  scan pipeline discovers findings from multiple independent scanners against
  a single composite target.
tags: [e2e, pipeline, surface, dlp, portscan]

services:
  app:
    build:
      context: ./full-pipeline
      dockerfile: Dockerfile
    ports: ["9880:8080"]

ready:
  cmd: "curl -sf http://localhost:9880/health"
  timeout: 30s
  interval: 2s

assertions:
  # Full pipeline — no --scanners flag. Beacon must discover the HTTP service,
  # classify it, match the baseline playbook, and run all applicable scanners.
  # Targets use compose service name since beacon runs in-network via Docker.
  - name: pipeline-finds-multiple-issues
    type: beacon
    target: "app:8080"
    args: ["--no-enrich", "--ports", "8080"]
    expect:
      min_findings: 2

  # DLP scanner should detect the exposed .env with API keys.
  # This only fires if classify detected HTTP → playbook matched → DLP ran.
  - name: pipeline-detects-api-keys
    type: beacon
    target: "app:8080"
    args: ["--no-enrich", "--scanners", "dlp", "--ports", "8080"]
    expect:
      check_id: dlp.api_key

  # Port scanner should identify the HTTP service.
  - name: pipeline-detects-service
    type: beacon
    target: "app:8080"
    args: ["--no-enrich", "--scanners", "portscan", "--ports", "8080"]
    expect:
      check_id: port.service_identified

timeout: 10m
