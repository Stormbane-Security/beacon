name: http-scanners-from-portscan
description: >
  Verify HTTP scanners (secheaders, exposedfiles, clickjacking) run when
  portscan identifies HTTP on a non-standard port, even if the classify
  probe didn't fire. This catches the hasHTTP wiring bug where classify
  failure silently disabled all HTTP scanners.
tags: [wiring, http, regression]

services:
  nginx:
    image: nginx:alpine
    ports: ["9999:9999"]
    volumes:
      - ./http-from-portscan/html:/usr/share/nginx/html:ro
      - ./http-from-portscan/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

ready:
  cmd: "curl -sf http://localhost:9999/ >/dev/null"
  timeout: 30s
  interval: 2s

assertions:
  - name: secheaders-runs-on-nonstandard-port
    type: beacon
    target: localhost:9999
    args: ["--no-enrich", "--no-nmap", "--no-nuclei", "--ports", "9999", "--verbose"]
    expect:
      min_findings: 3
      has_check_id: "headers.missing_csp"

  - name: clickjacking-runs-on-nonstandard-port
    type: beacon
    target: localhost:9999
    args: ["--no-enrich", "--no-nmap", "--no-nuclei", "--ports", "9999", "--verbose"]
    expect:
      has_check_id: "http.clickjacking"

timeout: 5m
