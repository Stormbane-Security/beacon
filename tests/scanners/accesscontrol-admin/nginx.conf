server {
    listen 80;
    server_name _;

    # Admin panel accessible without authentication.
    # accesscontrol scanner probes /admin, /dashboard, /console, etc.
    # and checks for admin-like keywords in the response body.

    location = /admin {
        default_type text/html;
        return 200 '<html><head><title>Admin Dashboard</title></head><body>
<h1>Administration Panel</h1>
<nav>
  <a href="/admin/users">User Management</a>
  <a href="/admin/settings">System Settings</a>
  <a href="/admin/configuration">Configuration</a>
</nav>
<div class="dashboard">
  <h2>Dashboard Overview</h2>
  <p>Active users: 142</p>
  <p>System status: healthy</p>
</div>
</body></html>';
    }

    location = /admin/ {
        default_type text/html;
        return 200 '<html><head><title>Admin Dashboard</title></head><body>
<h1>Administration Panel</h1>
<p>Welcome, admin. Manage users and system settings here.</p>
</body></html>';
    }

    # /console returns 403 on GET but 200 on POST (method bypass)
    location = /console {
        if ($request_method = GET) {
            return 403 'Forbidden';
        }
        default_type text/html;
        return 200 '<html><body><h1>Debug Console</h1><p>System administration panel</p></body></html>';
    }

    location / {
        default_type text/html;
        return 200 '<html><body><h1>App</h1></body></html>';
    }
}
