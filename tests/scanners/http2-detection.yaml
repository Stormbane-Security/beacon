name: http2-continuation-flood
description: >
  Nginx with HTTP/2 (h2) enabled over TLS. Beacon http2check scanner
  should detect HTTP/2 support and test for CONTINUATION flood
  vulnerability (CVE-2024-27316).
tags: [http2, continuation, cve, deep]

services:
  web:
    image: nginx:alpine
    ports: ["19901:443"]
    volumes:
      - ./fixtures/http2-detection/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./fixtures/http2-detection/cert.pem:/etc/nginx/ssl/cert.pem:ro
      - ./fixtures/http2-detection/key.pem:/etc/nginx/ssl/key.pem:ro

ready:
  cmd: "curl -skf https://localhost:19901/ >/dev/null"
  timeout: 30s
  interval: 2s

assertions:
  - name: exploit-h2-alpn-negotiated
    type: command
    expect:
      command: "curl -skI --http2 https://localhost:19901/ 2>&1 | grep -qi 'HTTP/2'"
      exit_code: 0

  - name: detects-http2-continuation-flood
    type: beacon
    target: localhost:19901
    args: ["--no-enrich", "--scanners", "http2check", "--deep", "--permission-confirmed"]
    expect:
      check_id: http2.continuation_flood

timeout: 5m
