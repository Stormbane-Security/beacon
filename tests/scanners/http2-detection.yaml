name: http2-detection
description: >
  Nginx with TLS. Tests TLS service detection and cert analysis.
tags: [http2, tls, scanner]

services:
  http2-app:
    image: nginx:alpine
    ports: ["20014:443"]
    volumes:
      - ./http2-detection/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    entrypoint: ["/bin/sh", "-c", "apk add --no-cache openssl >/dev/null 2>&1; mkdir -p /etc/nginx/ssl && openssl req -x509 -nodes -days 365 -newkey rsa:2048 -keyout /etc/nginx/ssl/server.key -out /etc/nginx/ssl/server.crt -subj '/CN=localhost' 2>/dev/null && nginx -g 'daemon off;'"]

ready:
  cmd: "curl -sfk https://localhost:20014/health >/dev/null"
  timeout: 60s
  interval: 3s

assertions:
  - name: exploit-tls-working
    type: command
    expect:
      command: "curl -sfk https://localhost:20014/ | grep -q 'HTTP/2'"
      exit_code: 0

  - name: detects-service
    type: beacon
    target: localhost:20014
    args: ["--no-enrich", "--no-nmap", "--scanners", "portscan", "--yes"]
    expect:
      min_findings: 1

  - name: negative-no-redis
    type: beacon
    target: localhost:20014
    args: ["--no-enrich", "--no-nmap", "--scanners", "portscan", "--yes"]
    expect:
      not_check_id: port.redis_unauthenticated

timeout: 5m
