name: variant-cms-drupal
description: >
  CMS variant test using Drupal. Tests that beacon detects Drupal as a
  CMS and finds security headers. Compare with WordPress and Ghost
  variant tests for cross-CMS coverage.
tags: [variant, cms, drupal, integration]

services:
  drupal:
    image: drupal:10-apache
    ports: ["19301:80"]

ready:
  cmd: "curl -sf http://localhost:19301/ -o /dev/null -w '%{http_code}' | grep -qE '200|302'"
  timeout: 120s
  interval: 5s

assertions:
  # Beacon scan completes on Drupal (may redirect to install page)
  - name: drupal-scan-completes
    type: beacon
    target: localhost:19301
    args: ["--no-enrich", "--no-nmap", "--ports", "19301", "--scanners", "secheaders"]
    expect:
      min_findings: 0

  # Beacon identifies the service
  - name: drupal-service-identified
    type: beacon
    target: localhost:19301
    args: ["--no-enrich", "--no-nmap", "--ports", "19301"]
    expect:
      check_id: port.service_identified

timeout: 5m
