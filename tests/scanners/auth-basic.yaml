name: auth-basic
description: >
  Nginx serving content behind HTTP Basic Auth. Beacon in authenticated
  scanning mode (method: basic) should authenticate and discover the
  exposed files and server headers behind auth that are invisible to
  an unauthenticated scan.
tags: [auth, basic, authenticated-scanning]

services:
  web:
    image: nginx:alpine
    ports: ["9400:80"]
    volumes:
      - ./fixtures/auth-basic/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./fixtures/auth-basic/htpasswd:/etc/nginx/.htpasswd:ro
      - ./fixtures/auth-basic/html:/usr/share/nginx/html:ro

ready:
  cmd: "curl -sf http://localhost:9400/ -o /dev/null -w '%{http_code}' | grep -q 401"
  timeout: 30s
  interval: 2s

assertions:
  # Unauthenticated scan detects missing security headers (nginx serves headers even on 401).
  - name: unauth-scan-sees-missing-headers
    type: beacon
    target: localhost:9400
    args: ["--no-enrich", "--scanners", "secheaders"]
    expect:
      check_id: headers.missing_hsts

  # Unauthenticated scan does NOT find .env (blocked by 401).
  - name: unauth-scan-no-env-file
    type: beacon
    target: localhost:9400
    args: ["--no-enrich", "--scanners", "exposedfiles"]
    expect:
      not_check_id: exposure.env_file_exposed

  # Authenticated scan (basic auth) finds the exposed .env file behind auth.
  - name: auth-scan-finds-exposed-file
    type: beacon
    target: localhost:9400
    args: ["--no-enrich", "--scanners", "exposedfiles", "--deep", "--yes"]
    auth:
      method: basic
      username: scanner
      password: b3acon-t3st
    expect:
      check_id: exposure.env_file_exposed

timeout: 3m
