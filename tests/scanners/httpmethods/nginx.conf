server {
    listen 80;
    server_name _;

    # Allow dangerous HTTP methods (PUT, DELETE, TRACE)
    location / {
        default_type text/html;

        if ($request_method = TRACE) {
            return 200 "TRACE $request_uri HTTP/1.1\r\nHost: $host\r\n";
        }

        if ($request_method = PUT) {
            return 200 "PUT accepted";
        }

        if ($request_method = DELETE) {
            return 200 "DELETE accepted";
        }

        return 200 '<html><body><h1>Methods Test</h1></body></html>';
    }
}
