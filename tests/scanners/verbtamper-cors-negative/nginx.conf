server {
    listen 80;

    # Protected admin path — GET returns 403.
    # OPTIONS returns 200 with CORS headers (standard preflight).
    # HEAD returns 200 with empty body (framework routing).
    # All other methods also return 403.
    # This is NOT a verb tamper bypass — it's normal CORS + HEAD behavior.
    location /admin {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type, Authorization";
            return 200;
        }
        if ($request_method = HEAD) {
            return 200;
        }
        if ($request_method = GET) {
            return 403 "Forbidden";
        }
        return 403 "Forbidden";
    }

    location / {
        return 200 "OK";
    }
}
