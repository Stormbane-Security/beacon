server {
    listen 80;
    server_name _;

    # API versioning test: v1 is open (200 JSON), v2 requires auth (401),
    # dev/staging are accessible. Catch-all returns 404 for unknown paths.

    location = /api/v1/ {
        default_type application/json;
        return 200 '{"version":"v1","status":"active","users":42}';
    }

    location = /api/v2/ {
        default_type application/json;
        return 401 '{"error":"authentication required","code":"UNAUTHORIZED"}';
    }

    location = /api/dev/ {
        default_type application/json;
        return 200 '{"env":"development","debug":true,"db_host":"10.0.0.5"}';
    }

    location = /api/staging/ {
        default_type application/json;
        return 200 '{"env":"staging","version":"2.1.0-rc1"}';
    }

    location = / {
        default_type text/html;
        return 200 '<html><body><h1>App</h1></body></html>';
    }

    # Catch-all: return 404 for everything else (scanner skips if catch-all returns 200)
    location / {
        return 404;
    }
}
