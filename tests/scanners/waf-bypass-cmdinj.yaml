name: waf-bypass-cmdinj
description: >
  Web application behind ModSecurity WAF with command injection in a
  query parameter. Standard payloads are blocked by the WAF. Beacon
  should use evasion encodings (IFS, hex, quote-break) to bypass and
  confirm the command injection.

services:
  webapp:
    image: vulnerables/web-dvwa:latest
    ports: ["8080:80"]
    environment:
      MYSQL_HOST: database
      MYSQL_USER: root
      MYSQL_PASSWORD: dvwa
      MYSQL_DATABASE: dvwa
    depends_on: [database]

  database:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: dvwa
      MYSQL_DATABASE: dvwa

  waf:
    image: owasp/modsecurity-crs:nginx-alpine
    ports: ["80:80"]
    environment:
      BACKEND: "http://webapp:80"
      PARANOIA: "1"
    depends_on: [webapp]

assertions:
  # Beacon with evasion should find the command injection
  - name: beacon-bypasses-waf-cmdinj
    type: beacon
    target: localhost
    args: ["--exploit", "--no-nmap", "--deep", "--yes", "--yes", "--scanners", "cmdinj", "--format", "json", "/tmp/results.json"]
    expect:
      check_id: web.command_injection
