server {
    listen 80;
    server_name _;

    # Proxy to backend httpbin — creates a front-end/back-end boundary
    # that smuggling scanner can probe for CL.TE / TE.CL disagreements.
    location / {
        proxy_pass http://httpbin:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
    }
}
