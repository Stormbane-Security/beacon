server {
    listen 80;
    server_name _;

    # PHP-FPM upstream
    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html$fastcgi_script_name;
        include fastcgi_params;
    }

    location / {
        root /var/www/html;
        index index.php index.html;
    }
}
