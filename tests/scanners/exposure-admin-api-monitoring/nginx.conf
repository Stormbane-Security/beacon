server {
    listen 80;
    server_name _;

    location / {
        default_type text/html;
        return 200 '<html><body><h1>Application</h1></body></html>';
    }

    # Admin path accessible without auth
    location /admin/ {
        default_type text/html;
        return 200 '<html><body><h1>admin panel</h1><p>User management, settings, admin controls</p></body></html>';
    }

    # API documentation exposed
    location /swagger.json {
        default_type application/json;
        return 200 '{"swagger":"2.0","info":{"title":"Internal API","version":"1.0"},"paths":{"/api/users":{"get":{"summary":"List users"}}}}';
    }

    location /api-docs {
        default_type text/html;
        return 200 '<html><body><h1>Swagger UI</h1><div id="swagger-ui"></div></body></html>';
    }

    # Monitoring panel endpoint
    location /metrics {
        default_type text/plain;
        return 200 '# HELP http_requests_total Total requests\n# TYPE http_requests_total counter\nhttp_requests_total{method="GET"} 1234\nprocess_cpu_seconds_total 42.5\n';
    }

    location /grafana {
        default_type text/html;
        return 200 '<html><body><h1>Grafana</h1></body></html>';
    }

    # Spring Actuator-like endpoint
    location /actuator {
        default_type application/json;
        return 200 '{"_links":{"self":{"href":"/actuator"},"health":{"href":"/actuator/health"},"env":{"href":"/actuator/env"},"beans":{"href":"/actuator/beans"}}}';
    }

    location /actuator/health {
        default_type application/json;
        return 200 '{"status":"UP"}';
    }

    location /actuator/env {
        default_type application/json;
        return 200 '{"activeProfiles":["production"],"propertySources":[{"name":"systemProperties"}]}';
    }

    location /health {
        return 200 'ok';
    }
}
