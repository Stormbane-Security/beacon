name: dirbust-path-discovery
description: >
  Nginx with /admin/ and /backup/ directories containing index pages.
  Beacon dirbust scanner should discover these common paths via
  dictionary-based brute force.
tags: [dirbust, discovery, deep]

services:
  web:
    image: nginx:alpine
    ports: ["19906:80"]
    volumes:
      - ./fixtures/dirbust-discovery/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./fixtures/dirbust-discovery/html:/usr/share/nginx/html:ro

ready:
  cmd: "curl -sf http://localhost:19906/ >/dev/null"
  timeout: 30s
  interval: 2s

assertions:
  - name: exploit-admin-dir-accessible
    type: command
    expect:
      command: "curl -sf http://localhost:19906/admin/ | grep -qi 'admin'"
      exit_code: 0

  - name: exploit-backup-dir-accessible
    type: command
    expect:
      command: "curl -sf http://localhost:19906/backup/ | grep -qi 'backup'"
      exit_code: 0

  - name: detects-dirbust-paths
    type: beacon
    target: localhost:19906
    args: ["--no-enrich", "--scanners", "dirbust", "--deep", "--yes"]
    expect:
      check_id: dirbust.path_found

timeout: 5m
