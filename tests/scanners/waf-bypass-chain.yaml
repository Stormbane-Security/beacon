name: waf-bypass-chain
description: >
  Tests beacon's ability to detect and work around a weak WAF. The "WAF" is
  an nginx config that blocks exact SQLi strings but misses encoded variants.
  Beacon should detect the blocking, still find security issues, and the
  control endpoint should have matching findings.
tags: [waf, bypass, evasion, exploit, full-chain, integration]

services:
  # Backend: simple echo app
  backend:
    image: mccutchen/go-httpbin:latest
    environment:
      PORT: "8080"

  # "Weak WAF": nginx blocks exact SQLi but misses encoded
  weakwaf:
    image: nginx:alpine
    ports: ["19950:80"]
    volumes:
      - ./waf-bypass-chain/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend

  # Control: same backend without WAF
  direct:
    image: mccutchen/go-httpbin:latest
    ports: ["19951:8080"]
    environment:
      PORT: "8080"

ready:
  cmd: "curl -sf http://localhost:19950/ >/dev/null && curl -sf http://localhost:19951/ >/dev/null"
  timeout: 30s
  interval: 2s

assertions:
  # ── Pre-flight: WAF blocks obvious payload ──
  - name: waf-blocks-obvious-sqli
    type: command
    expect:
      command: "curl -s -o /dev/null -w '%{http_code}' 'http://localhost:19950/get?q=OR%201=1' | grep -q '403'"
      exit_code: 0

  # ── Pre-flight: double-encoded variant passes through ──
  - name: waf-misses-double-encoded
    type: command
    expect:
      command: "curl -s -o /dev/null -w '%{http_code}' 'http://localhost:19950/get?q=%254F%2552' | grep -qE '200|400'"
      exit_code: 0

  # ── Beacon scan completes behind weak WAF ──
  - name: beacon-completes-behind-weakwaf
    type: beacon
    target: localhost:19950
    args: ["--no-enrich", "--no-nmap", "--scanners", "secheaders"]
    expect:
      check_id: headers.missing_hsts

  # ── Control: direct endpoint has same findings ──
  - name: control-direct-same-findings
    type: beacon
    target: localhost:19951
    args: ["--no-enrich", "--no-nmap", "--scanners", "secheaders"]
    expect:
      check_id: headers.missing_hsts

  # ── Negative: WAF port should not have Redis findings ──
  - name: negative-no-false-service
    type: beacon
    target: localhost:19950
    args: ["--no-enrich", "--no-nmap", "--scanners", "portscan"]
    expect:
      not_check_id: port.redis_unauthenticated

timeout: 5m
