server {
    listen 80;
    server_name _;

    location / {
        # VULNERABLE: session cookie without Secure, HttpOnly, or SameSite flags
        add_header Set-Cookie "session_id=abc123def456; Path=/";
        add_header Set-Cookie "user_prefs=dark_mode; Path=/" always;
        return 200 '<html><body><h1>Cookie Test</h1></body></html>';
        default_type text/html;
    }
}
