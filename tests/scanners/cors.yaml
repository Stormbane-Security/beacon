name: cors-misconfiguration
description: "Nginx with permissive CORS headers (Access-Control-Allow-Origin: * with credentials) triggers web.cors_misconfiguration"
tags: [cors, scanner, web]

services:
  nginx:
    image: nginx:alpine
    ports: ["9206:80"]
    volumes:
      - ./cors/nginx.conf:/etc/nginx/conf.d/default.conf:ro

ready:
  cmd: "curl -sf http://localhost:9206/ >/dev/null"
  timeout: 30s
  interval: 2s

assertions:
  - name: exploit-cors-reflects-origin
    type: command
    expect:
      command: "curl -sI -H 'Origin: https://evil.com' http://localhost:9206/ | grep -qi 'Access-Control-Allow-Origin'"
      exit_code: 0

  - name: exploit-cors-credentials-with-wildcard
    type: command
    expect:
      command: "curl -sI -H 'Origin: https://evil.com' http://localhost:9206/ | grep -qi 'Access-Control-Allow-Credentials'"
      exit_code: 0

  - name: detects-cors-misconfiguration
    type: beacon
    target: localhost:9206
    args: ["--no-enrich", "--no-nmap", "--scanners", "cors", "--deep", "--yes"]
    expect:
      check_id: web.cors_misconfiguration

timeout: 5m
