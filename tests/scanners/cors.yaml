name: cors-misconfiguration
description: "Nginx with permissive CORS headers (Access-Control-Allow-Origin: * with credentials) triggers web.cors_misconfiguration"
tags: [cors, scanner, web]

services:
  nginx:
    image: nginx:alpine
    ports: ["80:80"]
    volumes:
      - ./cors/nginx.conf:/etc/nginx/conf.d/default.conf:ro

ready:
  cmd: "curl -sf http://localhost:80/ >/dev/null"
  timeout: 30s
  interval: 2s

assertions:
  - name: detects-cors-misconfiguration
    type: beacon
    target: localhost:80
    args: ["--no-enrich", "--scanners", "cors", "--deep", "--permission-confirmed"]
    expect:
      check_id: web.cors_misconfiguration

timeout: 5m
