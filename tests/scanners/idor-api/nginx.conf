server {
    listen 80;
    server_name _;

    # Simulate REST API with sequential numeric IDs — no auth check.
    # IDOR scanner should detect that /api/users/1 and /api/users/2
    # return different content without any authorization.

    location ~ ^/api/users/(\d+)$ {
        default_type application/json;
        set $uid $1;
        return 200 '{"id":$uid,"name":"User $uid","email":"user$uid@example.com","role":"member"}';
    }

    location ~ ^/api/v1/users/(\d+)$ {
        default_type application/json;
        set $uid $1;
        return 200 '{"id":$uid,"username":"user$uid","active":true}';
    }

    location ~ ^/api/orders/(\d+)$ {
        default_type application/json;
        set $oid $1;
        return 200 '{"order_id":$oid,"total":99.99,"status":"shipped","customer_id":42}';
    }

    location = /api/me {
        default_type application/json;
        return 200 '{"id":1,"name":"Current User","email":"me@example.com","role":"admin"}';
    }

    location / {
        default_type application/json;
        return 200 '{"status":"ok","version":"1.0"}';
    }
}
