global
    log stdout format raw local0

defaults
    mode http
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend http_front
    bind *:80
    default_backend app_backend
    # HAProxy adds Via header by default when configured
    http-response add-header Via "1.1 haproxy-lb"

backend app_backend
    server app1 httpbin:80 check
