server {
    listen 80 default_server;
    server_name localhost;

    # Reject requests with unknown Host headers
    if ($host !~ ^(localhost|127\.0\.0\.1)$) {
        return 444;
    }

    location / {
        return 200 '<html><body>Secure</body></html>';
        add_header Content-Type text/html always;
    }
}
