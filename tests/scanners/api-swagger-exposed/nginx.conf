server {
    listen 80;
    server_name _;

    # Swagger/OpenAPI spec at common paths
    location = /swagger.json {
        alias /usr/share/nginx/html/swagger.json;
        default_type application/json;
    }

    location = /openapi.json {
        alias /usr/share/nginx/html/swagger.json;
        default_type application/json;
    }

    # Spring Boot pattern
    location = /v2/api-docs {
        alias /usr/share/nginx/html/swagger.json;
        default_type application/json;
    }

    location = /v3/api-docs {
        alias /usr/share/nginx/html/swagger.json;
        default_type application/json;
    }

    # Swagger UI redirect
    location = /api-docs {
        default_type text/html;
        return 200 '<html><head><title>Swagger UI</title></head><body><h1>Swagger UI</h1><p>API documentation available at <a href="/swagger.json">/swagger.json</a></p></body></html>';
    }

    location = /swagger-ui.html {
        default_type text/html;
        return 200 '<html><head><title>Swagger UI</title></head><body><h1>Swagger UI</h1><div id="swagger-ui"></div></body></html>';
    }

    location / {
        default_type text/html;
        return 200 '<html><body><h1>API Server</h1></body></html>';
    }
}
