server {
    listen 80;
    server_name _;

    # Bare nginx — no security headers configured at all.
    # This should trigger every missing-header check ID.

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    location /api {
        default_type application/json;
        return 200 '{"status": "ok"}';
    }
}
