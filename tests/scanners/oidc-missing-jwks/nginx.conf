server {
    listen 80;
    server_name _;

    location /.well-known/openid-configuration {
        default_type application/json;
        return 200 '{"issuer":"http://localhost","authorization_endpoint":"http://localhost/oauth/authorize","token_endpoint":"http://localhost/oauth/token","response_types_supported":["code"],"subject_types_supported":["public"],"id_token_signing_alg_values_supported":["RS256"]}';
    }

    location / {
        default_type text/html;
        return 200 '<html><body><h1>OIDC Provider</h1></body></html>';
    }
}
