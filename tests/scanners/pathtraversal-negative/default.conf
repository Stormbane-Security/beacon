server {
    listen 80;
    server_name localhost;

    location / {
        return 200 '<html><body>App</body></html>';
        add_header Content-Type text/html always;
    }

    location /admin {
        return 403 'Forbidden';
    }

    # Block all traversal-like patterns
    location ~* \.\. {
        return 403 'Forbidden';
    }
}
