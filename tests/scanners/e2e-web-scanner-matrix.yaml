name: e2e-web-scanner-matrix
description: >
  Full end-to-end pipeline test: multiple vulnerable services on a shared docker
  network exercising discovery, fingerprinting, and scanning across all scanner
  categories. Beacon runs with no --scanners filter to test the complete pipeline.
tags: [e2e, mega, full-pipeline, integration]

services:
  # ── Layer 1: Backend app server (httpbin for general HTTP testing) ──
  httpbin:
    image: mccutchen/go-httpbin:latest
    ports: ["9239:8080"]
    environment:
      PORT: "8080"

  # ── Layer 2: Vulnerable nginx (CORS, missing headers, exposed files, AI model) ──
  nginx:
    image: nginx:alpine
    ports: ["9238:80"]
    volumes:
      - ./mega-e2e/nginx-vuln.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - httpbin

  # ── Layer 3: Varnish cache (cache detection, PURGE, proxy chain) ──
  varnish:
    image: varnish:7.5-alpine
    ports: ["9240:80"]
    volumes:
      - ./mega-e2e/varnish.vcl:/etc/varnish/default.vcl:ro
    depends_on:
      - nginx

  # ── Layer 4: WAF (ModSecurity OWASP CRS) ──
  waf:
    image: owasp/modsecurity-crs:nginx-alpine
    ports: ["9241:8080"]
    environment:
      PARANOIA: "1"
      MODSEC_RULE_ENGINE: "On"
      BACKEND: "http://httpbin:8080"
      PORT: "8080"
    depends_on:
      - httpbin

  # ── Layer 5: WordPress CMS ──
  wordpress-db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wp
      MYSQL_PASSWORD: wppass

  wordpress:
    image: wordpress:6.4-apache
    ports: ["9242:80"]
    environment:
      WORDPRESS_DB_HOST: wordpress-db
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wppass
      WORDPRESS_DB_NAME: wordpress
    depends_on:
      - wordpress-db

  # ── Layer 6: Ghost CMS ──
  ghost:
    image: ghost:5-alpine
    ports: ["9243:2368"]
    environment:
      NODE_ENV: development
      url: "http://localhost:9243"

  # ── Layer 7: Drupal CMS ──
  drupal:
    image: drupal:10-apache
    ports: ["9244:80"]

  # ── Layer 8: Spring Boot (Actuator exposure) ──
  springboot:
    image: arey/springboot-petclinic:latest
    ports: ["9245:8080"]

ready:
  cmd: >
    curl -sf http://localhost:9240/health >/dev/null &&
    curl -sf http://localhost:9241/ >/dev/null &&
    curl -sf http://localhost:9242/ >/dev/null &&
    curl -sf http://localhost:9243/ >/dev/null &&
    curl -sf http://localhost:9244/ >/dev/null &&
    curl -sf http://localhost:9245/ >/dev/null
  timeout: 180s
  interval: 10s

assertions:
  # ── Exploit proofs (verify vulnerable conditions exist) ──

  - name: exploit-ai-model-exposed
    type: command
    expect:
      command: "curl -sf http://localhost:9240/model.onnx | grep -q 'ONNX'"
      exit_code: 0

  - name: exploit-no-security-headers
    type: command
    expect:
      command: "! curl -sI http://localhost:9240/ | grep -qi 'Strict-Transport-Security'"
      exit_code: 0

  - name: exploit-cors-wildcard
    type: command
    expect:
      command: "curl -sI -H 'Origin: https://evil.com' http://localhost:9240/ | grep -qi 'Access-Control-Allow-Origin'"
      exit_code: 0

  - name: exploit-cache-headers-present
    type: command
    expect:
      command: "curl -sI http://localhost:9240/ | grep -qi 'X-Cache'"
      exit_code: 0

  - name: exploit-waf-blocks-sqli
    type: command
    expect:
      command: "curl -s -o /dev/null -w '%{http_code}' 'http://localhost:9241/?q=%27%20OR%201%3D1--%20-' | grep -q '403'"
      exit_code: 0

  - name: exploit-wordpress-login
    type: command
    expect:
      command: "curl -sL -o /dev/null -w '%{http_code}' http://localhost:9242/wp-login.php | grep -qE '200|302'"
      exit_code: 0

  - name: exploit-ghost-admin
    type: command
    expect:
      command: "curl -sL -o /dev/null -w '%{http_code}' http://localhost:9243/ghost/ | grep -qE '200|301|302'"
      exit_code: 0

  - name: exploit-springboot-actuator
    type: command
    expect:
      command: "curl -sf http://localhost:9245/actuator | grep -q '_links'"
      exit_code: 0

  # ── Beacon detection assertions (full pipeline, no scanner filter) ──

  # Varnish endpoint: exposed files, headers, cache, proxy, CORS
  - name: detects-env-file
    type: beacon
    target: localhost:9240
    args: ["--no-enrich", "--no-nmap", "--scanners", "exposedfiles"]
    expect:
      min_findings: 0

  - name: detects-git-exposed
    type: beacon
    target: localhost:9240
    args: ["--no-enrich", "--no-nmap", "--scanners", "exposedfiles"]
    expect:
      min_findings: 0

  - name: detects-ai-model-file
    type: beacon
    target: localhost:9240
    args: ["--no-enrich", "--no-nmap", "--scanners", "exposedfiles"]
    expect:
      check_id: exposure.ai_model_file

  - name: detects-missing-headers
    type: beacon
    target: localhost:9240
    args: ["--no-enrich", "--no-nmap", "--scanners", "secheaders"]
    expect:
      check_id: headers.missing_hsts

  - name: detects-server-leak
    type: beacon
    target: localhost:9240
    args: ["--no-enrich", "--no-nmap", "--scanners", "secheaders"]
    expect:
      check_id: headers.server_info_leak

  - name: detects-cache-behavior
    type: beacon
    target: localhost:9240
    args: ["--no-enrich", "--no-nmap", "--scanners", "cacheprobe"]
    expect:
      check_id: cache.behavior_detected

  - name: detects-proxy-hop
    type: beacon
    target: localhost:9240
    args: ["--no-enrich", "--no-nmap", "--scanners", "proxychain"]
    expect:
      check_id: proxy.hop_detected

  - name: detects-cors-misconfig
    type: beacon
    target: localhost:9240
    args: ["--no-enrich", "--no-nmap", "--scanners", "cors", "--deep", "--yes"]
    expect:
      check_id: web.cors_misconfiguration

  # WAF endpoint
  - name: detects-waf
    type: beacon
    target: localhost:9241
    args: ["--no-enrich", "--no-nmap", "--scanners", "wafdetect"]
    expect:
      check_id: waf.detected

  # WordPress endpoint
  - name: detects-wordpress
    type: beacon
    target: localhost:9242
    args: ["--no-enrich", "--no-nmap", "--scanners", "cms-plugins"]
    expect:
      check_id: cms.plugin_found

  # Ghost endpoint
  - name: detects-ghost
    type: beacon
    target: localhost:9243
    args: ["--no-enrich", "--no-nmap", "--scanners", "cms-plugins"]
    expect:
      check_id: cms.plugin_found

  # Spring Boot endpoint
  - name: detects-spring-actuator
    type: beacon
    target: localhost:9245
    args: ["--no-enrich", "--no-nmap", "--scanners", "exposedfiles"]
    expect:
      check_id: exposure.spring_actuator

  # ── Full pipeline validation ──
  # Run beacon with no scanner filter on the varnish endpoint.
  # Validates: scan completes, JSON output valid, minimum findings found.
  - name: full-pipeline-completes-cleanly
    type: beacon
    target: localhost:9240
    args: ["--no-enrich", "--no-nmap"]
    expect:
      min_findings: 8

  # Run beacon against the WAF endpoint with no filter — should complete
  # even when WAF blocks payloads.
  - name: full-pipeline-waf-completes
    type: beacon
    target: localhost:9241
    args: ["--no-enrich", "--no-nmap"]
    expect:
      min_findings: 3

  # Validate scan exit code is 0 (clean completion)
  - name: scan-exits-cleanly
    type: command
    expect:
      command: "beacon scan --domain localhost:9240 --format json --no-enrich > /dev/null 2>&1; echo $?"
      exit_code: 0

  # Validate JSON output is parseable and contains findings array
  - name: json-output-valid
    type: command
    expect:
      command: "beacon scan --domain localhost:9240 --format json --no-enrich 2>/dev/null | python3 -c 'import sys,json; d=json.load(sys.stdin); assert isinstance(d,list) or \"findings\" in d, \"no findings key\"; print(\"OK\")'"
      exit_code: 0

timeout: 15m
