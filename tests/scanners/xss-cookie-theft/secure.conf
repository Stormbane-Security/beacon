server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    # Set session cookie WITH HttpOnly + Secure — XSS cannot steal it
    add_header Set-Cookie "session=secure-token-xyz789; Path=/; HttpOnly; Secure; SameSite=Strict" always;

    location / {
        index index.html;
    }
}
