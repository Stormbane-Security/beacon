server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    # Set session cookie WITHOUT HttpOnly — vulnerable to XSS theft
    add_header Set-Cookie "session=vulnerable-token-abc123; Path=/" always;

    location / {
        return 200 '<html><body>Vulnerable App</body></html>';
        add_header Content-Type text/html always;
    }
}
