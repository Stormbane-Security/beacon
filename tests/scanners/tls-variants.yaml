name: tls-weak-protocols
description: "nginx with TLS 1.0, TLS 1.1, and weak ciphers enabled"
tags: [tls, crypto, nginx]

services:
  nginx:
    build:
      context: ./tls-variants
    ports: ["9208:443"]

ready:
  cmd: "curl -ksf https://localhost:9208/ >/dev/null"
  timeout: 30s
  interval: 2s

assertions:
  - name: exploit-tls10-negotiates
    type: command
    expect:
      command: "openssl s_client -connect localhost:9208 -tls1 </dev/null 2>&1 | grep -q 'CONNECTED\\|Protocol.*TLSv1'"
      exit_code: 0

  - name: exploit-tls11-negotiates
    type: command
    expect:
      command: "openssl s_client -connect localhost:9208 -tls1_1 </dev/null 2>&1 | grep -q 'CONNECTED\\|Protocol.*TLSv1.1'"
      exit_code: 0

  - name: detects-tls10
    type: beacon
    target: nginx:443
    args: ["--no-enrich", "--scanners", "tlscheck", "--ports", "443"]
    expect:
      check_id: tls.protocol_tls10

  - name: detects-tls11
    type: beacon
    target: nginx:443
    args: ["--no-enrich", "--scanners", "tlscheck", "--ports", "443"]
    expect:
      check_id: tls.protocol_tls11

  - name: detects-self-signed
    type: beacon
    target: nginx:443
    args: ["--no-enrich", "--scanners", "tlscheck", "--ports", "443"]
    expect:
      check_id: tls.cert_self_signed

timeout: 5m
