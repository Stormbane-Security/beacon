name: couchdb-detection
description: >
  CouchDB with admin credentials on a non-standard port. Beacon should
  detect the CouchDB service via portscan probes and flag it as an
  exposed database.
tags: [couchdb, database, nosql, portscan, detection]

services:
  couchdb:
    image: couchdb:latest
    ports: ["19872:5984"]
    environment:
      COUCHDB_USER: admin
      COUCHDB_PASSWORD: password

ready:
  cmd: "curl -sf http://localhost:19872/ | grep -q couchdb"
  timeout: 60s
  interval: 3s

assertions:
  # Pre-flight: CouchDB root endpoint accessible
  - name: couchdb-root-accessible
    type: command
    expect:
      command: "curl -sf http://localhost:19872/ | grep -q couchdb"
      exit_code: 0

  # Detection: beacon identifies CouchDB as exposed database
  - name: detects-couchdb
    type: beacon
    target: localhost:19872
    args: ["--no-enrich", "--no-nmap", "--scanners", "portscan"]
    expect:
      check_id: port.database_exposed

  # Service identified
  - name: couchdb-service-identified
    type: beacon
    target: localhost:19872
    args: ["--no-enrich", "--no-nmap", "--scanners", "portscan"]
    expect:
      check_id: port.service_identified

  # Negative: should not detect elasticsearch
  - name: no-false-positive-elasticsearch
    type: beacon
    target: localhost:19872
    args: ["--no-enrich", "--no-nmap", "--scanners", "portscan"]
    expect:
      not_check_id: port.elasticsearch_unauthenticated

timeout: 5m
