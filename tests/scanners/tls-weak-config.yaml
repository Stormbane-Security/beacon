name: tls-weak-config
description: >
  Nginx with SHA-1 cert, 730-day validity, CN-only (no SAN), TLS 1.0/1.1
  enabled, and non-PFS ciphers. Triggers cert and protocol findings.
tags: [tls, scanner, crypto]

services:
  nginx-tls:
    build:
      context: ./tls-weak-config
      dockerfile: Dockerfile
    ports: ["19840:443"]

ready:
  cmd: "openssl s_client -connect localhost:19840 </dev/null 2>/dev/null | grep -q 'CONNECTED'"
  timeout: 30s
  interval: 2s

assertions:
  # --- Exploit proofs ---
  - name: exploit-sha1-signature
    type: command
    expect:
      command: "openssl s_client -connect localhost:19840 </dev/null 2>/dev/null | openssl x509 -noout -text 2>/dev/null | grep -qi 'sha1WithRSAEncryption'"
      exit_code: 0

  - name: exploit-long-validity
    type: command
    expect:
      command: "openssl s_client -connect localhost:19840 </dev/null 2>/dev/null | openssl x509 -noout -dates 2>/dev/null | grep -q 'notAfter'"
      exit_code: 0

  - name: exploit-no-san
    type: command
    expect:
      command: "! openssl s_client -connect localhost:19840 </dev/null 2>/dev/null | openssl x509 -noout -ext subjectAltName 2>/dev/null | grep -qi 'DNS\\|IP'"
      exit_code: 0

  - name: exploit-tls10-accepted
    type: command
    expect:
      command: "openssl s_client -connect localhost:19840 -tls1 </dev/null 2>&1 | grep -q 'CONNECTED\\|Protocol.*TLSv1'"
      exit_code: 0

  - name: exploit-non-pfs-cipher
    type: command
    expect:
      command: "openssl s_client -connect localhost:19840 </dev/null 2>&1 | grep -i 'cipher' | grep -qi 'AES.*-SHA\\|DES-CBC3-SHA'"
      exit_code: 0

  # --- Beacon scanner detections ---
  - name: detects-tls10-protocol
    type: beacon
    target: localhost:19840
    args: ["--no-enrich", "--scanners", "tlscheck", "--ports", "443"]
    expect:
      check_id: tls.protocol_tls10

  - name: detects-tls11-protocol
    type: beacon
    target: localhost:19840
    args: ["--no-enrich", "--scanners", "tlscheck", "--ports", "443"]
    expect:
      check_id: tls.protocol_tls11

  - name: detects-weak-signature
    type: beacon
    target: localhost:19840
    args: ["--no-enrich", "--scanners", "tlscheck", "--ports", "443"]
    expect:
      check_id: tls.cert_weak_sig

  - name: detects-long-validity
    type: beacon
    target: localhost:19840
    args: ["--no-enrich", "--scanners", "tlscheck", "--ports", "443"]
    expect:
      check_id: tls.cert_long_validity

  - name: detects-san-missing
    type: beacon
    target: localhost:19840
    args: ["--no-enrich", "--scanners", "tlscheck", "--ports", "443"]
    expect:
      check_id: tls.cert_san_missing

  - name: detects-no-pfs
    type: beacon
    target: localhost:19840
    args: ["--no-enrich", "--scanners", "tlscheck", "--ports", "443"]
    expect:
      check_id: tls.no_pfs

  - name: detects-self-signed
    type: beacon
    target: localhost:19840
    args: ["--no-enrich", "--scanners", "tlscheck", "--ports", "443"]
    expect:
      check_id: tls.cert_self_signed

  # --- Negative: no injection findings on static page ---
  - name: negative-no-sqli
    type: beacon
    target: localhost:19840
    args: ["--no-enrich", "--scanners", "tlscheck", "--ports", "443"]
    expect:
      absent_check_id: web.sqli

timeout: 5m
