server {
    listen 80;
    server_name localhost;

    location / {
        add_header Set-Cookie "session=abc123; SameSite=Strict; Secure; HttpOnly" always;
        add_header Content-Type text/html always;
        return 200 '<html><body><form method="POST" action="/submit"><input type="hidden" name="csrf_token" value="tok123"><input type="submit"></form></body></html>';
    }

    location /submit {
        if ($request_method != POST) {
            return 405;
        }
        return 200 'ok';
    }
}
