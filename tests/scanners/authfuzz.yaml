name: authfuzz-keycloak
description: >
  Keycloak identity provider with OAuth/OIDC endpoints. Beacon authfuzz
  scanner probes for redirect abuse, token substitution, and code
  interception in OAuth flows.
tags: [authfuzz, scanner, auth, oauth]

services:
  keycloak:
    image: quay.io/keycloak/keycloak:22.0
    ports: ["9270:8080"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    command: ["start-dev"]

ready:
  cmd: "curl -sf http://localhost:9270/ -o /dev/null -w '%{http_code}' | grep -qE '200|302|303'"
  timeout: 180s
  interval: 5s

assertions:
  - name: exploit-oauth-endpoint-exists
    type: command
    expect:
      command: "curl -sf http://localhost:9270/realms/master/.well-known/openid-configuration | grep -q 'authorization_endpoint'"
      exit_code: 0

  - name: authfuzz-scan-completes
    type: beacon
    target: localhost:9270
    args: ["--no-enrich", "--scanners", "authfuzz", "--deep", "--permission-confirmed"]
    expect:
      min_findings: 0

timeout: 10m
