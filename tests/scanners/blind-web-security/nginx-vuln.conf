server {
    listen 80;
    server_name _;

    # Deliberately vulnerable: CORS wildcard, no security headers
    add_header Access-Control-Allow-Origin * always;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # Exposed .env file
    location /.env {
        default_type text/plain;
        return 200 'DATABASE_URL=postgresql://admin:secret@db:5432/prod\nAPI_KEY=sk-live-vuln-test-key\n';
    }

    # Exposed .git/config
    location /.git/config {
        default_type text/plain;
        return 200 '[core]\n\trepositoryformatversion = 0\n\tfilemode = true\n[remote "origin"]\n\turl = git@github.com:corp/internal-app.git\n';
    }
}
