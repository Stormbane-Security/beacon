name: proxychain-multilayer
description: "Multi-layer proxy chain: nginx (edge) → HAProxy (LB) → httpbin (app) — beacon detects proxy.chain_detected and individual hops"
tags: [proxychain, scanner, web, topology]

services:
  httpbin:
    image: mccutchen/go-httpbin:latest
    expose: ["8080"]
    environment:
      PORT: "8080"

  haproxy:
    image: haproxy:2.9-alpine
    expose: ["80"]
    volumes:
      - ./proxychain/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - httpbin

  nginx:
    image: nginx:alpine
    ports: ["9230:80"]
    volumes:
      - ./proxychain/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - haproxy

ready:
  cmd: "curl -sf http://localhost:9230/health >/dev/null"
  timeout: 60s
  interval: 3s

assertions:
  - name: exploit-via-header-shows-chain
    type: command
    expect:
      command: "curl -sI http://localhost:9230/ | grep -i 'Via' | grep -qi 'haproxy\\|nginx'"
      exit_code: 0

  - name: exploit-multiple-layers-visible
    type: command
    expect:
      command: "curl -sI http://localhost:9230/ | grep -ci 'Via' | grep -qE '^[1-9]'"
      exit_code: 0

  - name: detects-proxy-chain
    type: beacon
    target: localhost:9230
    args: ["--no-enrich", "--no-nmap", "--scanners", "proxychain"]
    expect:
      check_id: proxy.hop_detected

  - name: detects-proxy-trace-enabled
    type: beacon
    target: localhost:9230
    args: ["--no-enrich", "--no-nmap", "--scanners", "proxychain", "--deep", "--yes"]
    expect:
      check_id: proxy.trace_enabled

timeout: 5m
