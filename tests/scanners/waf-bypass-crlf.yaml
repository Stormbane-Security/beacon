name: waf-bypass-crlf
description: >
  Web application behind ModSecurity WAF with CRLF injection in redirect
  parameters. Standard %0d%0a payloads are blocked. Beacon should use
  evasion variants (double encoding, Unicode, mixed case hex) to bypass
  and confirm the CRLF injection vulnerability.

services:
  webapp:
    image: mccutchen/go-httpbin:latest
    environment:
      PORT: "8080"
    expose: ["8080"]

  waf:
    image: owasp/modsecurity-crs:nginx-alpine
    ports: ["80:80"]
    environment:
      BACKEND: "http://webapp:8080"
      PARANOIA: "2"
    depends_on: [webapp]

assertions:
  # Beacon with evasion should detect CRLF possibilities
  - name: beacon-crlf-scan
    type: beacon
    target: localhost
    args: ["--deep", "--yes", "--no-nmap", "--scanners", "crlf", "--format", "json", "/tmp/results.json"]
    expect:
      min_findings: 1
