name: gateway-varnish-debug-exposed
description: >
  Nginx mock responding with Varnish debug headers (X-Varnish-Cache, X-Cache-Debug).
  Beacon gateway scanner should detect gateway.varnish_debug_info from the debug
  headers in the response.
tags: [gateway, varnish, debug, scanner]

services:
  varnish-mock:
    image: nginx:alpine
    ports: ["20230:80"]
    volumes:
      - ./gateway-varnish-mock/nginx.conf:/etc/nginx/conf.d/default.conf:ro

ready:
  cmd: "curl -sf http://localhost:20230/ >/dev/null"
  timeout: 30s
  interval: 2s

assertions:
  - name: exploit-varnish-debug-headers-present
    type: command
    expect:
      command: "curl -sI http://localhost:20230/ | grep -qi 'X-Varnish-Cache'"
      exit_code: 0

  - name: detects-varnish-debug-info
    type: beacon
    target: localhost:20230
    args: ["--no-enrich", "--no-nmap", "--scanners", "gateway"]
    expect:
      check_id: gateway.varnish_debug_info

timeout: 3m
