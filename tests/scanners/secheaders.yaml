name: secheaders-missing
description: "Default nginx returns no security headers — scanner should detect all missing"
tags: [secheaders, scanner, web, nginx]

services:
  app:
    image: nginx:1.27-alpine
    ports: ["9280:80"]

ready:
  cmd: "curl -sfo /dev/null http://localhost:9280/"
  timeout: 60s
  interval: 3s

assertions:
  - name: detects-missing-csp
    type: beacon
    target: app:80
    args: ["--no-enrich", "--scanners", "secheaders", "--ports", "80"]
    expect:
      check_id: headers.missing_csp

  - name: detects-missing-hsts
    type: beacon
    target: app:80
    args: ["--no-enrich", "--scanners", "secheaders", "--ports", "80"]
    expect:
      check_id: headers.missing_hsts

  - name: detects-missing-x-frame-options
    type: beacon
    target: app:80
    args: ["--no-enrich", "--scanners", "secheaders", "--ports", "80"]
    expect:
      check_id: headers.missing_x_frame_options

  - name: detects-server-version-leak
    type: beacon
    target: app:80
    args: ["--no-enrich", "--scanners", "secheaders", "--ports", "80"]
    expect:
      check_id: headers.server_info_leak

timeout: 5m
