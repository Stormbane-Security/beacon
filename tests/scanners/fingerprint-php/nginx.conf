server {
    listen 80;
    server_name _;

    # Simulate a WordPress site
    location / {
        add_header X-Powered-By 'PHP/8.1.2';
        add_header Set-Cookie 'PHPSESSID=abc123; path=/';
        return 200 '<!DOCTYPE html>
<html>
<head>
<meta name="generator" content="WordPress 6.4.2">
<link rel="stylesheet" href="/wp-content/themes/flavor/style.css">
</head>
<body>
<script src="/wp-includes/js/jquery/jquery.min.js"></script>
</body>
</html>';
        default_type text/html;
    }

    location /wp-login.php {
        add_header X-Powered-By 'PHP/8.1.2';
        return 200 '<html><body><form method="POST"><input name="log"><input name="pwd"><button>Login</button></form></body></html>';
        default_type text/html;
    }

    location /health {
        return 200 'OK';
        add_header Content-Type text/plain;
    }
}
