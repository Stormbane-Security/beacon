name: crlf-injection
description: "Python app that reflects user input in HTTP headers without sanitization triggers web.crlf_injection"
tags: [crlf, scanner, web]

services:
  crlf-app:
    build:
      context: ./crlf
      dockerfile: Dockerfile
    ports: ["8080:8080"]

ready:
  cmd: "curl -sf http://localhost:8080/health >/dev/null"
  timeout: 30s
  interval: 2s

assertions:
  - name: detects-crlf-injection
    type: beacon
    target: crlf-app
    args: ["--no-enrich", "--scanners", "crlf", "--deep", "--permission-confirmed", "--ports", "8080"]
    expect:
      check_id: web.crlf_injection

timeout: 5m
