name: auth-bearer-token
description: >
  Tests authenticated scanning with a bearer token. API behind token auth
  returns different data when authenticated vs unauthenticated.
tags: [auth, bearer, token, integration]

services:
  # nginx that requires Authorization: Bearer header
  api:
    image: nginx:alpine
    ports: ["19986:80"]
    volumes:
      - ./auth-bearer-token/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./auth-bearer-token/index.html:/var/www/html/index.html:ro
      - ./auth-bearer-token/env-file:/var/www/html/.env:ro

ready:
  cmd: "curl -sf -H 'Authorization: Bearer secret-test-token-12345' http://localhost:19986/ >/dev/null"
  timeout: 30s
  interval: 2s

assertions:
  # Without token: 401
  - name: no-token-401
    type: command
    expect:
      command: "curl -s -o /dev/null -w '%{http_code}' http://localhost:19986/ | grep -q '401'"
      exit_code: 0

  # With token: 200
  - name: with-token-200
    type: command
    expect:
      command: "curl -sf -H 'Authorization: Bearer secret-test-token-12345' http://localhost:19986/ | grep -q 'Welcome'"
      exit_code: 0

  # Beacon with bearer token finds .env
  - name: beacon-bearer-finds-env
    type: beacon
    target: localhost:19986
    auth:
      method: bearer
      token: "secret-test-token-12345"
    args: ["--no-enrich", "--no-nmap", "--scanners", "exposedfiles"]
    expect:
      check_id: exposure.env_file_exposed

  # Beacon without token finds nothing
  - name: beacon-no-token-no-env
    type: beacon
    target: localhost:19986
    args: ["--no-enrich", "--no-nmap", "--scanners", "exposedfiles"]
    expect:
      not_check_id: exposure.env_file_exposed

timeout: 5m
