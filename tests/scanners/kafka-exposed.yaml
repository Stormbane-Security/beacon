name: kafka-exposed
description: >
  Apache Kafka broker with no authentication. Beacon should detect the
  exposed Kafka broker via protocol probing on the listener port.
tags: [kafka, messaging, portscan, detection]

services:
  kafka:
    image: bitnami/kafka:3.6
    ports: ["9092:9092"]
    environment:
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_PROCESS_ROLES: "broker,controller"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@localhost:9093"
      KAFKA_CFG_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://localhost:9092"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      ALLOW_PLAINTEXT_LISTENER: "yes"

ready:
  cmd: "echo 'test' | nc -w2 localhost 9092 >/dev/null 2>&1"
  timeout: 90s
  interval: 5s

assertions:
  - name: detects-kafka-exposed
    type: beacon
    target: localhost:9092
    args: ["--no-enrich", "--scanners", "portscan", "--ports", "9092"]
    expect:
      check_id: port.kafka_exposed

timeout: 5m
