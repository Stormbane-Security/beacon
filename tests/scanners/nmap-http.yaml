name: nmap-http-scripts
description: >
  Nginx with custom config exposing robots.txt with Disallow entries, a page
  title, and WebDAV methods enabled — nmap http-title, http-robots.txt, and
  http-methods NSE scripts should produce findings.
tags: [nmap, http, portscan, fingerprint]

services:
  nginx:
    image: nginx:alpine
    ports: ["18080:80"]
    volumes:
      - type: bind
        source: ./fixtures/nmap-http
        target: /usr/share/nginx/html
        read_only: true
      - type: bind
        source: ./fixtures/nmap-http/nginx-dav.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true

ready:
  cmd: "curl -sf http://localhost:18080/ >/dev/null"
  timeout: 60s
  interval: 3s

assertions:
  - name: nmap-http-title
    type: beacon
    target: localhost
    args: ["--no-enrich", "--no-db", "--scanners", "portscan", "--ports", "18080"]
    expect:
      check_id: nmap.http_title

  - name: nmap-http-robots
    type: beacon
    target: localhost
    args: ["--no-enrich", "--no-db", "--scanners", "portscan", "--ports", "18080"]
    expect:
      check_id: nmap.http_robots_disallow

  - name: nmap-http-methods-dangerous
    type: beacon
    target: localhost
    args: ["--no-enrich", "--no-db", "--scanners", "portscan", "--ports", "18080"]
    expect:
      check_id: nmap.http_dangerous_methods

timeout: 5m
