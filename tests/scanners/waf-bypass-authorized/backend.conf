server {
    listen 80;

    # /admin is served normally — the WAF in front should block it.
    # But path normalization tricks (//admin, /./admin) reach the backend
    # because nginx normalizes paths before matching location blocks.
    location /admin {
        return 200 'admin panel';
        add_header Content-Type text/plain;
    }

    # Support X-HTTP-Method-Override in the backend:
    # GET with X-HTTP-Method-Override: POST returns different content
    location /api {
        if ($http_x_http_method_override = "POST") {
            return 200 'method-override-accepted';
        }
        return 200 'api-get';
        add_header Content-Type text/plain;
    }

    location / {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
