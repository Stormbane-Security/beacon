name: saml-keycloak
description: >
  Keycloak identity provider with SAML metadata endpoints exposed.
  Beacon SAML scanner should detect saml.metadata_exposed and
  saml.endpoint_exposed.
tags: [saml, scanner, auth, sso]

services:
  keycloak:
    image: quay.io/keycloak/keycloak:22.0
    ports: ["9268:8080"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    command: ["start-dev"]

ready:
  cmd: "curl -sf http://localhost:9268/ -o /dev/null -w '%{http_code}' | grep -qE '200|302|303'"
  timeout: 180s
  interval: 5s

assertions:
  - name: exploit-saml-metadata-accessible
    type: command
    expect:
      command: "curl -sf http://localhost:9268/realms/master/protocol/saml/descriptor | grep -qi 'EntityDescriptor'"
      exit_code: 0

  - name: detects-saml-metadata-exposed
    type: beacon
    target: localhost:9268
    args: ["--no-enrich", "--scanners", "saml"]
    expect:
      check_id: saml.metadata_exposed

timeout: 10m
