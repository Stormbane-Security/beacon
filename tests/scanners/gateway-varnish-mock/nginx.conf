server {
    listen 80;
    server_name _;

    location / {
        # Simulate Varnish debug headers in response
        add_header X-Varnish-Cache "HIT" always;
        add_header X-Cache-Debug "true" always;
        add_header Via "1.1 varnish (Varnish/7.4)" always;
        return 200 'ok';
        default_type text/plain;
    }
}
