server {
    listen 80;
    server_name _;

    root /var/www/html;

    # Require Bearer token for all requests
    set $auth_ok 0;
    if ($http_authorization = "Bearer secret-test-token-12345") {
        set $auth_ok 1;
    }
    if ($auth_ok = 0) {
        return 401 '{"error":"unauthorized"}';
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
