name: mongo-version-fingerprint
description: >
  MongoDB 4.4 (no auth configured) vs MongoDB 7.0 (auth enabled with root creds).
  Tests unauthenticated access detection and false positive absence on the
  authenticated instance.
tags: [mongo, mongodb, portscan, fingerprint, version, false-positive, exploit]

services:
  mongo-old:
    image: mongo:4.4
    ports: ["19580:27017"]

  mongo-new:
    image: mongo:7.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: securepassword123
    ports: ["19581:27017"]

ready:
  cmd: "mongosh --host localhost --port 19580 --eval 'db.runCommand({ping:1})' --quiet 2>/dev/null || mongo --host localhost --port 19580 --eval 'db.runCommand({ping:1})' --quiet 2>/dev/null"
  timeout: 60s
  interval: 3s

assertions:
  # --- Pre-flight ---
  - name: mongo-old-accessible
    type: command
    expect:
      command: "(mongosh --host localhost --port 19580 --eval 'db.runCommand({ping:1})' --quiet || mongo --host localhost --port 19580 --eval 'db.runCommand({ping:1})' --quiet) 2>/dev/null | grep -q 'ok'"
      exit_code: 0

  # --- Old MongoDB: unauthenticated access detected ---
  - name: detects-mongo-old-unauth
    type: beacon
    target: localhost:19580
    args: ["--no-enrich", "--scanners", "portscan", "--ports", "19580"]
    expect:
      check_id: port.database_exposed

  # --- Old MongoDB: exploit chain fires ---
  - name: mongo-old-exploit-chain
    type: beacon
    target: localhost:19580
    args: ["--no-enrich", "--scanners", "portscan", "--ports", "19580", "--deep", "--permission-confirmed"]
    expect:
      check_id: exploit.lateral_movement

  # --- New MongoDB: NO unauthenticated access ---
  - name: negative-mongo-new-no-unauth
    type: beacon
    target: localhost:19581
    args: ["--no-enrich", "--scanners", "portscan", "--ports", "19581"]
    expect:
      not_check_id: port.database_exposed

  # --- New MongoDB: NO exploit chain fires ---
  - name: negative-mongo-new-no-exploit
    type: beacon
    target: localhost:19581
    args: ["--no-enrich", "--scanners", "portscan", "--ports", "19581", "--deep", "--permission-confirmed"]
    expect:
      not_check_id: exploit.lateral_movement

timeout: 5m
