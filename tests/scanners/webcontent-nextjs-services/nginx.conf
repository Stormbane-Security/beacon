server {
    listen 80;
    server_name _;

    # Simulates a Next.js application with build manifest, page chunks,
    # and external service references embedded in JavaScript bundles.
    # Tests both chunk discovery and service reference extraction.

    location = / {
        default_type text/html;
        return 200 '<html>
<head><title>Nexus Dashboard</title></head>
<body>
<div id="__next"></div>
<script id="__NEXT_DATA__" type="application/json">{"buildId":"test-build-abc123","props":{"pageProps":{}},"page":"/"}</script>
<script src="/_next/static/chunks/main-aabb1122.js"></script>
<script src="/_next/static/chunks/pages/_app-ccdd3344.js"></script>
</body>
</html>';
    }

    # Next.js build manifest — lists all page chunks
    location = /_next/static/test-build-abc123/_buildManifest.js {
        default_type application/javascript;
        return 200 'self.__BUILD_MANIFEST={
  "/": ["static/chunks/pages/index-1a2b3c4d.js"],
  "/dashboard": ["static/chunks/pages/dashboard-5e6f7a8b.js"],
  "/settings": ["static/chunks/pages/settings-9c0d1e2f.js"],
  sortedPages:["/","/dashboard","/settings"]
};
self.__BUILD_MANIFEST_CB && self.__BUILD_MANIFEST_CB();';
    }

    # Main app chunk — references Stripe and Sentry
    location = /_next/static/chunks/main-aabb1122.js {
        default_type application/javascript;
        return 200 '
// Main application bundle
import { loadStripe } from "@stripe/stripe-js";
const stripe = loadStripe(process.env.NEXT_PUBLIC_STRIPE_KEY);
fetch("https://api.stripe.com/v1/payment_intents", {
    headers: { "Authorization": "Bearer " + process.env.STRIPE_SECRET_KEY }
});
// Error tracking
import * as Sentry from "@sentry/nextjs";
Sentry.init({ dsn: "https://abc123@o456.sentry.io/api/789" });
';
    }

    # Dashboard chunk — references Helius RPC and Auth0
    location = /_next/static/chunks/pages/dashboard-5e6f7a8b.js {
        default_type application/javascript;
        return 200 '
// Dashboard page
import { Connection } from "@solana/web3.js";
const HELIUS_RPC = "https://mainnet.helius-rpc.com/?api-key=${p.env.HELIUS_API_KEY}";
const conn = new Connection(HELIUS_RPC);
// Auth
const auth0Domain = "https://myapp.auth0.com/authorize?client_id=abc123";
fetch(auth0Domain);
';
    }

    # Index page chunk — references Supabase and Segment
    location = /_next/static/chunks/pages/index-1a2b3c4d.js {
        default_type application/javascript;
        return 200 '
// Index page
import { createClient } from "@supabase/supabase-js";
const supabase = createClient("https://xyzproject.supabase.co", process.env.NEXT_PUBLIC_SUPABASE_ANON_KEY);
// Analytics
fetch("https://api.segment.io/v1/track", {
    method: "POST",
    body: JSON.stringify({ event: "page_view" })
});
';
    }

    # Settings chunk — references SendGrid
    location = /_next/static/chunks/pages/settings-9c0d1e2f.js {
        default_type application/javascript;
        return 200 '
// Settings page
async function sendNotification(email, msg) {
    await fetch("https://api.sendgrid.com/v3/mail/send", {
        method: "POST",
        headers: {
            "Authorization": "Bearer " + SENDGRID_API_KEY,
            "Content-Type": "application/json"
        }
    });
}
';
    }

    # App chunk — no external services (negative test)
    location = /_next/static/chunks/pages/_app-ccdd3344.js {
        default_type application/javascript;
        return 200 '
// App layout wrapper
import React from "react";
export default function App({ Component, pageProps }) {
    return React.createElement(Component, pageProps);
}
';
    }

    location / {
        return 404;
    }
}
