server {
    listen 80;
    server_name _;

    # Deserialization test: serves Java magic bytes in /api response,
    # .NET ViewState in /login.aspx, and accepts POST with serialized content-type.

    # Java serialized object: response contains rO0AB (base64 Java magic)
    location = /api {
        default_type application/octet-stream;
        add_header X-Powered-By "Apache-Coyote/1.1";
        return 200 'rO0ABXNyABdjb20uZXhhbXBsZS5Vc2VyU2Vzc2lvbg==';
    }

    # .NET ViewState: unencrypted (starts with /wE)
    location = /login.aspx {
        default_type text/html;
        add_header X-Powered-By "ASP.NET";
        return 200 '<html><body>
<form method="POST" action="/login.aspx">
<input type="hidden" name="__VIEWSTATE" value="/wEPDwULLTE2MTY2ODcyMjkPFgIeA2Zvbw==">
<input type="hidden" name="__EVENTVALIDATION" value="/wEdAATh7n3bBQAAAB+LCAAAAAAABgC7BgBBuw==">
<input type="text" name="username">
<input type="password" name="password">
<button type="submit">Login</button>
</form>
</body></html>';
    }

    # POST to /api accepts Java serialized content and returns error
    location = /api/v1 {
        default_type application/json;
        if ($request_method = POST) {
            return 500 '{"error":"java.io.StreamCorruptedException: invalid stream header","trace":"at java.io.ObjectInputStream.readStreamHeader"}';
        }
        return 200 '{"version":"v1"}';
    }

    location = / {
        default_type text/html;
        return 200 '<html><body><h1>App</h1></body></html>';
    }

    location /default.aspx {
        default_type text/html;
        add_header X-Powered-By "ASP.NET";
        return 200 '<html><body>
<form method="POST" action="/default.aspx">
<input type="hidden" name="__VIEWSTATE" value="/wEPDwULLTE2MTY2ODcyMjkPFgIeA2Zvbw==">
<button type="submit">Submit</button>
</form>
</body></html>';
    }
}
