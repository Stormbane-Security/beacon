name: exposedfiles
description: >
  Nginx serving common exposed files: .env, .git/config, and
  robots.txt with sensitive path leaks. Beacon exposedfiles and
  robotsmap scanners should detect exposures.
tags: [exposedfiles, scanner, exposure]

services:
  nginx:
    image: nginx:alpine
    ports: ["9252:80"]
    volumes:
      - ./exposedfiles/nginx.conf:/etc/nginx/conf.d/default.conf:ro

ready:
  cmd: "curl -sf http://localhost:9252/ >/dev/null"
  timeout: 30s
  interval: 2s

assertions:
  # Exploit proofs
  - name: exploit-robots-leaks-paths
    type: command
    expect:
      command: "curl -sf http://localhost:9252/robots.txt | grep -q '/admin/'"
      exit_code: 0

  # Beacon detection assertions
  - name: detects-env-file
    type: beacon
    target: localhost:9252
    args: ["--no-enrich", "--no-nmap", "--scanners", "exposedfiles"]
    expect:
      check_id: exposure.env_file_exposed

  - name: detects-git-exposed
    type: beacon
    target: localhost:9252
    args: ["--no-enrich", "--no-nmap", "--scanners", "exposedfiles"]
    expect:
      check_id: exposure.git_exposed

  - name: detects-robots-sensitive-path
    type: beacon
    target: localhost:9252
    args: ["--no-enrich", "--no-nmap", "--scanners", "robotsmap"]
    expect:
      check_id: exposure.robots_sensitive_path

timeout: 5m
