server {
    listen 80;

    # Root path proxies to sqli-labs Lesson 1 (real MySQL SQLi in ?id= parameter).
    # Beacon's sqli scanner probes /?id=1 with SLEEP payloads — the proxy maps
    # this to /Less-1/?id=1 on the sqli-labs container.
    location = / {
        proxy_pass http://sqli-app/Less-1/;
    }

    # All other paths pass through for setup, static assets, etc.
    location / {
        proxy_pass http://sqli-app/;
    }
}
