server {
    listen 80;
    server_name _;

    # Missing security headers (headers.missing_csp, headers.missing_hsts, headers.server_info_leak)
    # Insecure cookies (cookie.missing_secure)
    # CORS misconfiguration (web.cors_misconfiguration)

    add_header Set-Cookie "session_id=abc123; Path=/" always;
    add_header Access-Control-Allow-Origin * always;
    add_header Access-Control-Allow-Credentials true always;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # Exposed .env file (exposure.env_file_exposed)
    location = /.env {
        default_type text/plain;
        return 200 'DATABASE_URL=postgres://admin:secret@db:5432/prod
SECRET_KEY=supersecretkey123
API_KEY=sk-test-1234567890
';
    }

    # Exposed .git/config (exposure.git_exposed)
    location = /.git/config {
        default_type text/plain;
        return 200 '[core]
	repositoryformatversion = 0
	filemode = true
	bare = false
	logallrefcount = true
[remote "origin"]
	url = git@github.com:company/internal-app.git
	fetch = +refs/heads/*:refs/remotes/origin/*
';
    }

    location = /.git/HEAD {
        default_type text/plain;
        return 200 'ref: refs/heads/main
';
    }

    # Exposed AI model file (exposure.ai_model_file)
    location = /model.onnx {
        default_type application/octet-stream;
        return 200 'ONNX-MODEL-BINARY-DATA';
    }

    # Unsafe CSP (csp.unsafe_inline)
    location /csp-test {
        add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval'; script-src *";
        default_type text/html;
        return 200 '<html><body><h1>CSP Test</h1></body></html>';
    }

    # Proxy chain detection — add Via header
    add_header Via "1.1 nginx-edge" always;

    location /health {
        return 200 'OK';
        add_header Content-Type text/plain;
    }
}
