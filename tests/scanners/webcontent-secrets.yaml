name: webcontent-secrets-exposed
description: >
  Nginx serving HTML with insecure session cookies (missing Secure/HttpOnly/SameSite),
  permissive CSP (script-src *), leaked API key in response header, and JavaScript
  files containing hardcoded secrets (AWS keys, GitHub tokens, Stripe keys),
  internal endpoints (192.168.x, .internal), and API keys in URL parameters.
tags: [webcontent, scanner, web, secrets, cookies, csp]

services:
  app:
    image: nginx:alpine
    ports: ["9283:80"]
    volumes:
      - ./webcontent-secrets/nginx.conf:/etc/nginx/conf.d/default.conf:ro

ready:
  cmd: "curl -sf http://localhost:9283/ >/dev/null"
  timeout: 30s
  interval: 2s

assertions:
  - name: exploit-insecure-cookie-set
    type: command
    expect:
      command: "curl -sI http://localhost:9283/ | grep -i 'Set-Cookie.*session_id' | grep -v 'HttpOnly'"
      exit_code: 0

  - name: exploit-csp-wildcard
    type: command
    expect:
      command: "curl -sI http://localhost:9283/ | grep -i 'Content-Security-Policy.*script-src.*\\*'"
      exit_code: 0

  - name: exploit-aws-key-in-js
    type: command
    expect:
      command: "curl -sf http://localhost:9283/static/app.js | grep -q 'AKIA'"
      exit_code: 0

  - name: exploit-internal-endpoint-in-js
    type: command
    expect:
      command: "curl -sf http://localhost:9283/static/app.js | grep -q '192.168'"
      exit_code: 0

  - name: exploit-api-key-in-url
    type: command
    expect:
      command: "curl -sf http://localhost:9283/static/app.js | grep -q 'api_key='"
      exit_code: 0

  - name: detects-cookie-missing-httponly
    type: beacon
    target: localhost:9283
    args: ["--no-enrich", "--no-nmap", "--scanners", "webcontent"]
    expect:
      check_id: cookie.missing_httponly

  - name: detects-cookie-missing-samesite
    type: beacon
    target: localhost:9283
    args: ["--no-enrich", "--no-nmap", "--scanners", "webcontent"]
    expect:
      check_id: cookie.missing_samesite

  - name: detects-csp-wildcard-source
    type: beacon
    target: localhost:9283
    args: ["--no-enrich", "--no-nmap", "--scanners", "webcontent"]
    expect:
      check_id: csp.wildcard_source

  - name: detects-js-hardcoded-secret
    type: beacon
    target: localhost:9283
    args: ["--no-enrich", "--no-nmap", "--scanners", "webcontent"]
    expect:
      check_id: js.hardcoded_secret

  - name: detects-js-internal-endpoint
    type: beacon
    target: localhost:9283
    args: ["--no-enrich", "--no-nmap", "--scanners", "webcontent"]
    expect:
      check_id: js.internal_endpoint

timeout: 5m
