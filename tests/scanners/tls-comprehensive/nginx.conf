server {
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;

    # Weak ciphers: non-PFS, CBC mode
    ssl_protocols TLSv1.2;
    ssl_ciphers 'AES128-SHA:AES256-SHA:DES-CBC3-SHA';
    ssl_prefer_server_ciphers on;

    location / {
        # Weak HSTS: short max-age (60s), no includeSubDomains, no preload
        add_header Strict-Transport-Security "max-age=60" always;
        add_header Content-Type text/plain always;
        return 200 'TLS comprehensive test';
    }

    location /health {
        add_header Strict-Transport-Security "max-age=60" always;
        return 200 'ok';
    }
}
