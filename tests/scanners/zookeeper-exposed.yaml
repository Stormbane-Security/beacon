name: zookeeper-exposed
description: >
  Apache ZooKeeper with no authentication. Beacon should detect the
  exposed ZooKeeper service via the 4-letter command protocol.
tags: [zookeeper, portscan, detection]

services:
  zookeeper:
    image: zookeeper:latest
    ports: ["20117:2181"]

ready:
  cmd: "echo ruok | nc -w2 localhost 20117 | grep -q imok"
  timeout: 60s
  interval: 3s

assertions:
  # Pre-flight: ZooKeeper responds to 4-letter commands
  - name: zookeeper-responds
    type: command
    expect:
      command: "echo ruok | nc -w2 localhost 20117 | grep -q imok"
      exit_code: 0

  # Scanner: beacon detects exposed ZooKeeper
  - name: detects-zookeeper-exposed
    type: beacon
    target: localhost:20117
    args: ["--no-enrich", "--no-nmap", "--scanners", "portscan"]
    expect:
      min_findings: 1

  # --- Exploit-mode assertions ---
  - name: exploit-chain-zookeeper
    type: beacon
    target: localhost:20117
    args: ["--no-enrich", "--no-nmap", "--scanners", "portscan", "--deep", "--exploit", "--yes", "--ports", "20117"]
    expect:
      min_findings: 0

  - name: postexploit-zookeeper
    type: beacon
    target: localhost:20117
    args: ["--no-enrich", "--no-nmap", "--scanners", "portscan", "--exploit", "--yes", "--ports", "20117"]
    expect:
      min_findings: 0

timeout: 5m
