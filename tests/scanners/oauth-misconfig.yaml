name: oauth-misconfiguration
description: >
  Node.js OAuth provider with open redirect_uri, OIDC discovery exposed,
  and token endpoint accepting unauthenticated requests. Beacon oauth
  scanner should detect redirect_uri abuse and metadata exposure.
tags: [oauth, scanner, auth, oidc]

services:
  app:
    image: node:20-alpine
    ports: ["19860:3000"]
    volumes:
      - ./oauth-misconfig/server.js:/app/server.js:ro
    command: ["node", "/app/server.js"]

ready:
  cmd: "curl -sf http://localhost:19860/.well-known/openid-configuration >/dev/null"
  timeout: 30s
  interval: 2s

assertions:
  - name: exploit-oidc-discovery-exposed
    type: command
    expect:
      command: "curl -sf http://localhost:19860/.well-known/openid-configuration | grep -q 'authorization_endpoint'"
      exit_code: 0

  - name: exploit-redirect-uri-not-validated
    type: command
    expect:
      command: "curl -sI 'http://localhost:19860/authorize?response_type=code&client_id=test&redirect_uri=https://evil.com/callback&state=x' | grep -i 'location.*evil.com'"
      exit_code: 0

  - name: exploit-token-no-client-auth
    type: command
    expect:
      command: "curl -sf -X POST http://localhost:19860/token -d 'grant_type=authorization_code&code=anything' | grep -q 'access_token'"
      exit_code: 0

  - name: detects-oauth-open-redirect
    type: beacon
    target: localhost:19860
    args: ["--no-enrich", "--scanners", "oauth", "--deep", "--yes"]
    expect:
      check_id: oauth.token_endpoint_no_auth

  - name: detects-oidc-discovery
    type: beacon
    target: localhost:19860
    args: ["--no-enrich", "--scanners", "wellknown"]
    expect:
      check_id: wellknown.oidc_discovery

  - name: detects-missing-hsts
    type: beacon
    target: localhost:19860
    args: ["--no-enrich", "--scanners", "secheaders", "--ports", "3000"]
    expect:
      check_id: headers.missing_hsts

  - name: negative-no-sqli
    type: beacon
    target: localhost:19860
    args: ["--no-enrich", "--scanners", "oauth,wellknown,secheaders"]
    expect:
      not_check_id: sqli.error_based

timeout: 5m
