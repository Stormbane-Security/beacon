name: waf-bypass-authorized-techniques
description: >
  ModSecurity CRS at paranoia level 1 proxying to an nginx backend.
  Authorized-mode wafdetect scanner tests path normalization, method override,
  and content-type confusion bypasses. ModSecurity CRS PL1 is known to be
  bypassable via double-encoding and path normalization techniques.
tags: [waf, bypass, scanner, authorized, deep]

services:
  backend:
    image: nginx:alpine
    expose: ["80"]
    volumes:
      - ./waf-bypass-authorized/backend.conf:/etc/nginx/conf.d/default.conf:ro

  waf:
    image: owasp/modsecurity-crs:nginx-alpine
    ports: ["20200:8080"]
    environment:
      PARANOIA: "1"
      MODSEC_RULE_ENGINE: "On"
      BACKEND: "http://backend:80"
      PORT: "8080"
    depends_on:
      - backend

ready:
  cmd: "curl -sf http://localhost:20200/ >/dev/null"
  timeout: 120s
  interval: 5s

assertions:
  - name: exploit-waf-blocks-sqli
    type: command
    expect:
      command: "curl -s -o /dev/null -w '%{http_code}' 'http://localhost:20200/?q=%27%20OR%201%3D1--%20-' | grep -q '403'"
      exit_code: 0

  # --- Scanner detections ---
  - name: detects-waf-detected
    type: beacon
    target: localhost:20200
    args: ["--no-enrich", "--no-nmap", "--scanners", "wafdetect"]
    expect:
      check_id: waf.detected

  - name: detects-waf-product-version
    type: beacon
    target: localhost:20200
    args: ["--no-enrich", "--no-nmap", "--scanners", "wafdetect"]
    expect:
      check_id: waf.detected

  # Authorized-mode bypass techniques against CRS PL1
  - name: wafdetect-authorized-path-bypass
    type: beacon
    target: localhost:20200
    args: ["--no-enrich", "--no-nmap", "--scanners", "wafdetect", "--authorized", "--yes"]
    expect:
      min_findings: 0

  - name: wafdetect-authorized-method-bypass
    type: beacon
    target: localhost:20200
    args: ["--no-enrich", "--no-nmap", "--scanners", "wafdetect", "--authorized", "--yes"]
    expect:
      min_findings: 0

  - name: wafdetect-authorized-ctype-bypass
    type: beacon
    target: localhost:20200
    args: ["--no-enrich", "--no-nmap", "--scanners", "wafdetect", "--authorized", "--yes"]
    expect:
      min_findings: 0

  # Deep-mode header bypass (X-Forwarded-For spoofing)
  - name: wafdetect-deep-header-bypass
    type: beacon
    target: localhost:20200
    args: ["--no-enrich", "--no-nmap", "--scanners", "wafdetect", "--deep", "--yes"]
    expect:
      min_findings: 0

  # WAF bypass via the wafbypass scanner (adaptive encoding)
  - name: wafbypass-deep-bypass-found
    type: beacon
    target: localhost:20200
    args: ["--no-enrich", "--no-nmap", "--scanners", "wafbypass", "--deep", "--yes"]
    expect:
      min_findings: 0

  - name: wafbypass-deep-double-encode
    type: beacon
    target: localhost:20200
    args: ["--no-enrich", "--no-nmap", "--scanners", "wafbypass", "--deep", "--yes"]
    expect:
      min_findings: 0

  # --- Negative ---
  - name: negative-no-redis
    type: beacon
    target: localhost:20200
    args: ["--no-enrich", "--no-nmap", "--scanners", "wafdetect", "--authorized", "--yes"]
    expect:
      not_check_id: port.redis_unauthenticated

timeout: 8m
