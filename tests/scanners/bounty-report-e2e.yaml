name: bounty-report-e2e
description: >
  Tests the --format bounty output. Scans an httpbin target, generates
  bounty-format markdown, and verifies it contains required sections
  (CVSS, Steps to Reproduce, Impact, Affected Component).
tags: [report, bounty, format, e2e, integration]

services:
  httpbin:
    image: mccutchen/go-httpbin:latest
    ports: ["19200:8080"]
    environment:
      PORT: "8080"

ready:
  cmd: "curl -sf http://localhost:19200/ >/dev/null"
  timeout: 30s
  interval: 2s

assertions:
  # Beacon generates bounty format output
  - name: bounty-format-has-cvss
    type: command
    expect:
      command: "beacon scan --domain localhost:19200 --no-enrich --no-nmap --scanners secheaders --format bounty 2>/dev/null | grep -q 'CVSS'"
      exit_code: 0

  # Bounty format has Steps to Reproduce
  - name: bounty-format-has-steps
    type: command
    expect:
      command: "beacon scan --domain localhost:19200 --no-enrich --no-nmap --scanners secheaders --format bounty 2>/dev/null | grep -q 'Steps to Reproduce'"
      exit_code: 0

  # Bounty format has Impact section
  - name: bounty-format-has-impact
    type: command
    expect:
      command: "beacon scan --domain localhost:19200 --no-enrich --no-nmap --scanners secheaders --format bounty 2>/dev/null | grep -q 'Impact'"
      exit_code: 0

  # Regular scan still works
  - name: regular-scan-works
    type: beacon
    target: localhost:19200
    args: ["--no-enrich", "--no-nmap", "--scanners", "secheaders"]
    expect:
      check_id: headers.missing_hsts

timeout: 5m
