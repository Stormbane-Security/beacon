name: variant-redis-versions
description: >
  Redis version variant test: Redis 6 vs 7 vs latest. All configured
  without auth to verify beacon detects unauthenticated access across
  major versions.
tags: [variant, redis, database, portscan, integration]

services:
  redis6:
    image: redis:6-alpine
    ports: ["20500:6379"]
    command: ["redis-server", "--protected-mode", "no"]
  redis7:
    image: redis:7-alpine
    ports: ["20501:6379"]
    command: ["redis-server", "--protected-mode", "no"]

ready:
  cmd: "nc -zw2 localhost 20500 && nc -zw2 localhost 20501"
  timeout: 60s
  interval: 3s

assertions:
  # --- Redis 6 ---
  - name: redis6-detected
    type: beacon
    target: localhost:20500
    args: ["--no-enrich", "--no-nmap", "--ports", "6379"]
    expect:
      check_id: port.redis_unauthenticated

  - name: redis6-service-identified
    type: beacon
    target: localhost:20500
    args: ["--no-enrich", "--no-nmap", "--ports", "6379"]
    expect:
      check_id: port.service_identified

  - name: redis6-exploit-mode
    type: beacon
    target: localhost:20500
    args: ["--no-enrich", "--no-nmap", "--exploit", "--yes", "--ports", "6379"]
    expect:
      min_findings: 0

  # --- Redis 7 ---
  - name: redis7-detected
    type: beacon
    target: localhost:20501
    args: ["--no-enrich", "--no-nmap", "--ports", "6379"]
    expect:
      check_id: port.redis_unauthenticated

  - name: redis7-service-identified
    type: beacon
    target: localhost:20501
    args: ["--no-enrich", "--no-nmap", "--ports", "6379"]
    expect:
      check_id: port.service_identified

  - name: redis7-exploit-mode
    type: beacon
    target: localhost:20501
    args: ["--no-enrich", "--no-nmap", "--exploit", "--yes", "--ports", "6379"]
    expect:
      min_findings: 0

timeout: 5m
