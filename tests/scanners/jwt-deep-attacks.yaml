name: jwt-deep-attacks
description: >
  Deep-mode JWT attack checks against the jwt-weak Node.js fixture which
  issues alg:none tokens. Tests alg:none variants, empty secret signing,
  kid SQL injection attempts, long expiry, and no-encryption detection.
tags: [jwt, scanner, auth, deep]

services:
  jwt-app:
    image: node:20-alpine
    ports: ["20010:3000"]
    volumes:
      - ./jwt-weak/server.js:/app/server.js:ro
    command: ["node", "/app/server.js"]

ready:
  cmd: "curl -sf http://localhost:20010/health >/dev/null"
  timeout: 30s
  interval: 2s

assertions:
  # --- Exploit proofs ---
  - name: exploit-alg-none-token-accepted
    type: command
    expect:
      command: "curl -sf http://localhost:20010/login | grep -q 'token'"
      exit_code: 0

  # The server accepts alg:none tokens (lowercase only). The /login
  # endpoint returns one, and /api/data accepts it — verified in the
  # exploit above. Deep-mode beacon checks try case variants.
  - name: exploit-api-returns-secret
    type: command
    expect:
      command: "curl -sf http://localhost:20010/login -o /dev/null && curl -sf -H 'Authorization: Bearer eyJhbGciOiJub25lIiwidHlwIjoiSldUIn0.eyJzdWIiOiJhZG1pbiJ9.' http://localhost:20010/api/data | grep -q secret"
      exit_code: 0

  # --- Beacon deep-mode scanner detections ---
  - name: detects-jwt-weak-algorithm
    type: beacon
    target: localhost:20010
    args: ["--no-enrich", "--no-nmap", "--scanners", "jwt", "--deep", "--yes"]
    expect:
      check_id: jwt.weak_algorithm

  - name: detects-jwt-long-expiry
    type: beacon
    target: localhost:20010
    args: ["--no-enrich", "--no-nmap", "--scanners", "jwt", "--deep", "--yes"]
    expect:
      check_id: jwt.long_expiry

  - name: detects-jwt-no-encryption
    type: beacon
    target: localhost:20010
    args: ["--no-enrich", "--no-nmap", "--scanners", "jwt", "--deep", "--yes"]
    expect:
      check_id: jwt.no_encryption

  - name: detects-jwt-sensitive-payload
    type: beacon
    target: localhost:20010
    args: ["--no-enrich", "--no-nmap", "--scanners", "jwt", "--deep", "--yes"]
    expect:
      check_id: jwt.sensitive_payload

  # --- Deep-mode active attack detections ---
  # The server fixture accepts alg:none case variants, empty-secret HS256,
  # and kid SQL injection payloads at standard API paths.

  - name: detects-jwt-alg-none-variant
    type: beacon
    target: localhost:20010
    args: ["--no-enrich", "--no-nmap", "--scanners", "jwt", "--deep", "--yes"]
    expect:
      check_id: jwt.alg_none_variant

  - name: detects-jwt-empty-secret
    type: beacon
    target: localhost:20010
    args: ["--no-enrich", "--no-nmap", "--scanners", "jwt", "--deep", "--yes"]
    expect:
      check_id: jwt.empty_secret

  - name: detects-jwt-kid-sql-injection
    type: beacon
    target: localhost:20010
    args: ["--no-enrich", "--no-nmap", "--scanners", "jwt", "--deep", "--yes"]
    expect:
      check_id: jwt.kid_sql_injection

  - name: detects-jwt-jwks-weak-key
    type: beacon
    target: localhost:20010
    args: ["--no-enrich", "--no-nmap", "--scanners", "jwt", "--deep", "--yes"]
    expect:
      check_id: jwt.jwks_weak_key

  - name: deep-mode-min-findings
    type: beacon
    target: localhost:20010
    args: ["--no-enrich", "--no-nmap", "--scanners", "jwt", "--deep", "--yes"]
    expect:
      min_findings: 6

  # --- Negative ---
  - name: negative-no-sqli
    type: beacon
    target: localhost:20010
    args: ["--no-enrich", "--no-nmap", "--scanners", "jwt", "--deep", "--yes"]
    expect:
      not_check_id: web.sqli

timeout: 5m
