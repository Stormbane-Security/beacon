server {
    listen 80;
    server_name _;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /search {
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }

    location /callback {
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }

    location /redirect {
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }

    location /health {
        return 200 'OK';
        add_header Content-Type text/plain;
    }
}
