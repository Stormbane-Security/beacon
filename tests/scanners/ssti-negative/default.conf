server {
    listen 80;
    server_name localhost;

    location / {
        return 200 '<html><body>Static page with no template engine</body></html>';
        add_header Content-Type text/html always;
    }

    location /search {
        # Returns a fixed response regardless of query params
        return 200 '<html><body>Search results (static)</body></html>';
        add_header Content-Type text/html always;
    }
}
