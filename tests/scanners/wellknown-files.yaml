name: wellknown-files-comprehensive
description: >
  Nginx serving multiple .well-known files: security.txt, openid-configuration,
  jwks.json, change-password, assetlinks.json, and robots.txt with sensitive
  disallow paths. Beacon wellknown scanner should discover exposed endpoints.
tags: [wellknown, scanner, web, discovery]

services:
  app:
    image: nginx:alpine
    ports: ["19861:80"]
    volumes:
      - ./wellknown-files/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./wellknown-files/security.txt:/usr/share/nginx/html/.well-known/security.txt:ro
      - ./wellknown-files/openid-configuration:/usr/share/nginx/html/.well-known/openid-configuration:ro
      - ./wellknown-files/jwks.json:/usr/share/nginx/html/.well-known/jwks.json:ro
      - ./wellknown-files/change-password:/usr/share/nginx/html/.well-known/change-password:ro
      - ./wellknown-files/assetlinks.json:/usr/share/nginx/html/.well-known/assetlinks.json:ro
      - ./wellknown-files/apple-app-site-association:/usr/share/nginx/html/.well-known/apple-app-site-association:ro
      - ./wellknown-files/nodeinfo:/usr/share/nginx/html/.well-known/nodeinfo:ro
      - ./wellknown-files/webfinger:/usr/share/nginx/html/.well-known/webfinger:ro
      - ./wellknown-files/mta-sts.txt:/usr/share/nginx/html/.well-known/mta-sts.txt:ro
      - ./wellknown-files/matrix-server:/usr/share/nginx/html/.well-known/matrix-server:ro
      - ./wellknown-files/host-meta:/usr/share/nginx/html/.well-known/host-meta:ro
      - ./wellknown-files/robots.txt:/usr/share/nginx/html/robots.txt:ro

ready:
  cmd: "curl -sf http://localhost:19861/.well-known/security.txt >/dev/null"
  timeout: 30s
  interval: 2s

assertions:
  - name: exploit-security-txt-accessible
    type: command
    expect:
      command: "curl -sf http://localhost:19861/.well-known/security.txt | grep -qi 'Contact:'"
      exit_code: 0

  - name: exploit-oidc-discovery-accessible
    type: command
    expect:
      command: "curl -sf http://localhost:19861/.well-known/openid-configuration | grep -q 'authorization_endpoint'"
      exit_code: 0

  - name: exploit-jwks-accessible
    type: command
    expect:
      command: "curl -sf http://localhost:19861/.well-known/jwks.json | grep -q 'keys'"
      exit_code: 0

  - name: exploit-assetlinks-accessible
    type: command
    expect:
      command: "curl -sf http://localhost:19861/.well-known/assetlinks.json | grep -q 'android_app'"
      exit_code: 0

  - name: detects-security-txt
    type: beacon
    target: localhost:19861
    args: ["--no-enrich", "--scanners", "wellknown"]
    expect:
      check_id: wellknown.security_txt

  - name: detects-change-password
    type: beacon
    target: localhost:19861
    args: ["--no-enrich", "--no-nmap", "--scanners", "wellknown"]
    expect:
      check_id: wellknown.change_password

  - name: detects-oidc-discovery
    type: beacon
    target: localhost:19861
    args: ["--no-enrich", "--scanners", "wellknown"]
    expect:
      check_id: wellknown.oidc_discovery

  - name: detects-assetlinks
    type: beacon
    target: localhost:19861
    args: ["--no-enrich", "--scanners", "wellknown"]
    expect:
      check_id: wellknown.assetlinks

  - name: detects-apple-app-site
    type: beacon
    target: localhost:19861
    args: ["--no-enrich", "--no-nmap", "--scanners", "wellknown"]
    expect:
      check_id: wellknown.apple_app_site

  - name: detects-nodeinfo
    type: beacon
    target: localhost:19861
    args: ["--no-enrich", "--no-nmap", "--scanners", "wellknown"]
    expect:
      check_id: wellknown.nodeinfo

  - name: detects-webfinger
    type: beacon
    target: localhost:19861
    args: ["--no-enrich", "--no-nmap", "--scanners", "wellknown"]
    expect:
      check_id: wellknown.webfinger

  - name: detects-mta-sts
    type: beacon
    target: localhost:19861
    args: ["--no-enrich", "--no-nmap", "--scanners", "wellknown"]
    expect:
      check_id: wellknown.mta_sts

  - name: detects-matrix-server
    type: beacon
    target: localhost:19861
    args: ["--no-enrich", "--no-nmap", "--scanners", "wellknown"]
    expect:
      check_id: wellknown.matrix_server

  - name: detects-host-meta
    type: beacon
    target: localhost:19861
    args: ["--no-enrich", "--no-nmap", "--scanners", "wellknown"]
    expect:
      check_id: wellknown.host_meta

  - name: detects-jwks-exposed
    type: beacon
    target: localhost:19861
    args: ["--no-enrich", "--no-nmap", "--scanners", "wellknown"]
    expect:
      check_id: wellknown.jwks_exposed

  - name: negative-no-database-findings
    type: beacon
    target: localhost:19861
    args: ["--no-enrich", "--scanners", "wellknown"]
    expect:
      not_check_id: port.mysql_no_auth

timeout: 5m
