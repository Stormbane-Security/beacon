name: jwt-weak-algorithm
description: "Python app issuing JWTs with alg:none triggers jwt.weak_algorithm"
tags: [jwt, scanner, auth]

services:
  jwt-app:
    build:
      context: ./jwt
      dockerfile: Dockerfile
    ports: ["9205:8080"]

ready:
  cmd: "curl -sf http://localhost:9205/health >/dev/null"
  timeout: 30s
  interval: 2s

assertions:
  - name: exploit-jwt-token-issued
    type: command
    expect:
      command: "curl -sf http://localhost:9205/login | python3 -c 'import sys,json; t=json.load(sys.stdin)[\"token\"]; assert \".\" in t'"
      exit_code: 0

  - name: exploit-jwt-alg-none-header
    type: command
    expect:
      command: "TOKEN=$(curl -sf http://localhost:9205/login | python3 -c 'import sys,json; print(json.load(sys.stdin)[\"token\"])') && HEADER=$(echo $TOKEN | cut -d. -f1) && python3 -c \"import base64,sys; h=sys.argv[1]; print(base64.urlsafe_b64decode(h+'==').decode())\" \"$HEADER\" | grep -qi none"
      exit_code: 0

  - name: detects-weak-jwt-algorithm
    type: beacon
    target: localhost:9205
    args: ["--no-enrich", "--scanners", "jwt"]
    expect:
      check_id: jwt.weak_algorithm

timeout: 5m
