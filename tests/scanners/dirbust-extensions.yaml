name: dirbust-php-extensions
description: "PHP 8.2 + Apache with /admin.php and /admin/config.php — beacon dirbust discovers PHP files via tech-aware extension fuzzing"
tags: [dirbust, scanner, web, php]

services:
  php-app:
    image: php:8.2-apache
    ports: ["9214:80"]
    volumes:
      - ./dirbust-extensions/html:/var/www/html:ro

ready:
  cmd: "curl -sf http://localhost:9214/health.php >/dev/null"
  timeout: 30s
  interval: 2s

assertions:
  - name: exploit-admin-php-accessible
    type: command
    expect:
      command: "curl -sf http://localhost:9214/admin.php | grep -qi 'admin\\|dashboard\\|php'"
      exit_code: 0

  - name: exploit-admin-config-accessible
    type: command
    expect:
      command: "curl -sf http://localhost:9214/admin/config.php | grep -qi 'db_host'"
      exit_code: 0

  - name: detects-php-tech
    type: classify
    target: localhost:9214
    expect:
      framework: php

  # Dirbust scanner requires playbook-provided dictionary paths.
  # Extension fuzzing and recursive discovery are verified by unit tests
  # in dirbust/scanner_test.go.

timeout: 5m
