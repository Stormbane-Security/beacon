name: dirbust-php-extensions
description: "Real PHP 8.2 + Apache with /admin.php and /admin/config.php — beacon dirbust discovers PHP files via tech-aware extension fuzzing"
tags: [dirbust, scanner, web, php]

services:
  php-app:
    build:
      context: ./dirbust-extensions
      dockerfile: Dockerfile
    ports: ["9214:80"]

ready:
  cmd: "curl -sf http://localhost:9214/health.php >/dev/null"
  timeout: 30s
  interval: 2s

assertions:
  - name: exploit-admin-php-accessible
    type: command
    expect:
      command: "curl -sf http://localhost:9214/admin.php | grep -qi 'admin\\|dashboard\\|php'"
      exit_code: 0

  - name: detects-php-admin-paths
    type: beacon
    target: localhost:9214
    args: ["--no-enrich", "--deep", "--permission-confirmed"]
    expect:
      check_id: dirbust.found
      min_findings: 1

timeout: 5m
