name: nats-server-exposed
description: >
  NATS messaging server with monitoring endpoint exposed. Beacon should
  detect the NATS monitoring API.
tags: [nats, messaging, monitoring, portscan, detection]

services:
  nats:
    image: nats:2.10-alpine
    ports: ["4222:4222", "8222:8222"]
    command: ["--http_port", "8222"]

ready:
  cmd: "curl -sf http://localhost:8222/varz | grep -q server_id"
  timeout: 30s
  interval: 2s

assertions:
  - name: nats-monitoring-accessible
    type: command
    expect:
      command: "curl -sf http://localhost:8222/varz | grep -q server_id"
      exit_code: 0

  - name: detects-nats-monitoring
    type: beacon
    target: localhost:8222
    args: ["--no-enrich", "--no-nmap", "--scanners", "portscan", "--ports", "8222"]
    expect:
      check_id: port.nats_monitoring_exposed

timeout: 3m
