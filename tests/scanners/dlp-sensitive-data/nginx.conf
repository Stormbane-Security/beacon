server {
    listen 80;
    server_name _;

    location / {
        default_type text/html;
        return 200 '<html><body>
<h1>Internal Employee Directory</h1>
<table>
  <tr><th>Name</th><th>Card Number</th><th>SSN</th><th>Email</th></tr>
  <tr><td>John Smith</td><td>4111111111111111</td><td>123-45-6789</td><td>admin@internal.corp</td></tr>
  <tr><td>Jane Doe</td><td>5500000000000004</td><td>987-65-4321</td><td>jane.doe@internal.corp</td></tr>
</table>
<p>AWS Key: AKIAIOSFODNN7EXAMPLE</p>
</body></html>';
    }

    location /api/employees {
        default_type application/json;
        return 200 '{"employees":[{"name":"Alice","ssn":"234-56-7890","card":"4111111111111111","email":"alice@internal.corp"}]}';
    }
}
