name: jwt-weak-alg-none
description: >
  Node.js server that issues JWTs with alg:none in cookies and accepts
  them without verification. Tests JWT detection and header checks.
tags: [jwt, scanner, auth]

services:
  jwt-app:
    image: node:20-alpine
    ports: ["19842:3000"]
    volumes:
      - ./jwt-weak/server.js:/app/server.js:ro
    command: ["node", "/app/server.js"]

ready:
  cmd: "curl -sf http://localhost:19842/health >/dev/null"
  timeout: 30s
  interval: 2s

assertions:
  # --- Exploit proofs: JWT is issued and visible ---
  - name: exploit-jwt-issued-on-login
    type: command
    expect:
      command: "curl -sf http://localhost:19842/login | grep -q 'token'"
      exit_code: 0

  - name: exploit-jwt-in-cookie
    type: command
    expect:
      command: "curl -sD- http://localhost:19842/ -o /dev/null | grep -i 'set-cookie' | grep -q 'session=eyJ'"
      exit_code: 0

  # --- Beacon scanner detections ---
  # JWT scanner looks for JWTs in Set-Cookie headers and response bodies.
  # The server sets a cookie with alg:none JWT containing role:superuser.
  - name: detects-jwt-issues
    type: beacon
    target: localhost:19842
    args: ["--no-enrich", "--no-nmap", "--scanners", "jwt"]
    expect:
      min_findings: 1

  - name: detects-missing-hsts
    type: beacon
    target: localhost:19842
    args: ["--no-enrich", "--no-nmap", "--scanners", "secheaders"]
    expect:
      check_id: headers.missing_hsts

  # --- Negative ---
  - name: negative-no-sqli
    type: beacon
    target: localhost:19842
    args: ["--no-enrich", "--no-nmap", "--scanners", "jwt"]
    expect:
      not_check_id: web.sqli

timeout: 5m
