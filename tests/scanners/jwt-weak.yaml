name: jwt-weak-alg-none
description: >
  Node.js server that issues JWTs with alg:none and accepts them on
  /api/data without verification. Beacon JWT scanner should detect
  weak algorithm, sensitive payload, long expiry, and missing HSTS.
tags: [jwt, scanner, auth]

services:
  jwt-app:
    image: node:20-alpine
    ports: ["19842:3000"]
    volumes:
      - ./jwt-weak/server.js:/app/server.js:ro
    command: ["node", "/app/server.js"]

ready:
  cmd: "curl -sf http://localhost:19842/health >/dev/null"
  timeout: 30s
  interval: 2s

assertions:
  # --- Exploit proofs ---
  - name: exploit-jwt-issued-on-login
    type: command
    expect:
      command: "curl -sf http://localhost:19842/login | grep -q 'token'"
      exit_code: 0

  - name: exploit-jwt-alg-none
    type: command
    expect:
      command: "TOKEN=$(curl -sf http://localhost:19842/login | python3 -c 'import sys,json; print(json.load(sys.stdin)[\"token\"])') && HEADER=$(echo $TOKEN | cut -d. -f1) && python3 -c \"import base64,sys; h=sys.argv[1]; print(base64.urlsafe_b64decode(h+'==').decode())\" \"$HEADER\" | grep -qi 'none'"
      exit_code: 0

  - name: exploit-alg-none-accepted-on-api
    type: command
    expect:
      command: "TOKEN=$(curl -sf http://localhost:19842/login | python3 -c 'import sys,json; print(json.load(sys.stdin)[\"token\"])') && curl -sf -H \"Authorization: Bearer $TOKEN\" http://localhost:19842/api/data | grep -q 'secret'"
      exit_code: 0

  - name: exploit-sensitive-role-in-payload
    type: command
    expect:
      command: "TOKEN=$(curl -sf http://localhost:19842/login | python3 -c 'import sys,json; print(json.load(sys.stdin)[\"token\"])') && PAYLOAD=$(echo $TOKEN | cut -d. -f2) && python3 -c \"import base64,sys; p=sys.argv[1]; print(base64.urlsafe_b64decode(p+'==').decode())\" \"$PAYLOAD\" | grep -q 'superuser'"
      exit_code: 0

  - name: exploit-jwt-set-in-cookie
    type: command
    expect:
      command: "curl -sD- http://localhost:19842/ -o /dev/null | grep -i 'set-cookie' | grep -q 'session=eyJ'"
      exit_code: 0

  # --- Beacon scanner detections ---
  - name: detects-weak-jwt-algorithm
    type: beacon
    target: localhost:19842
    args: ["--no-enrich", "--scanners", "jwt"]
    expect:
      check_id: jwt.weak_algorithm

  - name: detects-sensitive-jwt-payload
    type: beacon
    target: localhost:19842
    args: ["--no-enrich", "--scanners", "jwt"]
    expect:
      check_id: jwt.sensitive_payload

  - name: detects-missing-hsts
    type: beacon
    target: localhost:19842
    args: ["--no-enrich", "--scanners", "secheaders"]
    expect:
      check_id: headers.missing_hsts

  # --- Negative ---
  - name: negative-no-sqli
    type: beacon
    target: localhost:19842
    args: ["--no-enrich", "--scanners", "jwt"]
    expect:
      absent_check_id: web.sqli

timeout: 5m
