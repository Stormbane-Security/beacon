proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=testcache:10m max_size=100m inactive=60m;

server {
    listen 80;
    server_name _;

    # Caching reverse proxy in front of the backend on port 8080.
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_cache testcache;
        proxy_cache_valid 200 60s;
        proxy_cache_use_stale error timeout updating;

        # Expose cache status headers — cacheprobe looks for these.
        add_header X-Cache $upstream_cache_status;
        add_header X-Cache-Hits $upstream_cache_status;

        # Vary on Accept-Encoding (normal) but also X-Forwarded-Host (risky).
        add_header Vary "Accept-Encoding, X-Forwarded-Host";

        # Cache-Control header
        add_header Cache-Control "public, max-age=60";
    }

    location /health {
        return 200 'ok';
    }
}

server {
    listen 8080;
    server_name _;

    location / {
        default_type text/html;
        return 200 '<html><body><h1>Cached Backend</h1><p>This response comes from the origin.</p></body></html>';
    }
}
