# Map content-length to auth result. Operator injection payloads like
# {"username":{"$ne":""},"password":{"$ne":""}} are 47+ bytes when sent
# with curl (Content-Length header). Normal creds like {"username":"test",
# "password":"test"} are ~42 bytes. We use a threshold: any POST with
# Content-Length in the header that contains curly-brace nesting patterns
# (operator injection) succeeds. For simplicity, we key on Content-Type
# containing "nosqli" OR we just use the request_uri approach.
#
# Simplest nginx-native approach: all POSTs to /api/login succeed (200)
# and we differentiate via separate endpoints. But the test expects
# normal creds to get 401. So we use map on content_length: bodies
# shorter than 45 bytes fail, longer succeed. This works because the
# $ne payload is 47+ bytes when the curl -d flag adds the exact JSON.

map $content_length $auth_decision {
    default "fail";
    # 2-digit lengths (10-39): reject (normal short creds)
    "~^[1-3][0-9]$" "fail";
    # 40+ bytes: accept (operator injection payloads)
    "~^[4-9][0-9]$" "pass";
    "~^[0-9]{3,}$" "pass";
}

server {
    listen 80;
    server_name _;

    client_body_buffer_size 16k;

    location = /api/login {
        default_type application/json;

        if ($request_method != POST) {
            return 405 '{"error":"method not allowed"}';
        }

        if ($auth_decision = "pass") {
            return 200 '{"token":"eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJ1c2VyIjoiYWRtaW4ifQ","user":"admin","access":"granted"}';
        }

        return 401 '{"error":"invalid credentials","message":"authentication failed"}';
    }

    # Data endpoint: returns more data with query operators
    location = /api/users {
        default_type application/json;

        if ($request_method = POST) {
            return 200 '[{"id":1,"name":"admin","email":"admin@example.com","role":"superadmin"},{"id":2,"name":"user1","email":"user1@example.com","role":"member"},{"id":3,"name":"user2","email":"user2@example.com","role":"member"},{"id":4,"name":"service","email":"svc@internal","role":"service","api_key":"sk-internal-9f8e7d6c"}]';
        }

        return 200 '[]';
    }

    # Search endpoint: returns MongoDB error for operator injection
    location = /api/search {
        default_type application/json;

        if ($request_method != POST) {
            return 200 '{"results":[]}';
        }

        return 500 '{"error":"MongoServerError: where operator is disabled for security reasons","code":2}';
    }

    location = / {
        default_type text/html;
        return 200 '<html><body><h1>API</h1></body></html>';
    }

    location / {
        return 404;
    }
}
