server {
    listen 80;
    server_name _;

    # NoSQL injection test: simulates a MongoDB-backed API.
    # Login endpoint returns 401 for short request bodies (normal credentials)
    # and 200 with auth token for longer bodies (operator injection payloads
    # like {"username":{"$ne":""},"password":{"$ne":""}} are ~60+ bytes).
    # This simulates a real MongoDB $ne bypass where operators match all docs.

    # Enable request body reading for POST
    client_body_buffer_size 16k;

    location = /api/login {
        default_type application/json;

        if ($request_method != POST) {
            return 405 '{"error":"method not allowed"}';
        }

        # Operator injection payloads are significantly longer than normal
        # string credentials. Normal: ~70 bytes, $ne injection: ~90+ bytes.
        # Use content_length as a proxy for detecting operator payloads.
        # This simulates MongoDB's behavior of matching all documents when
        # operators like $ne:"" are used instead of string values.
        set $auth_result "fail";
        if ($content_length > 80) {
            set $auth_result "pass";
        }

        if ($auth_result = "pass") {
            return 200 '{"token":"eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJ1c2VyIjoiYWRtaW4ifQ","user":"admin","access":"granted"}';
        }

        return 401 '{"error":"invalid credentials","message":"authentication failed"}';
    }

    # Data endpoint: returns more data with query operators
    location = /api/users {
        default_type application/json;

        if ($request_method = POST) {
            # POST with filter operators returns all users (data exfiltration)
            return 200 '[{"id":1,"name":"admin","email":"admin@example.com","role":"superadmin"},{"id":2,"name":"user1","email":"user1@example.com","role":"member"},{"id":3,"name":"user2","email":"user2@example.com","role":"member"},{"id":4,"name":"service","email":"svc@internal","role":"service","api_key":"sk-internal-9f8e7d6c"}]';
        }

        # GET returns minimal data
        return 200 '[]';
    }

    # Search endpoint: returns MongoDB error for $where
    location = /api/search {
        default_type application/json;

        if ($request_method != POST) {
            return 200 '{"results":[]}';
        }

        # Simulate MongoDB rejecting $where operator
        return 500 '{"error":"MongoServerError: $where is disabled for security reasons","code":2}';
    }

    location = / {
        default_type text/html;
        return 200 '<html><body><h1>API</h1></body></html>';
    }

    location / {
        return 404;
    }
}
