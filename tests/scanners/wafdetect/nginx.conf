server {
    listen 80;
    root /usr/share/nginx/html;

    # Simulate WAF-like behavior by adding identifiable headers
    add_header X-Mod-Security-Id "OWASP/3.3.4";
    add_header X-Protected-By "ModSecurity";
    add_header Server "nginx/1.25.0";

    location / {
        return 200 '<!DOCTYPE html><html><body><h1>Protected App</h1></body></html>';
        add_header Content-Type text/html;
        add_header X-Mod-Security-Id "OWASP/3.3.4";
        add_header X-Protected-By "ModSecurity";
    }
}
