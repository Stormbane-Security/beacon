name: exposure-monitoring-panel
description: >
  Grafana with default anonymous access enabled. Beacon exposedfiles
  scanner should detect the exposed monitoring panel via
  exposure.monitoring_panel by probing /api/health.
tags: [exposure, monitoring, grafana]

services:
  grafana:
    image: grafana/grafana:10.2.0
    ports: ["19972:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_SECURITY_ADMIN_PASSWORD: "admin"

ready:
  cmd: "curl -sf http://localhost:19972/api/health | grep -q 'database'"
  timeout: 60s
  interval: 3s

assertions:
  - name: exploit-grafana-health-accessible
    type: command
    expect:
      command: "curl -sf http://localhost:19972/api/health | grep -q 'database'"
      exit_code: 0

  - name: detects-monitoring-panel
    type: beacon
    target: localhost:19972
    args: ["--no-enrich", "--scanners", "exposedfiles"]
    expect:
      check_id: exposure.monitoring_panel

timeout: 5m
