name: mongo-express-exposed
description: >
  mongo-express web admin for MongoDB with authentication disabled.
  Beacon should detect the exposed MongoDB web admin interface and
  flag the unauthenticated access as a security finding.
tags: [mongo-express, scanner, portscan, noauth, database-admin]

services:
  mongo:
    image: mongo:7
    ports: ["20066:27017"]

  mongo-express:
    image: mongo-express:latest
    ports: ["20061:8081"]
    environment:
      ME_CONFIG_MONGODB_URL: "mongodb://mongo:27017"
      ME_CONFIG_BASICAUTH: "false"

ready:
  cmd: "curl -sf -o /dev/null -w '%{http_code}' http://localhost:20061/ | grep -qE '(200|302)'"
  timeout: 120s
  interval: 5s

assertions:
  # Pre-flight: mongo-express UI accessible
  - name: mongo-express-ui-accessible
    type: command
    expect:
      command: "curl -sf http://localhost:20061/ | grep -qiE '(mongo|express|database)'"
      exit_code: 0

  # Scanner: detect mongo-express service
  - name: detects-mongo-express-service
    type: beacon
    target: localhost:20061
    args: ["--no-enrich", "--no-nmap", "--scanners", "portscan", "--yes"]
    expect:
      check_id: port.service_identified

  # Scanner: detect mongo-express default creds
  - name: detects-mongo-express-default-creds
    type: beacon
    target: localhost:20061
    args: ["--no-enrich", "--no-nmap", "--scanners", "portscan", "--deep", "--yes"]
    expect:
      check_id: port.mongo_express_default_credentials

  # Negative: not flagged as redis
  - name: negative-not-redis
    type: beacon
    target: localhost:20061
    args: ["--no-enrich", "--no-nmap", "--scanners", "portscan", "--yes"]
    expect:
      not_check_id: port.redis_unauthenticated

timeout: 5m
