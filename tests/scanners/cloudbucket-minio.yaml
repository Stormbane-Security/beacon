name: cloudbucket-minio
description: "MinIO S3-compatible storage with public bucket — beacon detects publicly accessible cloud bucket"
tags: [cloudbuckets, scanner, cloud, s3]

services:
  minio:
    image: minio/minio:latest
    ports: ["9247:9000"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data

  setup:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb local/public-data &&
      mc anonymous set download local/public-data &&
      echo 'sensitive data' | mc pipe local/public-data/test.txt
      "

ready:
  cmd: "curl -sf http://localhost:9247/minio/health/live"
  timeout: 60s
  interval: 3s

assertions:
  - name: exploit-bucket-listable
    type: command
    expect:
      command: "curl -sf http://localhost:9247/public-data/ | grep -qi 'ListBucket'"
      exit_code: 0

  - name: detects-public-bucket
    type: beacon
    target: localhost:9247
    args: ["--no-enrich", "--scanners", "cloudbuckets"]
    expect:
      check_id: cloud.bucket_public

timeout: 3m
