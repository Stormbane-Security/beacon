name: blind-sqli-timing
description: >
  PHP app vulnerable to time-based blind SQL injection via SLEEP in query
  parameter. Beacon sqli scanner in deep mode should detect the timing
  differential and emit web.blind_sqli_time.
tags: [sqli, scanner, web, deep]

services:
  sqli-app:
    image: php:8.2-apache
    ports: ["20030:80"]
    volumes:
      - ./blind-sqli-timing/app.php:/var/www/html/index.php:ro

ready:
  cmd: "curl -sf http://localhost:20030/ >/dev/null"
  timeout: 30s
  interval: 2s

assertions:
  # ══════════════════════════════════════════════════════════════════════
  # Pre-flight: vulnerable endpoint responds and honours SLEEP
  # ══════════════════════════════════════════════════════════════════════

  - name: exploit-normal-response-fast
    type: command
    expect:
      command: "curl -sf 'http://localhost:20030/?id=1' | grep -q 'Product'"
      exit_code: 0

  - name: exploit-sleep-causes-delay
    type: command
    expect:
      command: "start=$(date +%s); curl -sf 'http://localhost:20030/?id=1%20OR%20SLEEP(2)' >/dev/null; end=$(date +%s); [ $((end - start)) -ge 2 ]"
      exit_code: 0

  # ══════════════════════════════════════════════════════════════════════
  # Beacon scanner detection
  # ══════════════════════════════════════════════════════════════════════

  - name: detects-blind-sqli-time
    type: beacon
    target: localhost:20030
    args: ["--no-enrich", "--no-nmap", "--scanners", "sqli", "--deep", "--yes"]
    expect:
      min_findings: 1

  # ══════════════════════════════════════════════════════════════════════
  # Negative: no unrelated findings
  # ══════════════════════════════════════════════════════════════════════

  - name: negative-no-redis
    type: beacon
    target: localhost:20030
    args: ["--no-enrich", "--no-nmap", "--scanners", "sqli", "--deep", "--yes"]
    expect:
      not_check_id: port.redis_unauthenticated

timeout: 5m
