name: waf-bypass-sqli
description: >
  ModSecurity WAF with OWASP Core Rule Set blocking standard SQL injection.
  Beacon should bypass the WAF using evasion techniques and confirm the
  underlying SQLi vulnerability that the WAF hides.

layers:
  - path: layers/apps/modsecurity.yaml

services:
  webapp:
    image: vulnerables/web-dvwa:latest
    ports: ["8080:80"]
    environment:
      MYSQL_HOST: database
      MYSQL_USER: root
      MYSQL_PASSWORD: dvwa
      MYSQL_DATABASE: dvwa
    depends_on: [database, waf]

  database:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: dvwa
      MYSQL_DATABASE: dvwa

  waf:
    image: owasp/modsecurity-crs:nginx-alpine
    ports: ["80:80"]
    environment:
      BACKEND: "http://webapp:80"
      PARANOIA: "2"
      ANOMALY_INBOUND: "5"
    depends_on: [webapp]

assertions:
  # WAF should block standard SQLi payloads
  - name: waf-blocks-standard-sqli
    type: command
    expect:
      command: "curl -s -o /dev/null -w '%{http_code}' 'http://localhost/?id=1%27+OR+1%3D1--+-'"
      stdout_contains: "403"

  # Beacon with evasion should find the SQLi behind the WAF
  - name: beacon-bypasses-waf
    type: beacon
    target: localhost
    args: ["--exploit", "--no-nmap", "--deep", "--yes", "--yes", "--scanners", "sqli", "--format", "json", "/tmp/results.json"]
    expect:
      check_id: web.sqli
