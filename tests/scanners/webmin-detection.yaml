name: webmin-detection
description: >
  Nginx simulating a Webmin login page over HTTPS (TLS). Beacon portscan
  webmin probe should detect the Webmin management panel via the
  session_login.cgi response containing "webmin" keywords.
tags: [webmin, admin-panel, portscan, detection]

services:
  webmin-sim:
    image: nginx:alpine
    ports: ["19880:443"]
    volumes:
      - ./webmin-detection/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mkdir -p /etc/nginx/ssl
        apk add --no-cache openssl >/dev/null 2>&1
        openssl req -x509 -nodes -days 1 -newkey rsa:2048 \
          -keyout /etc/nginx/ssl/key.pem \
          -out /etc/nginx/ssl/cert.pem \
          -subj '/CN=localhost' 2>/dev/null
        nginx -g 'daemon off;'

ready:
  cmd: "curl -skf https://localhost:19880/session_login.cgi | grep -qi webmin"
  timeout: 60s
  interval: 3s

assertions:
  # Pre-flight: simulated Webmin login page accessible over HTTPS
  - name: webmin-login-accessible
    type: command
    expect:
      command: "curl -skf https://localhost:19880/session_login.cgi | grep -qi webmin"
      exit_code: 0

  # Detection: beacon identifies Webmin service
  - name: detects-webmin-service
    type: beacon
    target: localhost:19880
    args: ["--no-enrich", "--no-nmap", "--yes", "--scanners", "portscan", "--ports", "19880"]
    expect:
      check_id: port.service_identified

  # Detection: beacon identifies Webmin exposed panel
  - name: detects-webmin-exposed
    type: beacon
    target: localhost:19880
    args: ["--no-enrich", "--no-nmap", "--yes", "--scanners", "portscan", "--ports", "19880"]
    expect:
      check_id: port.webmin_exposed

  - name: deep-mode-webmin
    type: beacon
    target: localhost:19880
    args: ["--no-enrich", "--no-nmap", "--scanners", "portscan", "--deep", "--yes", "--ports", "19880"]
    expect:
      min_findings: 0

  - name: exploit-mode-webmin
    type: beacon
    target: localhost:19880
    args: ["--no-enrich", "--no-nmap", "--scanners", "portscan", "--exploit", "--yes", "--ports", "19880"]
    expect:
      min_findings: 0

timeout: 5m
