server {
    listen 80;
    server_name _;

    # Multi-hop proxy test: nginx reverse proxy that adds proxy chain
    # detection headers (Via, X-Forwarded-For echo, X-Cache).

    # Add Via header (RFC 7230) to reveal this proxy hop
    add_header Via "1.1 proxy-edge (nginx/1.25)";
    # Add X-Cache header simulating a CDN cache layer
    add_header X-Cache "MISS from proxy-edge";
    # Echo back X-Forwarded-For (information leak)
    add_header X-Debug-XFF $http_x_forwarded_for;

    # Different Server header from what the backend returns
    # (nginx proxy vs httpbin backend reveals server inconsistency)

    location / {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
