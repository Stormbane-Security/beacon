# Server that reflects the Upgrade: h2c header back in the response.
# This simulates a misconfigured proxy/server that acknowledges h2c upgrade
# requests without actually performing the protocol switch, which signals
# to the scanner that h2c smuggling may be possible.
server {
    listen 80;
    server_name _;

    location / {
        # If client sends Upgrade: h2c, reflect it in the response.
        # Real-world: misconfigured proxies pass through the Upgrade header
        # from the backend without understanding h2c, creating a smuggling vector.
        if ($http_upgrade = "h2c") {
            add_header Upgrade "h2c" always;
            return 200 'HTTP/2 cleartext upgrade acknowledged';
        }

        default_type text/html;
        return 200 '<html><body><h1>Normal HTTP/1.1 Response</h1></body></html>';
    }
}
