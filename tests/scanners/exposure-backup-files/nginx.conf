server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location / { index index.html; }
    location /health { return 200 'ok'; }

    # Serve backup.sql with INSERT content (matches scanner probe)
    location = /backup.sql {
        default_type text/plain;
        return 200 'INSERT INTO users (id, name, email) VALUES (1, "admin", "admin@corp.internal");
INSERT INTO users (id, name, email) VALUES (2, "root", "root@corp.internal");
';
    }

    # Serve wp-config.php.bak (scanner deep-only probe)
    location = /wp-config.php.bak {
        default_type text/plain;
        return 200 '<?php
define("DB_NAME", "wordpress_prod");
define("DB_USER", "wp_admin");
define("DB_PASSWORD", "Wr0dPr3ss!2024");
define("DB_HOST", "mysql.internal");
';
    }

    # Serve .DS_Store (not probed by scanner but good to have)
    location = /.DS_Store {
        default_type application/octet-stream;
        return 200 'Bud1 fake DS_Store metadata file';
    }
}
