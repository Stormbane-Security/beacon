name: aiinfra-gradio-exposed
description: >
  Gradio ML demo server without authentication. Beacon should detect
  the exposed Gradio API and identify the ML model endpoint.
tags: [ai, gradio, infrastructure, exposure]

services:
  gradio:
    image: python:3.11-slim
    ports: ["19210:7860"]
    command:
      - sh
      - -c
      - |
        pip install -q gradio &&
        python -c "
        import gradio as gr
        def greet(name):
            return f'Hello {name}!'
        demo = gr.Interface(fn=greet, inputs='text', outputs='text')
        demo.launch(server_name='0.0.0.0', server_port=7860)
        "

ready:
  cmd: "curl -sf http://localhost:19210/ | grep -qi gradio"
  timeout: 180s
  interval: 10s

assertions:
  # Beacon detects exposed Gradio
  - name: detects-gradio-exposed
    type: beacon
    target: localhost:19210
    args: ["--no-enrich", "--no-nmap", "--scanners", "aiinfra"]
    expect:
      check_id: ai.gradio_unauthenticated

  # Beacon finds missing security headers
  - name: detects-missing-headers
    type: beacon
    target: localhost:19210
    args: ["--no-enrich", "--no-nmap", "--scanners", "secheaders"]
    expect:
      check_id: headers.missing_hsts

timeout: 10m
