name: fingerprint-spring-actuator
description: "Real Spring Boot Petclinic with exposed actuator endpoints — beacon classify detects Framework=spring, swagger scanner finds actuator paths"
tags: [fingerprint, classify, discovery, spring]

services:
  spring-app:
    image: springcommunity/spring-framework-petclinic:latest
    ports: ["9216:8080"]
    environment:
      # Expose all actuator endpoints (deliberately insecure for testing)
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "*"
      MANAGEMENT_ENDPOINT_ENV_ENABLED: "true"
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: always

ready:
  cmd: "curl -sf http://localhost:9216/actuator/health >/dev/null"
  timeout: 120s
  interval: 5s

assertions:
  - name: detects-spring-actuator
    type: beacon
    target: spring-app:8080
    args: ["--no-enrich", "--scanners", "swagger", "--deep", "--permission-confirmed", "--ports", "8080"]
    expect:
      min_findings: 1

timeout: 5m
