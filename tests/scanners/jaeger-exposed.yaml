name: jaeger-exposed
description: >
  Jaeger distributed tracing UI exposed without authentication. Beacon
  portscan should detect the exposed tracing dashboard via
  port.jaeger_exposed by probing /api/services.
tags: [jaeger, scanner, portscan, exposed, monitoring, tracing]

services:
  jaeger:
    image: jaegertracing/all-in-one:latest
    ports: ["20041:16686"]

ready:
  cmd: "curl -sf http://localhost:20041/"
  timeout: 60s
  interval: 3s

assertions:
  # Pre-flight: Jaeger API returns service list
  - name: exploit-jaeger-api-services
    type: command
    expect:
      command: "curl -sf http://localhost:20041/api/services | grep -q 'data'"
      exit_code: 0

  # Pre-flight: Traceresponse header present
  - name: exploit-jaeger-traceresponse-header
    type: command
    expect:
      command: "curl -sI http://localhost:20041/ | grep -qi traceresponse"
      exit_code: 0

  # Scanner: detect exposed Jaeger
  - name: detects-jaeger-exposed
    type: beacon
    target: localhost:20041
    args: ["--no-enrich", "--no-nmap", "--yes", "--scanners", "portscan", "--ports", "16686"]
    expect:
      check_id: port.jaeger_exposed

  # Scanner: detect missing HSTS
  - name: detects-missing-hsts
    type: beacon
    target: localhost:20041
    args: ["--no-enrich", "--no-nmap", "--yes", "--scanners", "secheaders"]
    expect:
      check_id: headers.missing_hsts

  # Negative: no Redis false positive
  - name: negative-no-redis
    type: beacon
    target: localhost:20041
    args: ["--no-enrich", "--no-nmap", "--yes", "--scanners", "portscan"]
    expect:
      not_check_id: port.redis_unauthenticated

timeout: 5m
