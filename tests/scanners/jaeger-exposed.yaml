name: jaeger-exposed
description: >
  Jaeger distributed tracing UI exposed without authentication. Beacon should
  fingerprint Jaeger from the Traceresponse header and body content, and
  detect the exposed tracing dashboard which leaks service topology and
  trace data.
tags: [jaeger, scanner, fingerprint, exposed, monitoring, tracing]

services:
  jaeger:
    image: jaegertracing/all-in-one:latest
    ports: ["18686:16686"]

ready:
  cmd: "curl -sf http://localhost:18686/ -o /dev/null"
  timeout: 30s
  interval: 3s

assertions:
  # Classification: beacon identifies Jaeger
  - name: classify-detects-jaeger
    type: classify
    target: localhost:18686
    expect:
      service: Jaeger

  # Pre-flight: Traceresponse header present
  - name: jaeger-traceresponse-header
    type: command
    expect:
      command: "curl -sI http://localhost:18686/ | grep -qi traceresponse"
      exit_code: 0

  # Pre-flight: Jaeger API accessible
  - name: jaeger-api-services
    type: command
    expect:
      command: "curl -sf http://localhost:18686/api/services | grep -q data"
      exit_code: 0

  # Scanner: detect exposed tracing dashboard
  - name: detects-jaeger-exposed
    type: beacon
    target: localhost:18686
    args: ["--no-enrich", "--scanners", "portscan", "--ports", "18686"]
    expect:
      check_id: port.service_identified

timeout: 5m
