server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # No security headers — intentionally bare for header detection tests.

    location / {
        index index.html;
    }

    location /health {
        return 200 'ok';
    }

    # Admin path — triggers exposure.admin_path
    location /admin/ {
        default_type text/html;
        return 200 '<html><body><h1>Admin Panel</h1><p>admin dashboard</p></body></html>';
    }

    # Swagger/OpenAPI spec — triggers web.swagger_exposed
    location /swagger.json {
        default_type application/json;
        return 200 '{"swagger":"2.0","info":{"title":"Internal API","version":"1.0.0"},"host":"api.internal.corp","basePath":"/v1","paths":{"/users":{"get":{"summary":"List users","responses":{"200":{"description":"OK"}}}}}}';
    }
}
