server {
    listen 80;
    server_name _;

    location / {
        # Cookie with overly broad domain scope and no __Host-/__Secure- prefix
        add_header Set-Cookie "session=abc123; Path=/; Domain=.example.com" always;
        add_header Set-Cookie "prefs=dark; Path=/" always;
        default_type text/html;
        return 200 '<html><body><h1>Cookie Scope Test</h1></body></html>';
    }

    location /health {
        return 200 'ok';
    }
}
