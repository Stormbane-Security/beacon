name: swagger-exposed
description: >
  Swagger Petstore v3 API with OpenAPI spec exposed at /api/v3/openapi.json.
  Beacon should detect exposure.api_docs.
tags: [swagger, scanner, exposure]

services:
  petstore:
    image: swaggerapi/petstore3:unstable
    ports: ["9256:8080"]

ready:
  cmd: "curl -sf http://localhost:9256/api/v3/openapi.json -o /dev/null"
  timeout: 60s
  interval: 5s

assertions:
  - name: exploit-openapi-spec-accessible
    type: command
    expect:
      command: "curl -sf http://localhost:9256/api/v3/openapi.json | grep -q 'openapi'"
      exit_code: 0

  - name: detects-api-docs-exposed
    type: beacon
    target: localhost:9256
    args: ["--no-enrich", "--scanners", "swagger"]
    expect:
      check_id: web.swagger_exposed

timeout: 10m
