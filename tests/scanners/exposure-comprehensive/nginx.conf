server {
    listen 80;
    server_name _;

    location = / {
        default_type text/html;
        return 200 '<html><body><h1>App</h1></body></html>';
    }

    # Exposed .env file (exposure.env_file_exposed)
    location = /.env {
        default_type text/plain;
        return 200 'DATABASE_URL=postgres://admin:secret@db:5432/prod
SECRET_KEY=supersecretkey123
AWS_ACCESS_KEY_ID=AKIAIOSFODNN7EXAMPLE
AWS_SECRET_ACCESS_KEY=wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
STRIPE_SECRET_KEY=sk_live_123456789
';
    }

    # Exposed .git/config (exposure.git_exposed)
    location = /.git/config {
        default_type text/plain;
        return 200 '[core]
	repositoryformatversion = 0
	filemode = true
	bare = false
[remote "origin"]
	url = git@github.com:company/internal-app.git
	fetch = +refs/heads/*:refs/remotes/origin/*
';
    }

    location = /.git/HEAD {
        default_type text/plain;
        return 200 'ref: refs/heads/main
';
    }

    # robots.txt with sensitive paths (exposure.robots_sensitive_path)
    location = /robots.txt {
        default_type text/plain;
        return 200 'User-agent: *
Disallow: /admin/
Disallow: /internal-api/
Disallow: /debug/
Disallow: /staging/
Disallow: /wp-admin/
Disallow: /backup/
';
    }

    # security.txt (exposure.security_txt)
    location = /.well-known/security.txt {
        default_type text/plain;
        return 200 'Contact: security@example.com
Expires: 2027-12-31T23:59:00.000Z
Preferred-Languages: en
';
    }

    # sitemap.xml (exposure.sitemap_xml)
    location = /sitemap.xml {
        default_type application/xml;
        return 200 '<?xml version="1.0" encoding="UTF-8"?>
<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
  <url><loc>https://example.com/</loc></url>
  <url><loc>https://example.com/admin/dashboard</loc></url>
  <url><loc>https://example.com/internal/config</loc></url>
</urlset>
';
    }

    # .htaccess exposed
    location = /.htaccess {
        default_type text/plain;
        return 200 'RewriteEngine On
RewriteRule ^admin$ /admin/dashboard [L]
AuthType Basic
AuthName "Restricted"
AuthUserFile /etc/htpasswd
';
    }

    # phpinfo (simulated)
    location = /phpinfo.php {
        default_type text/html;
        return 200 '<html><head><title>phpinfo()</title></head><body>
<h1>PHP Version 8.1.27</h1>
<table><tr><td>System</td><td>Linux app-server 5.15.0</td></tr>
<tr><td>Server API</td><td>FPM/FastCGI</td></tr>
<tr><td>DOCUMENT_ROOT</td><td>/var/www/html</td></tr></table>
</body></html>';
    }

    # Backup file (exposure.backup_file)
    location = /config.php.bak {
        default_type text/plain;
        return 200 'db_host = "localhost"
db_pass = "p@ssw0rd"
';
    }
}
