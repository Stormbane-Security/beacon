server {
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;

    # Simulate Webmin login page at /session_login.cgi
    location /session_login.cgi {
        default_type text/html;
        return 200 '<!DOCTYPE html>
<html>
<head><title>Login to Webmin</title></head>
<body bgcolor=#ffffff>
<form action=/session_login.cgi method=post>
<h1>Login to Webmin</h1>
<table>
<tr><td>Username</td><td><input name=user size=20></td></tr>
<tr><td>Password</td><td><input name=pass type=password size=20></td></tr>
<tr><td colspan=2 align=right><input type=submit value="Sign In"></td></tr>
</table>
</form>
<hr>
<small>Webmin 2.105 on localhost (Ubuntu Linux 22.04)</small>
</body>
</html>';
    }

    # Root redirect to login
    location / {
        return 302 /session_login.cgi;
    }
}
