name: dirbust-techstack
description: >
  Smart dirbust with tech-stack awareness against a Spring Boot
  application. The dirbust scanner should discover Spring-specific
  paths like /actuator, /actuator/health, /actuator/env, or similar
  Spring Boot management endpoints.
tags: [dirbust, scanner, web, deep, spring]

services:
  petclinic:
    image: arey/springboot-petclinic:latest
    ports: ["19876:8080"]

ready:
  cmd: "curl -sf http://localhost:19876/ >/dev/null"
  timeout: 120s
  interval: 5s

assertions:
  # ── Pre-flight: Spring Boot app is running ───────────────────────────────
  - name: exploit-spring-app-accessible
    type: command
    expect:
      command: "curl -sf http://localhost:19876/ >/dev/null"
      exit_code: 0

  - name: exploit-actuator-health-exposed
    type: command
    expect:
      command: "curl -sf http://localhost:19876/actuator/health | grep -qi 'status'"
      exit_code: 0

  # ── Scanner detection: dirbust finds Spring paths ────────────────────────
  - name: detects-spring-paths
    type: beacon
    target: localhost:19876
    args: ["--no-enrich", "--no-nmap", "--scanners", "dirbust", "--deep", "--permission-confirmed"]
    expect:
      min_findings: 1

  # ── Negative: should NOT emit WAF findings ───────────────────────────────
  - name: negative-no-waf-finding
    type: beacon
    target: localhost:19876
    args: ["--no-enrich", "--no-nmap", "--scanners", "dirbust", "--deep", "--permission-confirmed"]
    expect:
      not_check_id: waf.detected

timeout: 8m
