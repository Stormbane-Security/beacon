server {
    listen 80;
    server_name _;

    location / {
        default_type text/html;
        return 200 '<html><body><h1>App</h1></body></html>';
    }

    # Exposed package.json (dependency confusion target)
    location = /package.json {
        default_type application/json;
        return 200 '{
  "name": "@internal/webapp",
  "version": "2.1.0",
  "dependencies": {
    "express": "^4.18.0",
    "lodash": "4.17.21",
    "@internal/auth-lib": "^1.0.0",
    "@internal/payment-sdk": "^3.2.1"
  },
  "devDependencies": {
    "jest": "^29.0.0"
  }
}';
    }

    # Exposed composer.json
    location = /composer.json {
        default_type application/json;
        return 200 '{
  "name": "internal/webapp",
  "require": {
    "php": ">=8.1",
    "laravel/framework": "^10.0",
    "internal/sso-client": "^2.0"
  }
}';
    }
}
