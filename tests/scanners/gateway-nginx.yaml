name: gateway-nginx-status
description: >
  Nginx with stub_status exposed at /nginx_status.
  Beacon should detect gateway.nginx_status_exposed.
tags: [gateway, scanner, nginx]

services:
  nginx:
    image: nginx:alpine
    ports: ["9255:80"]
    volumes:
      - ./gateway-nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

ready:
  cmd: "curl -sf http://localhost:9255/ >/dev/null"
  timeout: 30s
  interval: 2s

assertions:
  - name: exploit-nginx-status-accessible
    type: command
    expect:
      command: "curl -sf http://localhost:9255/nginx_status | grep -q 'Active connections'"
      exit_code: 0

  - name: detects-nginx-status-exposed
    type: beacon
    target: localhost:9255
    args: ["--no-enrich", "--scanners", "gateway"]
    expect:
      check_id: gateway.nginx_status_exposed

timeout: 5m
