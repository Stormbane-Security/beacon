name: nacos-exposed
description: >
  Alibaba Nacos service discovery and configuration management with
  no authentication. Beacon should detect the exposed Nacos API.
tags: [nacos, service-discovery, configuration, detection]

services:
  nacos:
    image: nacos/nacos-server:latest
    ports: ["20116:8848"]
    environment:
      MODE: "standalone"
      NACOS_AUTH_ENABLE: "false"

ready:
  cmd: "curl -sf http://localhost:20116/nacos/ >/dev/null"
  timeout: 120s
  interval: 5s

assertions:
  # Pre-flight: Nacos web UI accessible
  - name: nacos-page-accessible
    type: command
    expect:
      command: "curl -sf http://localhost:20116/nacos/ | grep -qE '(nacos|html)'"
      exit_code: 0

  # Scanner: beacon detects exposed Nacos
  - name: detects-nacos-exposed
    type: beacon
    target: localhost:20116
    args: ["--no-enrich", "--no-nmap", "--scanners", "portscan"]
    expect:
      min_findings: 1

timeout: 8m
