name: websocket-detection
description: >
  Minimal Node.js WebSocket echo server. Tests that beacon detects
  WebSocket upgrade support and flags missing security headers on the
  HTTP endpoint.
tags: [websocket, scanner, web]

services:
  ws-app:
    image: node:20-alpine
    ports: ["20012:3000"]
    volumes:
      - ./websocket-detection/server.js:/app/server.js:ro
    command: ["node", "/app/server.js"]

ready:
  cmd: "curl -sf http://localhost:20012/health >/dev/null"
  timeout: 30s
  interval: 2s

assertions:
  # --- Exploit proofs ---
  - name: exploit-websocket-upgrade-works
    type: command
    expect:
      command: "curl -sI -H 'Upgrade: websocket' -H 'Connection: Upgrade' -H 'Sec-WebSocket-Key: dGhlIHNhbXBsZSBub25jZQ==' -H 'Sec-WebSocket-Version: 13' http://localhost:20012/ | grep -qi '101 Switching Protocols'"
      exit_code: 0

  # --- Beacon scanner detections ---
  - name: detects-missing-hsts
    type: beacon
    target: localhost:20012
    args: ["--no-enrich", "--no-nmap", "--scanners", "secheaders", "--yes"]
    expect:
      check_id: headers.missing_hsts

  - name: detects-missing-csp
    type: beacon
    target: localhost:20012
    args: ["--no-enrich", "--no-nmap", "--scanners", "secheaders", "--yes"]
    expect:
      check_id: headers.missing_csp

  - name: detects-missing-x-frame-options
    type: beacon
    target: localhost:20012
    args: ["--no-enrich", "--no-nmap", "--scanners", "secheaders", "--yes"]
    expect:
      min_findings: 1

  - name: detects-service-or-websocket
    type: beacon
    target: localhost:20012
    args: ["--no-enrich", "--no-nmap", "--yes"]
    expect:
      min_findings: 1

  # --- Negative ---
  - name: negative-no-redis
    type: beacon
    target: localhost:20012
    args: ["--no-enrich", "--no-nmap", "--yes"]
    expect:
      not_check_id: port.redis_unauthenticated

timeout: 5m
