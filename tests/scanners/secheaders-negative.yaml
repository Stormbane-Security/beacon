name: secheaders-complete-no-finding
description: >
  nginx with all recommended security headers properly configured.
  Beacon security headers scanner must NOT flag a complete header set.
tags: [secheaders, scanner, negative, false-positive]

services:
  app:
    image: nginx:alpine
    ports: ["9463:80"]
    volumes:
      - ./secheaders-negative/default.conf:/etc/nginx/conf.d/default.conf:ro

ready:
  cmd: "curl -sf http://localhost:9463/ >/dev/null"
  timeout: 30s
  interval: 2s

assertions:
  - name: setup-hsts-present
    type: command
    expect:
      command: "curl -sI http://localhost:9463/ | grep -qi 'strict-transport-security'"
      exit_code: 0

  - name: setup-csp-present
    type: command
    expect:
      command: "curl -sI http://localhost:9463/ | grep -qi 'content-security-policy'"
      exit_code: 0

  - name: no-missing-hsts
    type: beacon
    target: localhost:9463
    args: ["--no-enrich", "--scanners", "secheaders"]
    expect:
      no_check_id: headers.missing_hsts

  - name: no-missing-csp
    type: beacon
    target: localhost:9463
    args: ["--no-enrich", "--scanners", "secheaders"]
    expect:
      no_check_id: headers.missing_csp

  - name: no-missing-x-frame-options
    type: beacon
    target: localhost:9463
    args: ["--no-enrich", "--scanners", "secheaders"]
    expect:
      no_check_id: headers.missing_x_frame_options

  - name: no-missing-x-content-type
    type: beacon
    target: localhost:9463
    args: ["--no-enrich", "--scanners", "secheaders"]
    expect:
      no_check_id: headers.missing_x_content_type

  - name: no-missing-referrer-policy
    type: beacon
    target: localhost:9463
    args: ["--no-enrich", "--scanners", "secheaders"]
    expect:
      no_check_id: headers.missing_referrer_policy

  - name: no-missing-permissions-policy
    type: beacon
    target: localhost:9463
    args: ["--no-enrich", "--scanners", "secheaders"]
    expect:
      no_check_id: headers.missing_permissions_policy

timeout: 3m
