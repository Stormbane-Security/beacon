name: cookie-secure-no-finding
description: >
  nginx setting a session cookie with all security attributes: HttpOnly,
  Secure, SameSite=Strict, Path=/. Beacon cookie scanner must NOT flag
  cookies with proper security attributes.
tags: [cookie, scanner, negative, false-positive]

services:
  app:
    image: nginx:alpine
    ports: ["9468:80"]
    volumes:
      - ./cookie-negative/default.conf:/etc/nginx/conf.d/default.conf:ro

ready:
  cmd: "curl -sf http://localhost:9468/ >/dev/null"
  timeout: 30s
  interval: 2s

assertions:
  - name: setup-secure-cookie-set
    type: command
    expect:
      command: "curl -sI http://localhost:9468/ | grep -qi 'HttpOnly'"
      exit_code: 0

  - name: no-insecure-cookie-finding
    type: beacon
    target: localhost:9468
    args: ["--no-enrich", "--scanners", "cookie"]
    expect:
      no_check_id: cookie.missing_secure

timeout: 3m
