server {
    listen 80;
    server_name _;

    location / {
        # VULNERABLE: CSP with unsafe-inline and unsafe-eval
        add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval'; script-src 'self' 'unsafe-inline' 'unsafe-eval' *";
        return 200 '<html><body><h1>CSP Test</h1></body></html>';
        default_type text/html;
    }
}
