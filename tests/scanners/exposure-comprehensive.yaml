name: exposure-comprehensive
description: >
  Nginx serving common exposed files: .env with secrets, .git/config,
  robots.txt with sensitive disallows, security.txt, sitemap.xml,
  .htaccess, and phpinfo. Tests multiple exposure check IDs.
tags: [exposedfiles, scanner, exposure]

services:
  nginx:
    image: nginx:alpine
    ports: ["19843:80"]
    volumes:
      - ./exposure-comprehensive/nginx.conf:/etc/nginx/conf.d/default.conf:ro

ready:
  cmd: "curl -sf http://localhost:19843/ >/dev/null"
  timeout: 30s
  interval: 2s

assertions:
  # --- Exploit proofs ---
  - name: exploit-env-file-accessible
    type: command
    expect:
      command: "curl -sf http://localhost:19843/.env | grep -q 'DATABASE_URL'"
      exit_code: 0

  - name: exploit-env-has-aws-key
    type: command
    expect:
      command: "curl -sf http://localhost:19843/.env | grep -q 'AKIAIOSFODNN7EXAMPLE'"
      exit_code: 0

  - name: exploit-git-config-accessible
    type: command
    expect:
      command: "curl -sf http://localhost:19843/.git/config | grep -q '[core]'"
      exit_code: 0

  - name: exploit-robots-leaks-admin
    type: command
    expect:
      command: "curl -sf http://localhost:19843/robots.txt | grep -q '/admin/'"
      exit_code: 0

  - name: exploit-sitemap-accessible
    type: command
    expect:
      command: "curl -sf http://localhost:19843/sitemap.xml | grep -q 'urlset'"
      exit_code: 0

  - name: exploit-htaccess-accessible
    type: command
    expect:
      command: "curl -sf http://localhost:19843/.htaccess | grep -q 'RewriteEngine'"
      exit_code: 0

  # --- Beacon scanner detections ---
  - name: detects-env-file
    type: beacon
    target: localhost:19843
    args: ["--no-enrich", "--scanners", "exposedfiles"]
    expect:
      check_id: exposure.env_file_exposed

  - name: detects-git-exposed
    type: beacon
    target: localhost:19843
    args: ["--no-enrich", "--scanners", "exposedfiles"]
    expect:
      check_id: exposure.git_exposed

  - name: detects-robots-sensitive-path
    type: beacon
    target: localhost:19843
    args: ["--no-enrich", "--scanners", "robotsmap"]
    expect:
      check_id: exposure.robots_sensitive_path

  - name: detects-backup-file
    type: beacon
    target: localhost:19843
    args: ["--no-enrich", "--scanners", "exposedfiles"]
    expect:
      check_id: exposure.backup_file

  # --- Negative: no database findings on a static nginx ---
  - name: negative-no-sqli
    type: beacon
    target: localhost:19843
    args: ["--no-enrich", "--scanners", "exposedfiles"]
    expect:
      absent_check_id: web.sqli

  - name: negative-no-nosqli
    type: beacon
    target: localhost:19843
    args: ["--no-enrich", "--scanners", "exposedfiles"]
    expect:
      absent_check_id: web.nosqli

timeout: 5m
