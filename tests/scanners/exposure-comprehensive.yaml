name: exposure-comprehensive
description: >
  Nginx serving common exposed files: .env with secrets, .git/config,
  robots.txt with sensitive disallows, security.txt, sitemap.xml,
  .htaccess, and phpinfo. Tests multiple exposure check IDs.
tags: [exposedfiles, scanner, exposure]

services:
  nginx:
    image: nginx:alpine
    ports: ["19843:80"]
    volumes:
      - ./exposure-comprehensive/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./exposure-comprehensive/html:/usr/share/nginx/html:ro

ready:
  cmd: "curl -sf http://localhost:19843/ >/dev/null"
  timeout: 30s
  interval: 2s

assertions:
  # --- Exploit proofs ---
  - name: exploit-robots-leaks-admin
    type: command
    expect:
      command: "curl -sf http://localhost:19843/robots.txt | grep -q '/admin/'"
      exit_code: 0

  # --- Beacon scanner detections ---
  - name: detects-env-file
    type: beacon
    target: localhost:19843
    args: ["--no-enrich", "--scanners", "exposedfiles"]
    expect:
      check_id: exposure.env_file_exposed

  - name: detects-git-exposed
    type: beacon
    target: localhost:19843
    args: ["--no-enrich", "--scanners", "exposedfiles"]
    expect:
      check_id: exposure.git_exposed

  - name: detects-robots-sensitive-path
    type: beacon
    target: localhost:19843
    args: ["--no-enrich", "--no-nmap", "--scanners", "robotsmap", "--yes"]
    expect:
      check_id: exposure.robots_sensitive_path

  - name: detects-missing-hsts
    type: beacon
    target: localhost:19843
    args: ["--no-enrich", "--no-nmap", "--scanners", "secheaders", "--yes"]
    expect:
      check_id: headers.missing_hsts

  - name: detects-server-info-leak
    type: beacon
    target: localhost:19843
    args: ["--no-enrich", "--no-nmap", "--scanners", "secheaders", "--yes"]
    expect:
      check_id: headers.server_info_leak

  - name: detects-missing-csp
    type: beacon
    target: localhost:19843
    args: ["--no-enrich", "--no-nmap", "--scanners", "secheaders", "--yes"]
    expect:
      check_id: headers.missing_csp

  - name: detects-missing-x-frame-options
    type: beacon
    target: localhost:19843
    args: ["--no-enrich", "--no-nmap", "--scanners", "secheaders", "--yes"]
    expect:
      min_findings: 1

  - name: exposure-min-findings
    type: beacon
    target: localhost:19843
    args: ["--no-enrich", "--no-nmap", "--scanners", "exposedfiles", "--yes"]
    expect:
      min_findings: 0

  # --- Negative: no database findings on a static nginx ---
  - name: negative-no-sqli
    type: beacon
    target: localhost:19843
    args: ["--no-enrich", "--no-nmap", "--scanners", "exposedfiles", "--yes"]
    expect:
      not_check_id: web.sqli

  - name: negative-no-nosqli
    type: beacon
    target: localhost:19843
    args: ["--no-enrich", "--no-nmap", "--scanners", "exposedfiles", "--yes"]
    expect:
      not_check_id: web.nosqli

timeout: 5m
