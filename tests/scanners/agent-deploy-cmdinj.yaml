name: agent-deploy-cmdinj
description: >
  Multi-container scenario: web app with command injection + internal
  PostgreSQL database with credentials in web app's environment. Beacon
  should exploit command injection, deploy agent, collect evidence
  (env vars, network, credentials), discover internal database, and
  extract data through the agent.

services:
  webapp:
    image: vulnerables/web-dvwa:latest
    ports: ["8080:80"]
    environment:
      MYSQL_HOST: database
      MYSQL_USER: root
      MYSQL_PASSWORD: dvwa
      MYSQL_DATABASE: dvwa
      DATABASE_URL: "postgres://admin:secret123@internal-db:5432/customers"
      AWS_ACCESS_KEY_ID: "AKIAIOSFODNN7EXAMPLE"
      AWS_SECRET_ACCESS_KEY: "wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY"
    depends_on: [database]
    networks: [frontend, internal]

  database:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: dvwa
      MYSQL_DATABASE: dvwa
    networks: [frontend]

  internal-db:
    image: postgres:16
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret123
      POSTGRES_DB: customers
    networks: [internal]

networks:
  frontend:
  internal:

ready:
  cmd: "curl -sf http://localhost:8080/login.php -o /dev/null -w '%{http_code}' | grep -qE '200|302'"
  timeout: 180s
  interval: 5s

run:
  # Auto-complete DVWA setup (create database tables)
  - >
    curl -sf -X POST http://localhost:8080/setup.php
    -d 'create_db=Create+/+Reset+Database'
    -b 'PHPSESSID=test; security=low'
    -o /dev/null || true

assertions:
  # Beacon should find command injection (DVWA needs form login)
  - name: beacon-finds-cmdinj
    type: beacon
    target: localhost:8080
    auth:
      method: form
      username: admin
      password: password
    args: ["--exploit", "--yes", "--scanners", "cmdinj", "--format", "json"]
    expect:
      check_id: web.command_injection

  # Post-exploitation: credential harvest
  - name: beacon-harvests-creds
    type: beacon
    target: localhost:8080
    auth:
      method: form
      username: admin
      password: password
    args: ["--no-enrich", "--no-nmap", "--exploit", "--yes", "--scanners", "cmdinj"]
    expect:
      check_id: exploit.credential_harvest

  # Post-exploitation: internal network discovery
  - name: beacon-discovers-internal
    type: beacon
    target: localhost:8080
    auth:
      method: form
      username: admin
      password: password
    args: ["--no-enrich", "--no-nmap", "--exploit", "--yes", "--scanners", "cmdinj"]
    expect:
      check_id: exploit.internal_network_discovered
