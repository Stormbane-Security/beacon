name: nginx-status-exposed
description: >
  nginx with stub_status module enabled on /nginx_status, accessible
  without restriction. Beacon should detect the exposed nginx status
  endpoint which leaks active connection counts and request rates.
tags: [nginx, scanner, portscan, exposed, monitoring, gateway]

services:
  nginx:
    image: nginx:alpine
    ports: ["20064:80"]
    volumes:
      - ./nginx-status-exposed/nginx.conf:/etc/nginx/conf.d/default.conf:ro

ready:
  cmd: "curl -sf http://localhost:20064/ >/dev/null"
  timeout: 30s
  interval: 2s

assertions:
  # Pre-flight: nginx serves default page
  - name: nginx-default-page
    type: command
    expect:
      command: "curl -sf http://localhost:20064/ | grep -qi nginx"
      exit_code: 0

  # Pre-flight: stub_status endpoint accessible
  - name: nginx-status-endpoint-accessible
    type: command
    expect:
      command: "curl -sf http://localhost:20064/nginx_status | grep -q 'Active connections'"
      exit_code: 0

  # Scanner: detect service identification
  - name: detects-nginx-service
    type: beacon
    target: localhost:20064
    args: ["--no-enrich", "--no-nmap", "--scanners", "portscan", "--yes"]
    expect:
      check_id: port.service_identified

  # Scanner: detect missing HSTS header
  - name: detects-missing-hsts
    type: beacon
    target: localhost:20064
    args: ["--no-enrich", "--no-nmap", "--scanners", "secheaders", "--yes"]
    expect:
      check_id: headers.missing_hsts

  # Negative: not flagged as redis
  - name: negative-not-redis
    type: beacon
    target: localhost:20064
    args: ["--no-enrich", "--no-nmap", "--scanners", "portscan", "--yes"]
    expect:
      not_check_id: port.redis_unauthenticated

timeout: 5m
