name: ai-ollama-modellist
description: >
  Ollama LLM server exposed without authentication. Tests detection of the
  exposed endpoint, model listing, and port identification. Ollama starts
  with no models loaded, so model_downloadable may not fire — but the
  endpoint detection and port identification should always trigger.
tags: [ai, llm, ollama, noauth, surface]

services:
  ollama:
    image: ollama/ollama:latest
    ports: ["19889:11434"]

ready:
  cmd: "curl -sf http://localhost:19889/api/tags >/dev/null"
  timeout: 60s
  interval: 3s

assertions:
  # ── Pre-flight: Ollama API is accessible ────────────────────────────
  - name: preflight-ollama-api
    type: command
    expect:
      command: "curl -sf http://localhost:19889/api/tags | grep -q models"
      exit_code: 0

  - name: preflight-ollama-version
    type: command
    expect:
      command: "curl -sf http://localhost:19889/ -o /dev/null -w '%{http_code}' | grep -q 200"
      exit_code: 0

  # ── Surface: aidetect finds the exposed LLM endpoint ────────────────
  - name: detects-endpoint-exposed
    type: beacon
    target: localhost:19889
    args: ["--no-enrich", "--no-nmap", "--scanners", "aidetect"]
    expect:
      check_id: ai.endpoint_exposed

  # ── Surface: portscan identifies Ollama service ─────────────────────
  - name: detects-ollama-port
    type: beacon
    target: localhost:19889
    args: ["--no-enrich", "--no-nmap", "--scanners", "portscan", "--ports", "19889"]
    expect:
      check_id: port.ollama_exposed

  # ── Surface: model info exposed (empty list is still disclosure) ────
  # Ollama starts with no models, so ai.model_downloadable won't fire.
  # The aidetect scanner emits ai.endpoint_exposed for the API itself.
  - name: detects-endpoint-exposed
    type: beacon
    target: localhost:19889
    args: ["--no-enrich", "--no-nmap", "--scanners", "aidetect"]
    expect:
      min_findings: 1

  # ── Negative: no database findings ──────────────────────────────────
  - name: negative-no-database
    type: beacon
    target: localhost:19889
    args: ["--no-enrich", "--no-nmap", "--scanners", "aidetect"]
    expect:
      not_check_id: port.mysql_unauthenticated

  # ── Negative: no blockchain findings ────────────────────────────────
  - name: negative-no-chain
    type: beacon
    target: localhost:19889
    args: ["--no-enrich", "--no-nmap", "--scanners", "aidetect"]
    expect:
      not_check_id: chain.node_rpc_exposed

timeout: 5m
