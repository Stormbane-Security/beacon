server {
    listen 80;
    server_name _;

    location / {
        # CSP in report-only mode — no enforcing header present
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline'";
        return 200 '<html><body><h1>CSP Report-Only Test</h1></body></html>';
        default_type text/html;
    }
}
