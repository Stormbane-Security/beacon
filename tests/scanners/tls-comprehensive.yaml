name: tls-comprehensive
description: >
  Nginx with an expired self-signed certificate, weak non-PFS ciphers,
  and misconfigured HSTS header (max-age=60, no preload/subdomains).
  Tests TLS scanner detections for expired cert, weak ciphers, and
  missing cert metadata.
tags: [tls, certificate, expired, hsts, cipher, scanner]

services:
  nginx-tls:
    image: nginx:alpine
    ports: ["20143:443"]
    volumes:
      - ./tls-comprehensive/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    entrypoint: ["/bin/sh", "-c", "apk add --no-cache openssl >/dev/null 2>&1; mkdir -p /etc/nginx/ssl && openssl req -x509 -nodes -days 1 -newkey rsa:2048 -keyout /etc/nginx/ssl/server.key -out /etc/nginx/ssl/server.crt -subj '/CN=localhost' 2>/dev/null && nginx -g 'daemon off;'"]

ready:
  cmd: "curl -sk https://localhost:20143/health >/dev/null"
  timeout: 60s
  interval: 3s

assertions:
  # Pre-flight: TLS endpoint responds
  - name: preflight-tls-works
    type: command
    expect:
      command: "curl -sk https://localhost:20143/ | grep -q 'TLS test'"
      exit_code: 0

  # Pre-flight: cert is expired or self-signed
  - name: preflight-cert-issues
    type: command
    expect:
      command: "echo | openssl s_client -connect localhost:20143 2>/dev/null | openssl x509 -noout -issuer 2>/dev/null | grep -q 'localhost'"
      exit_code: 0

  # Beacon detects TLS issues via portscan JA3S probe
  - name: detects-tls-issues
    type: beacon
    target: localhost:20143
    args: ["--no-enrich", "--no-nmap", "--scanners", "portscan", "--yes"]
    expect:
      min_findings: 1

  # Beacon detects weak HSTS
  - name: detects-hsts-present
    type: beacon
    target: localhost:20143
    args: ["--no-enrich", "--no-nmap", "--scanners", "secheaders", "--yes"]
    expect:
      min_findings: 1

  # Negative
  - name: negative-no-redis
    type: beacon
    target: localhost:20143
    args: ["--no-enrich", "--no-nmap", "--scanners", "portscan", "--yes"]
    expect:
      not_check_id: port.redis_unauthenticated

timeout: 5m
