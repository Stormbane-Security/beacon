events {
    worker_connections 64;
}

http {
    server {
        listen 80;
        server_name _;

        # Simple "WAF" that blocks common SQL injection patterns literally.
        # This is intentionally weak — it blocks exact matches but misses
        # encoded variants, demonstrating bypass detection.
        location / {
            # Block obvious SQLi patterns
            if ($args ~* "OR.1=1|UNION.SELECT|DROP.TABLE|'--") {
                return 403;
            }
            if ($args ~* "SELECT.+FROM|INSERT.INTO|DELETE.FROM") {
                return 403;
            }

            # Pass through to backend
            proxy_pass http://backend:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
