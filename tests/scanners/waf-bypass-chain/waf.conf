server {
    listen 80;
    server_name _;

    # Simulated WAF layer: nginx reverse proxy in front of app.
    # Adds WAF-like headers, proxies to backend app on port 8080.
    # Origin is also directly accessible on port 8081 (WAF bypass).

    add_header X-WAF-Status "active";
    add_header Server "CloudProxy/2.1";

    # Block obvious attack patterns (simulated WAF rules)
    location ~* \.(php|asp|aspx|jsp|cgi)$ {
        return 403 'Blocked by WAF';
    }

    # Block SQL injection patterns in query strings
    set $blocked 0;
    if ($args ~* "(union|select|drop|insert|delete|update|exec|xp_)") {
        set $blocked 1;
    }
    if ($blocked = 1) {
        return 403 'Blocked by WAF';
    }

    # Proxy everything else to the backend app
    location / {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
