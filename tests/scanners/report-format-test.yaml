name: report-format-test
description: >
  Verifies that beacon produces output with expected sections.
  Scans a simple nginx server and checks the text report format.
tags: [report, format, smoke]

services:
  nginx:
    image: nginx:alpine
    ports: ["19884:80"]

ready:
  cmd: "curl -sf http://localhost:19884/ >/dev/null"
  timeout: 30s
  interval: 2s

assertions:
  # Pre-flight
  - name: nginx-accessible
    type: command
    expect:
      command: "curl -sf http://localhost:19884/ | grep -qi nginx"
      exit_code: 0

  # Beacon scan produces findings
  - name: scan-produces-findings
    type: beacon
    target: localhost:19884
    args: ["--no-enrich", "--no-nmap", "--scanners", "secheaders"]
    expect:
      check_id: headers.missing_hsts

  # Generate report to file and check it
  - name: report-file-generated
    type: command
    expect:
      command: "beacon scan --host localhost:19884 --no-enrich --no-nmap --no-db --scanners secheaders --out /tmp/test-report.txt --yes 2>/dev/null && test -s /tmp/test-report.txt && grep -qi 'BEACON SECURITY REPORT' /tmp/test-report.txt"
      exit_code: 0

timeout: 3m
