name: oauth-keycloak-misconfig
description: >
  Keycloak 22 in dev mode — a real OIDC/OAuth2 identity provider. Tests
  discovery document analysis, implicit flow detection, JWKS exposure,
  admin panel exposure, token endpoint probing, and backchannel logout
  absence. Keycloak dev mode is intentionally insecure for development.
tags: [oauth, scanner, web, keycloak, oidc, iam]

services:
  keycloak:
    image: quay.io/keycloak/keycloak:22.0
    ports: ["8180:8080"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    command: ["start-dev"]

ready:
  cmd: "curl -sfo /dev/null http://localhost:8180/"
  timeout: 300s
  interval: 5s

commands:
  # Keycloak master realm requires HTTPS by default even in dev mode.
  # Disable it via kcadm.sh so the OIDC discovery endpoint works over HTTP.
  - name: disable-ssl
    run: >
      docker exec $(docker ps -qf "name=keycloak") /opt/keycloak/bin/kcadm.sh
      config credentials --server http://localhost:8080 --realm master --user admin --password admin &&
      docker exec $(docker ps -qf "name=keycloak") /opt/keycloak/bin/kcadm.sh
      update realms/master -s sslRequired=NONE

assertions:
  # --- Exploit proofs: verify OIDC/OAuth misconfigurations are real ---
  - name: exploit-oidc-discovery-accessible
    type: command
    expect:
      command: "curl -sf http://localhost:8180/realms/master/.well-known/openid-configuration | grep -q 'authorization_endpoint'"
      exit_code: 0

  - name: exploit-oidc-implicit-flow-advertised
    type: command
    expect:
      command: "curl -sf http://localhost:8180/realms/master/.well-known/openid-configuration | python3 -c \"import sys,json; d=json.load(sys.stdin); assert 'token' in d.get('response_types_supported',[]), 'no implicit'; print('implicit flow advertised')\""
      exit_code: 0

  - name: exploit-jwks-endpoint-accessible
    type: command
    expect:
      command: "curl -sf http://localhost:8180/realms/master/protocol/openid-connect/certs | grep -q 'keys'"
      exit_code: 0

  - name: exploit-jwks-contains-rsa-key
    type: command
    expect:
      command: "curl -sf http://localhost:8180/realms/master/protocol/openid-connect/certs | python3 -c \"import sys,json; d=json.load(sys.stdin); assert any(k.get('kty')=='RSA' for k in d['keys']), 'no RSA key'; print('RSA key found')\""
      exit_code: 0

  - name: exploit-admin-console-accessible
    type: command
    expect:
      command: "curl -sf http://localhost:8180/admin/ | grep -qi 'keycloak\\|authServerUrl\\|administration'"
      exit_code: 0

  - name: exploit-token-endpoint-exists
    type: command
    expect:
      command: "curl -s -X POST http://localhost:8180/realms/master/protocol/openid-connect/token -d 'grant_type=client_credentials' -o /dev/null -w '%{http_code}' | grep -qP '400|401|200'"
      exit_code: 0

  - name: exploit-auth-endpoint-exists
    type: command
    expect:
      command: "curl -s -o /dev/null -w '%{http_code}' 'http://localhost:8180/realms/master/protocol/openid-connect/auth?response_type=code&client_id=test&redirect_uri=http://localhost' | grep -qP '200|302|400'"
      exit_code: 0

  # --- Negative: userinfo requires authorization ---
  - name: negative-userinfo-requires-auth
    type: command
    expect:
      command: "STATUS=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8180/realms/master/protocol/openid-connect/userinfo); [ \"$STATUS\" = \"401\" ] || [ \"$STATUS\" = \"403\" ]"
      exit_code: 0

  # --- Negative: OIDC doc uses strong signing alg ---
  - name: negative-signing-alg-is-strong
    type: command
    expect:
      command: "curl -sf http://localhost:8180/realms/master/.well-known/openid-configuration | python3 -c \"import sys,json; d=json.load(sys.stdin); algs=d.get('id_token_signing_alg_values_supported',[]); assert 'none' not in algs, 'none in algs'; print('no weak alg')\""
      exit_code: 0

  # --- Scanner detection ---
  - name: detects-token-in-fragment
    type: beacon
    target: localhost:8180
    args: ["--no-enrich", "--scanners", "oauth", "--ports", "8080"]
    expect:
      check_id: oauth.token_in_url_fragment

  - name: detects-implicit-flow
    type: beacon
    target: localhost:8180
    args: ["--no-enrich", "--scanners", "oauth", "--ports", "8080"]
    expect:
      check_id: oauth.implicit_flow

  - name: detects-idp-admin-exposed
    type: beacon
    target: localhost:8180
    args: ["--no-enrich", "--scanners", "iam", "--ports", "8080"]
    expect:
      check_id: iam.idp_admin_exposed

timeout: 10m
