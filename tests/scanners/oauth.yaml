name: oauth-keycloak-misconfig
description: "Keycloak dev mode with implicit flow enabled triggers oauth.implicit_flow"
tags: [oauth, scanner, web, keycloak]

services:
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    ports: ["8080:8080"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    command: ["start-dev"]

ready:
  cmd: "curl -sf http://localhost:8080/realms/master/.well-known/openid-configuration >/dev/null"
  timeout: 90s
  interval: 3s

assertions:
  - name: detects-implicit-flow
    type: beacon
    target: localhost:8080
    args: ["--no-enrich", "--scanners", "oauth"]
    expect:
      check_id: oauth.implicit_flow

  - name: detects-jwks-exposed
    type: beacon
    target: localhost:8080
    args: ["--no-enrich", "--scanners", "oauth"]
    expect:
      check_id: oauth.jwks_exposed

timeout: 5m
