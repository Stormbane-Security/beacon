name: nginx-alias-traversal
description: "nginx misconfigured alias directive allowing path traversal"
tags: [nginx, traversal, web]

services:
  nginx:
    image: nginx:alpine
    ports: ["80:80"]
    volumes:
      - ./nginx-alias/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx-alias/html:/var/www/html:ro
      - ./nginx-alias/secret:/var/secret:ro

ready:
  cmd: "curl -sf http://localhost:80/ >/dev/null"
  timeout: 30s
  interval: 2s

assertions:
  - name: detects-nginx-alias-traversal
    type: beacon
    target: nginx
    args: ["--no-enrich", "--scanners", "nginx", "--deep", "--permission-confirmed", "--ports", "80"]
    expect:
      check_id: web.nginx_alias_traversal

timeout: 5m
