name: web-secret-in-response-header
description: >
  Nginx leaking API key and GitHub token in custom response headers.
  Beacon webcontent/secheaders scanner should detect web.secret_in_response_header
  and web.tech_detected from the Server header.
tags: [web, scanner, secret, header, exposure]

services:
  nginx:
    image: nginx:alpine
    ports: ["20090:80"]
    volumes:
      - ./web-secret-header/nginx.conf:/etc/nginx/conf.d/default.conf:ro

ready:
  cmd: "curl -sf http://localhost:20090/health >/dev/null"
  timeout: 30s
  interval: 2s

assertions:
  # --- Exploit proofs ---
  - name: exploit-api-key-in-header
    type: command
    expect:
      command: "curl -sI http://localhost:20090/ | grep -i 'X-Api-Key' | grep -q 'AKIA'"
      exit_code: 0

  - name: exploit-github-token-in-header
    type: command
    expect:
      command: "curl -sI http://localhost:20090/ | grep -i 'X-Internal-Token' | grep -q 'ghp_'"
      exit_code: 0

  # --- Scanner detections ---
  - name: detects-secret-in-response-header
    type: beacon
    target: localhost:20090
    args: ["--no-enrich", "--no-nmap", "--scanners", "secheaders,webcontent", "--yes"]
    expect:
      check_id: web.secret_in_response_header

  - name: detects-server-info-leak
    type: beacon
    target: localhost:20090
    args: ["--no-enrich", "--no-nmap", "--scanners", "secheaders", "--yes"]
    expect:
      check_id: headers.server_info_leak

  # --- Negative ---
  - name: negative-no-sqli
    type: beacon
    target: localhost:20090
    args: ["--no-enrich", "--no-nmap", "--scanners", "secheaders,webcontent", "--yes"]
    expect:
      not_check_id: web.sqli

timeout: 5m
