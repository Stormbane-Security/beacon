name: grafana-to-postgres
description: >
  Grafana with default credentials connected to PostgreSQL containing customer
  PII. Beacon should detect default creds and enumerate datasources.
tags: [pivot, grafana, postgres, defaultcreds, authorized, exploit]

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: grafana
      POSTGRES_PASSWORD: grafana_secret_pw
      POSTGRES_DB: customers
    volumes:
      - ./grafana-postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  grafana:
    image: grafana/grafana:latest
    ports: ["9350:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana-postgres/datasource.yaml:/etc/grafana/provisioning/datasources/ds.yaml:ro
    depends_on: [postgres]

ready:
  cmd: "curl -sf http://localhost:9350/api/health >/dev/null"
  timeout: 90s
  interval: 3s

assertions:
  # Pre-flight: default creds work
  - name: exploit-grafana-default-creds-work
    type: command
    expect:
      command: "curl -sf -u admin:admin http://localhost:9350/api/org | grep -q 'name'"
      exit_code: 0

  # Pre-flight: datasource provisioned
  - name: exploit-datasource-provisioned
    type: command
    expect:
      command: "curl -sf -u admin:admin http://localhost:9350/api/datasources | grep -q 'CustomerDB'"
      exit_code: 0

  # Beacon detection: default creds found
  - name: detects-grafana-default-creds
    type: beacon
    target: localhost:9350
    args: ["--no-enrich", "--no-nmap", "--scanners", "portscan", "--deep", "--yes"]
    expect:
      check_id: port.grafana_default_credentials

  # Beacon exploitation: datasource enumeration
  - name: beacon-authorized-exploitation
    type: beacon
    target: localhost:9350
    args: ["--no-enrich", "--no-nmap", "--scanners", "portscan", "--exploit", "--yes"]
    expect:
      min_findings: 0

timeout: 8m
