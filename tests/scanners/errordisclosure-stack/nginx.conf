server {
    listen 80;
    server_name _;

    # Error information disclosure test: simulates a server that leaks
    # stack traces in error responses and exposes debug endpoints.

    # Root page — normal response.
    location = / {
        default_type text/html;
        return 200 '<html><body><h1>Welcome</h1></body></html>';
    }

    # Debug endpoint — exposed pprof-like diagnostic page.
    location = /debug/pprof/ {
        default_type text/html;
        return 200 '<html><body>
<h1>pprof</h1>
<p>goroutines: 42</p>
<p>memstats: {Alloc: 1048576, TotalAlloc: 8388608}</p>
<p>cmdline: /app/server --port=8080</p>
<pre>
heap profile: 3: 1024 [5: 2048] @ heap/1048576
1: 512 [1: 512] @ 0x4a3b2c 0x4a3b2d
</pre>
</body></html>';
    }

    # Python-style stack trace on any unknown path.
    location / {
        default_type text/html;
        return 500 '<html><body>
<h1>Internal Server Error</h1>
<pre>
Traceback (most recent call last):
  File "/app/views.py", line 42, in handle_request
    result = db.query(user_input)
  File "/usr/lib/python3.11/site-packages/sqlalchemy/engine/base.py", line 1965, in execute
    return meth(self, multiparams, params, _EMPTY_EXECUTION_OPTS)
  File "/usr/lib/python3.11/site-packages/sqlalchemy/sql/elements.py", line 483, in _execute_on_connection
    return connection._execute_clauseelement(self, multiparams, params, execution_options)
sqlalchemy.exc.ProgrammingError: (psycopg2.errors.SyntaxError) syntax error at or near "'"
LINE 1: SELECT * FROM users WHERE name = '''
                                          ^
[SQL: SELECT * FROM users WHERE name = %s]

Environment: FLASK_ENV=development, DEBUG=True
Database: postgresql://dbuser:s3cretpass@db.internal:5432/appdb
</pre>
</body></html>';
    }
}
