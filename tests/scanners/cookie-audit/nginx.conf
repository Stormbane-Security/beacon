server {
    listen 80;
    server_name localhost;

    location / {
        add_header Set-Cookie "session=abc123; Path=/";
        add_header Set-Cookie "auth_token=xyz789; Path=/" always;
        return 200 '<!DOCTYPE html><html><body><h1>Cookie Test</h1></body></html>';
        add_header Content-Type text/html;
    }
}
