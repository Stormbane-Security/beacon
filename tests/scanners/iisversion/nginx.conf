server {
    listen 80;

    # Simulate IIS server headers
    add_header X-Powered-By "ASP.NET" always;

    location / {
        more_set_headers "Server: Microsoft-IIS/10.0";
        return 200 "Welcome to IIS";
    }

    # Simulate IIS-branded 404 error page with version info leak
    location ~ \.aspx$ {
        more_set_headers "Server: Microsoft-IIS/10.0";
        add_header X-AspNet-Version "4.0.30319" always;
        default_type text/html;
        return 404 '<html><body>
<h2>404 - File or directory not found.</h2>
<h3>The resource you are looking for might have been removed, had its name changed, or is temporarily unavailable.</h3>
<hr>
<p>Version Information: Microsoft .NET Framework Version:4.0.30319; ASP.NET Version:4.8.4494.0</p>
</body></html>';
    }

    location /trace.axd {
        more_set_headers "Server: Microsoft-IIS/10.0";
        add_header X-AspNet-Version "4.0.30319" always;
        default_type text/html;
        return 200 '<html><body><h1>Application Trace</h1><p>ASP.NET Version:4.8.4494.0</p></body></html>';
    }
}
