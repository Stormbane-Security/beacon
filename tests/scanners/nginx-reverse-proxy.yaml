name: nginx-reverse-proxy-backends
description: >
  Nginx reverse proxy fronting Jenkins, SonarQube, and Gitea at different
  paths. Beacon should detect nginx as the proxy type, identify the backend
  services accessible through the proxy paths, and flag any exposed services
  that shouldn't be publicly accessible.
tags: [nginx, proxy, scanner, fingerprint, gateway, backends]

services:
  jenkins:
    image: jenkins/jenkins:2.440-jdk17
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false

  sonarqube:
    image: sonarqube:lts-community
    environment:
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true

  gitea:
    image: gitea/gitea:latest
    environment:
      - GITEA__security__INSTALL_LOCK=true

  nginx:
    image: nginx:latest
    ports: ["18072:80"]
    volumes:
      - ./nginx-reverse-proxy/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - jenkins
      - sonarqube
      - gitea

ready:
  cmd: "curl -sf http://localhost:18072/ -o /dev/null"
  timeout: 120s
  interval: 5s

assertions:
  # Classification: beacon identifies nginx proxy
  - name: classify-detects-nginx
    type: classify
    target: localhost:18072
    expect:
      proxy_type: nginx

  # Classification: beacon detects as reverse proxy
  - name: classify-is-reverse-proxy
    type: classify
    target: localhost:18072
    expect:
      is_reverse_proxy: true

  # Pre-flight: Jenkins accessible through proxy
  - name: proxy-jenkins-accessible
    type: command
    expect:
      command: "curl -sf http://localhost:18072/jenkins/ | grep -qi jenkins"
      exit_code: 0

  # Pre-flight: SonarQube accessible through proxy
  - name: proxy-sonarqube-accessible
    type: command
    expect:
      command: "curl -sf http://localhost:18072/sonarqube/ | grep -qi sonarqube"
      exit_code: 0

  # Scanner: detect gateway/proxy
  - name: detects-nginx-proxy
    type: beacon
    target: localhost:18072
    args: ["--no-enrich", "--scanners", "gateway"]
    expect:
      check_id: gateway.nginx_default_page

timeout: 10m
