name: docker-registry-exposed
description: >
  Docker registry:2 with anonymous access. Beacon containerimage
  scanner should detect registry exposure and anonymous catalog access.
tags: [container, scanner, docker, registry]

services:
  registry:
    image: registry:2
    ports: ["19866:5000"]
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"

ready:
  cmd: "curl -sf http://localhost:19866/v2/ >/dev/null"
  timeout: 30s
  interval: 2s

assertions:
  - name: exploit-registry-v2-accessible
    type: command
    expect:
      command: "curl -s -o /dev/null -w '%{http_code}' http://localhost:19866/v2/ | grep -q '200'"
      exit_code: 0

  - name: exploit-registry-catalog-accessible
    type: command
    expect:
      command: "curl -sf http://localhost:19866/v2/_catalog | grep -q 'repositories'"
      exit_code: 0

  - name: detects-registry-exposed
    type: beacon
    target: localhost:19866
    args: ["--no-enrich", "--no-nmap", "--scanners", "containerimage", "--deep", "--yes"]
    expect:
      check_id: container.registry_exposed

  - name: negative-no-kubernetes-findings
    type: beacon
    target: localhost:19866
    args: ["--no-enrich", "--no-nmap", "--scanners", "containerimage"]
    expect:
      not_check_id: container.k8s_api_exposed

timeout: 5m
