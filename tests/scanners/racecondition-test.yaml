name: racecondition-test
description: >
  Race condition scanner against a Node.js app with a non-idempotent
  counter endpoint. POST /increment has no locking or idempotency
  protection, so concurrent requests can cause the counter to lose
  increments (classic TOCTOU). The racecondition scanner should detect
  that concurrent requests produce inconsistent state.
tags: [racecondition, scanner, web, authorized, toctou]

services:
  app:
    image: node:20-alpine
    ports: ["19877:3000"]
    volumes:
      - ./racecondition-test/server.js:/app/server.js:ro
    command: ["node", "/app/server.js"]

ready:
  cmd: "curl -sf http://localhost:19877/ | grep -q 'ok'"
  timeout: 60s
  interval: 3s

assertions:
  # ── Pre-flight: verify endpoints work ────────────────────────────────────
  - name: exploit-index-accessible
    type: command
    expect:
      command: "curl -sf http://localhost:19877/ | grep -q 'ok'"
      exit_code: 0

  - name: exploit-increment-works
    type: command
    expect:
      command: "curl -sf -X POST http://localhost:19877/increment | grep -q 'count'"
      exit_code: 0

  - name: exploit-count-works
    type: command
    expect:
      command: "curl -sf http://localhost:19877/count | grep -q 'count'"
      exit_code: 0

  - name: exploit-concurrent-requests-lose-increments
    type: command
    expect:
      command: "for i in $(seq 1 20); do curl -s -X POST http://localhost:19877/increment & done; wait; COUNT=$(curl -sf http://localhost:19877/count | python3 -c 'import sys,json; print(json.load(sys.stdin)[\"count\"])'); test $COUNT -lt 22"
      exit_code: 0

  # ── Scanner detection: racecondition finds TOCTOU ────────────────────────
  - name: detects-race-condition
    type: beacon
    target: localhost:19877
    args: ["--no-enrich", "--no-nmap", "--scanners", "racecondition", "--authorized"]
    expect:
      min_findings: 1

  # ── Negative: should NOT emit CORS findings ──────────────────────────────
  - name: negative-no-cors-finding
    type: beacon
    target: localhost:19877
    args: ["--no-enrich", "--no-nmap", "--scanners", "racecondition", "--authorized"]
    expect:
      not_check_id: web.cors_misconfiguration

timeout: 5m
