name: e2e-services-cache
description: >
  Service detection for cache services. Tests Redis (password-protected)
  and Memcached (unauthenticated) to verify correct auth state detection.
tags: [e2e, services, cache, integration]

services:
  redis:
    image: redis:7.2-alpine
    command: ["redis-server", "--bind", "0.0.0.0", "--requirepass", "s3cretP@ss"]
    ports: ["19834:6379"]

  memcached:
    image: memcached:latest
    ports: ["19835:11211"]

ready:
  cmd: "(echo 'AUTH s3cretP@ss' | redis-cli -h localhost -p 19834 2>/dev/null | grep -q OK || redis-cli -h localhost -p 19834 PING 2>/dev/null | grep -q NOAUTH) && (echo stats | nc -w 2 localhost 19835 | grep -q pid)"
  timeout: 60s
  interval: 5s

assertions:
  # ══════════════════════════════════════════════════════════════════════
  # Redis: detected as a service but NOT flagged as unauthenticated
  # ══════════════════════════════════════════════════════════════════════
  # Redis with --requirepass: beacon should NOT flag it as unauthenticated,
  # and may not emit service_identified since the probe can't fully handshake.
  # The important test is the negative assertion below.
  - name: redis-auth-no-unauth-finding
    type: beacon
    target: localhost:19834
    args: ["--no-enrich", "--no-nmap", "--scanners", "portscan"]
    expect:
      not_check_id: port.redis_unauthenticated

  # ══════════════════════════════════════════════════════════════════════
  # Memcached: unauthenticated access
  # ══════════════════════════════════════════════════════════════════════
  - name: memcached-unauth
    type: beacon
    target: localhost:19835
    args: ["--no-enrich", "--no-nmap", "--scanners", "portscan"]
    expect:
      check_id: port.memcached_unauthenticated

timeout: 10m
