server {
    listen 80;
    server_name _;

    # Webcontent scanner checks: cookies, CSP, response headers, JS secrets.
    # This config intentionally exposes all patterns the scanner detects.

    location = / {
        default_type text/html;

        # Insecure session cookie: missing Secure, HttpOnly, SameSite
        add_header Set-Cookie "session_id=abc123def456; Path=/";
        # Permissive CSP with wildcard in script-src
        add_header Content-Security-Policy "default-src 'self'; script-src *";
        # Leak a secret in response header (API key pattern)
        add_header X-Debug-Key "AKIA1234567890ABCDEF";

        return 200 '<html><head><title>App</title></head><body>
<h1>Dashboard</h1>
<script src="/static/app.js"></script>
<script src="/static/config.js"></script>
</body></html>';
    }

    location = /static/app.js {
        default_type application/javascript;
        return 200 '
// Application bundle
var API_ENDPOINT = "http://192.168.1.100/api/internal/data";
var STAGING_URL = "https://staging-api.internal/v2/users";
var config = {
    api_key: "beacon_test_key_01234567890abcdef01234567890",
    awsKey: "AKIA1234567890ABCDEF",
    githubToken: "ghp_1234567890abcdefghijklmnopqrstuvwxyz"
};
function fetchData(userId) {
    return fetch("https://api.example.com/v1/data?api_key=beacon_test_01234567890abcdef012345678&user=" + userId);
}
';
    }

    location = /static/config.js {
        default_type application/javascript;
        return 200 '
// Config
var DEBUG_API = "http://10.0.0.5:8080/admin/debug";
var password = "SuperSecretP@ssw0rd123!";
';
    }

    location / {
        return 404;
    }
}
