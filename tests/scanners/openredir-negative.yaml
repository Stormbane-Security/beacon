name: openredir-secure-no-finding
description: >
  nginx with fixed redirects that do not accept user input. The login
  redirect goes to /dashboard (relative). Beacon open redirect scanner
  must NOT flag fixed redirects as open redirects.
tags: [openredir, scanner, negative, false-positive]

services:
  app:
    image: nginx:alpine
    ports: ["9465:80"]
    volumes:
      - ./openredir-negative/default.conf:/etc/nginx/conf.d/default.conf:ro

ready:
  cmd: "curl -sf http://localhost:9465/ >/dev/null"
  timeout: 30s
  interval: 2s

assertions:
  - name: setup-redirect-is-relative
    type: command
    expect:
      command: "curl -sI http://localhost:9465/login | grep -i 'location: /dashboard'"
      exit_code: 0

  - name: no-openredir-false-positive
    type: beacon
    target: localhost:9465
    args: ["--no-enrich", "--scanners", "openredir", "--deep", "--yes"]
    expect:
      no_check_id: web.open_redirect

timeout: 3m
