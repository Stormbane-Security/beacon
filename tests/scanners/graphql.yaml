name: graphql-introspection
description: "Python GraphQL server with introspection enabled triggers graphql.introspection_enabled"
tags: [graphql, scanner, api]

services:
  graphql-app:
    build:
      context: ./graphql
      dockerfile: Dockerfile
    ports: ["8080:8080"]

ready:
  cmd: "curl -sf http://localhost:8080/health >/dev/null"
  timeout: 30s
  interval: 2s

assertions:
  - name: detects-graphql-introspection
    type: beacon
    target: graphql-app
    args: ["--no-enrich", "--scanners", "graphql", "--ports", "8080"]
    expect:
      check_id: graphql.introspection_enabled

timeout: 5m
