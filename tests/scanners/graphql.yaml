name: graphql-introspection
description: "Python GraphQL server with introspection enabled triggers graphql.introspection_enabled"
tags: [graphql, scanner, api]

services:
  graphql-app:
    build:
      context: ./graphql
      dockerfile: Dockerfile
    ports: ["9201:8080"]

ready:
  cmd: "curl -sf http://localhost:9201/health >/dev/null"
  timeout: 30s
  interval: 2s

assertions:
  - name: exploit-graphql-introspection-query
    type: command
    expect:
      command: "curl -sf -X POST http://localhost:9201/graphql -H 'Content-Type: application/json' -d '{\"query\":\"{__schema{types{name}}}\"}' | grep -q '__schema'"
      exit_code: 0

  - name: detects-graphql-introspection
    type: beacon
    target: localhost:9201
    args: ["--no-enrich", "--no-nmap", "--scanners", "graphql", "--ports", "8080"]
    expect:
      check_id: graphql.introspection_enabled

timeout: 5m
