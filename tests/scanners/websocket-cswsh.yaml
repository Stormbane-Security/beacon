name: websocket-cswsh
description: "WebSocket server without Origin validation — cross-site WebSocket hijacking"
tags: [websocket, cswsh, web, authorized]

services:
  app:
    build:
      context: ./websocket-cswsh
      dockerfile: Dockerfile
    ports: ["9302:8080"]

ready:
  cmd: "curl -sf http://localhost:9302/ >/dev/null"
  timeout: 30s
  interval: 2s

assertions:
  - name: detects-websocket-cswsh
    type: beacon
    target: app:8080
    args: ["--no-enrich", "--scanners", "portscan", "--deep", "--permission-confirmed", "--authorized", "--ports", "8080"]
    expect:
      check_id: websocket.cswsh

timeout: 5m
