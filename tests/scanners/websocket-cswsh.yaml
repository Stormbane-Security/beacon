name: websocket-cswsh
description: "ttyd terminal server with WebSocket at /ws — no Origin validation (CSWSH)"
tags: [websocket, cswsh, web, authorized]

services:
  ttyd:
    image: tsl0922/ttyd:latest
    ports: ["9302:7681"]

ready:
  cmd: "curl -sf http://localhost:9302/ >/dev/null"
  timeout: 30s
  interval: 2s

assertions:
  - name: exploit-websocket-upgrade-accepted
    type: command
    expect:
      command: "curl -sI -H 'Upgrade: websocket' -H 'Connection: Upgrade' -H 'Sec-WebSocket-Key: dGhlIHNhbXBsZSBub25jZQ==' -H 'Sec-WebSocket-Version: 13' -H 'Origin: https://evil.com' http://localhost:9302/ws | grep -qi '101\\|Switching'"
      exit_code: 0

  - name: detects-websocket-cswsh
    type: beacon
    target: localhost:9302
    args: ["--no-enrich", "--scanners", "websocket", "--deep", "--permission-confirmed", "--authorized"]
    expect:
      check_id: websocket.cswsh

timeout: 5m
