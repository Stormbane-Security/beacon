name: variant-vault-versions
description: >
  HashiCorp Vault version variant test: 1.13 vs 1.15 in dev mode.
  Verifies that beacon detects exposed Vault API across both versions,
  catching regressions where response format or header changes break
  detection.
tags: [variant, vault, infrastructure, integration]

services:
  vault113:
    image: hashicorp/vault:1.13
    ports: ["20532:8200"]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    cap_add: [IPC_LOCK]
    command: ["vault", "server", "-dev"]

  vault115:
    image: hashicorp/vault:1.15
    ports: ["20533:8200"]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    cap_add: [IPC_LOCK]
    command: ["vault", "server", "-dev"]

ready:
  cmd: "curl -sf http://localhost:20532/v1/sys/health >/dev/null && curl -sf http://localhost:20533/v1/sys/health >/dev/null"
  timeout: 90s
  interval: 5s

assertions:
  # ══════════════════════════════════════════════════════════════════════
  # VAULT 1.13 — exposed API detection
  # ══════════════════════════════════════════════════════════════════════

  - name: vault113-exposed-detected
    type: beacon
    target: localhost:20532
    args: ["--no-enrich", "--no-nmap", "--ports", "20532"]
    expect:
      check_id: port.vault_exposed

  - name: vault113-service-identified
    type: beacon
    target: localhost:20532
    args: ["--no-enrich", "--no-nmap", "--ports", "20532"]
    expect:
      check_id: port.service_identified

  - name: exploit-vault113-deep-scan
    type: beacon
    target: localhost:20532
    args: ["--no-enrich", "--no-nmap", "--ports", "20532", "--deep", "--yes"]
    expect:
      min_findings: 0

  # ══════════════════════════════════════════════════════════════════════
  # VAULT 1.15 — exposed API detection
  # ══════════════════════════════════════════════════════════════════════

  - name: vault115-exposed-detected
    type: beacon
    target: localhost:20533
    args: ["--no-enrich", "--no-nmap", "--ports", "20533"]
    expect:
      check_id: port.vault_exposed

  - name: vault115-service-identified
    type: beacon
    target: localhost:20533
    args: ["--no-enrich", "--no-nmap", "--ports", "20533"]
    expect:
      check_id: port.service_identified

  - name: exploit-vault115-deep-scan
    type: beacon
    target: localhost:20533
    args: ["--no-enrich", "--no-nmap", "--ports", "20533", "--deep", "--yes"]
    expect:
      min_findings: 0

  # ══════════════════════════════════════════════════════════════════════
  # NEGATIVE — no cross-contamination
  # ══════════════════════════════════════════════════════════════════════

  - name: negative-vault113-not-consul
    type: beacon
    target: localhost:20532
    args: ["--no-enrich", "--no-nmap", "--ports", "20532"]
    expect:
      not_check_id: port.consul_no_acl

  - name: negative-vault115-not-consul
    type: beacon
    target: localhost:20533
    args: ["--no-enrich", "--no-nmap", "--ports", "20533"]
    expect:
      not_check_id: port.consul_no_acl

timeout: 5m
