name: deserial-java-app
description: >
  Spring Boot PetClinic (Java) app — deserial scanner probes for Java
  serialization magic bytes and .NET ViewState patterns in responses.
tags: [deserial, scanner, web, java]

services:
  petclinic:
    image: arey/springboot-petclinic:latest
    ports: ["9262:8080"]

ready:
  cmd: "curl -sf http://localhost:9262/ >/dev/null"
  timeout: 120s
  interval: 5s

assertions:
  - name: exploit-java-app-running
    type: command
    expect:
      command: "curl -s -o /dev/null -w '%{http_code}' http://localhost:9262/ | grep -q '200'"
      exit_code: 0

  # Deserial scans for magic bytes in responses and tests POST endpoints
  # for serialized object acceptance. The scan should complete cleanly.
  - name: deserial-scan-completes
    type: beacon
    target: localhost:9262
    args: ["--no-enrich", "--scanners", "deserial", "--deep", "--permission-confirmed"]
    expect:
      min_findings: 0

timeout: 10m
