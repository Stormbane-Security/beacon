server {
    listen 80;
    server_name _;

    # Intentionally leaks API key and token in response headers
    add_header X-Api-Key "AKIAIOSFODNN7EXAMPLE1" always;
    add_header X-Internal-Token "ghp_ABCDEFghijklmnop1234567890abcdefghij" always;
    add_header Server "nginx/1.14.0" always;

    location / {
        default_type text/html;
        return 200 '<html><body><h1>Application</h1><p>Version 2.1.0</p></body></html>';
    }

    location /health {
        return 200 'ok';
    }
}
