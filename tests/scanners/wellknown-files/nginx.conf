server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    location /.well-known/security.txt {
        alias /usr/share/nginx/html/.well-known/security.txt;
        default_type text/plain;
    }

    location /.well-known/openid-configuration {
        alias /usr/share/nginx/html/.well-known/openid-configuration;
        default_type application/json;
    }

    location /.well-known/jwks.json {
        alias /usr/share/nginx/html/.well-known/jwks.json;
        default_type application/json;
    }

    location /.well-known/change-password {
        alias /usr/share/nginx/html/.well-known/change-password;
        default_type text/html;
    }

    location /.well-known/assetlinks.json {
        alias /usr/share/nginx/html/.well-known/assetlinks.json;
        default_type application/json;
    }

    location /.well-known/apple-app-site-association {
        alias /usr/share/nginx/html/.well-known/apple-app-site-association;
        default_type application/json;
    }

    location /.well-known/nodeinfo {
        alias /usr/share/nginx/html/.well-known/nodeinfo;
        default_type application/json;
    }

    location /.well-known/webfinger {
        alias /usr/share/nginx/html/.well-known/webfinger;
        default_type application/json;
    }

    location /.well-known/mta-sts.txt {
        alias /usr/share/nginx/html/.well-known/mta-sts.txt;
        default_type text/plain;
    }

    location /.well-known/matrix/server {
        alias /usr/share/nginx/html/.well-known/matrix-server;
        default_type application/json;
    }

    location /.well-known/host-meta {
        alias /usr/share/nginx/html/.well-known/host-meta;
        default_type application/xrd+xml;
    }

    location /robots.txt {
        alias /usr/share/nginx/html/robots.txt;
        default_type text/plain;
    }

    location / {
        default_type text/html;
        return 200 '<html><body><h1>Well-Known Files Test Server</h1></body></html>';
    }
}
