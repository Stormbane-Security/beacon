server {
    listen 80;

    # Protected admin path — GET returns 403, but POST/PUT/PATCH return 200
    # This simulates a verb tampering auth bypass vulnerability.
    location /admin {
        limit_except GET {
            # Allow all non-GET methods through
        }
        # GET returns 403
        if ($request_method = GET) {
            return 403 "Forbidden";
        }
        return 200 "Admin panel accessible via verb tampering";
    }

    location /api/admin {
        if ($request_method = GET) {
            return 403 "Forbidden";
        }
        return 200 "API admin panel accessible";
    }

    location / {
        return 200 "OK";
    }
}
