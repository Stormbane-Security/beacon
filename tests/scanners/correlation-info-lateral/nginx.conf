server {
    listen 80;
    server_name _;

    # Serve the exposed .env file (information disclosure)
    location = /.env {
        alias /usr/share/nginx/html/.env;
        default_type text/plain;
    }

    # Serve exposed config directory
    location /config/ {
        alias /usr/share/nginx/html/config/;
        default_type text/plain;
        autoindex on;
    }

    location / {
        default_type text/html;
        return 200 '<html><body><h1>App</h1></body></html>';
    }

    location /health {
        default_type text/plain;
        return 200 'ok';
    }
}
