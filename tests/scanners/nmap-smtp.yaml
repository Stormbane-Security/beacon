name: nmap-smtp-commands
description: >
  Postfix SMTP server with VRFY enabled — nmap smtp-commands NSE script
  should detect VRFY/EXPN user enumeration capability.
tags: [nmap, smtp, portscan, fingerprint]

services:
  smtp:
    image: boky/postfix
    ports: ["10025:25"]
    environment:
      ALLOWED_SENDER_DOMAINS: "example.com"
      DISABLE_SMTP_VRFY: ""

ready:
  cmd: "nc -z localhost 10025"
  timeout: 60s
  interval: 3s

assertions:
  - name: nmap-smtp-vrfy
    type: beacon
    target: localhost:10025
    args: ["--no-enrich", "--no-db", "--scanners", "portscan"]
    expect:
      check_id: nmap.smtp_commands

timeout: 5m
