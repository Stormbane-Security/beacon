name: nifi-data-pipeline-exposed
description: >
  Apache NiFi data pipeline with no authentication. Beacon should
  detect the exposed NiFi web UI and API.
tags: [nifi, data-pipeline, etl, detection]

services:
  nifi:
    image: apache/nifi:1.25.0
    ports: ["18443:8443"]
    environment:
      NIFI_WEB_HTTPS_PORT: ""
      NIFI_WEB_HTTP_PORT: "8443"
      SINGLE_USER_CREDENTIALS_USERNAME: ""
      SINGLE_USER_CREDENTIALS_PASSWORD: ""

ready:
  cmd: "curl -sf http://localhost:18443/nifi-api/system-diagnostics -o /dev/null -w '%{http_code}' | grep -qE '200|401'"
  timeout: 180s
  interval: 10s

assertions:
  - name: nifi-accessible
    type: command
    expect:
      command: "curl -s -o /dev/null -w '%{http_code}' http://localhost:18443/nifi-api/system-diagnostics | grep -qE '200|401'"
      exit_code: 0

  - name: detects-nifi-exposed
    type: beacon
    target: localhost:18443
    args: ["--no-enrich", "--scanners", "portscan", "--ports", "18443"]
    expect:
      check_id: port.nifi_exposed

timeout: 8m
