name: ssti-jinja2
description: "Python app with Jinja2 template injection via search parameter triggers web.ssti"
tags: [ssti, scanner, web]

services:
  ssti-app:
    build:
      context: ./ssti
      dockerfile: Dockerfile
    ports: ["8080:8080"]

ready:
  cmd: "curl -sf http://localhost:8080/health >/dev/null"
  timeout: 30s
  interval: 2s

assertions:
  - name: detects-ssti
    type: beacon
    target: ssti-app
    args: ["--no-enrich", "--scanners", "ssti", "--deep", "--permission-confirmed", "--authorized", "--ports", "8080"]
    expect:
      check_id: web.ssti

timeout: 5m
