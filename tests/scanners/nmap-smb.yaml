name: nmap-smb-scripts
description: >
  Samba server with guest access — nmap smb-os-discovery should fingerprint
  the OS/domain and smb-security-mode should flag message signing disabled.
tags: [nmap, smb, portscan, fingerprint]

services:
  smb:
    image: dperson/samba
    ports:
      - "10445:445"
    command: ["-s", "public;/share;yes;no;yes;all;none;;public share", "-p"]

ready:
  cmd: "nc -z localhost 10445"
  timeout: 60s
  interval: 3s

assertions:
  - name: nmap-smb-os-discovery
    type: beacon
    target: localhost
    args: ["--no-enrich", "--no-db", "--scanners", "portscan", "--ports", "10445"]
    expect:
      check_id: nmap.smb_os_discovery

  - name: nmap-smb-signing-off
    type: beacon
    target: localhost
    args: ["--no-enrich", "--no-db", "--scanners", "portscan", "--ports", "10445"]
    expect:
      check_id: nmap.smb_signing_disabled

timeout: 5m
