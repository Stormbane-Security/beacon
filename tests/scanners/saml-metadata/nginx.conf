server {
    listen 80;
    server_name _;

    # SAML metadata endpoint — exposed without authentication
    location = /saml/metadata {
        alias /usr/share/nginx/html/metadata.xml;
        default_type application/xml;
    }

    # Also serve at common alternative paths
    location = /saml/SSO/metadata {
        alias /usr/share/nginx/html/metadata.xml;
        default_type application/xml;
    }

    location = /auth/realms/master/protocol/saml/descriptor {
        alias /usr/share/nginx/html/metadata.xml;
        default_type application/xml;
    }

    location = /FederationMetadata/2007-06/FederationMetadata.xml {
        alias /usr/share/nginx/html/metadata.xml;
        default_type application/xml;
    }

    location / {
        default_type text/html;
        return 200 '<html><body><h1>SAML IdP</h1></body></html>';
    }
}
