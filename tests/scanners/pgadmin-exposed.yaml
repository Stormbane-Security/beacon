name: pgadmin-exposed
description: >
  pgAdmin4 with default admin credentials exposed on port 20059.
  Beacon should detect the exposed pgAdmin login page via service
  fingerprinting and identify it as a database admin interface.
tags: [pgadmin, scanner, portscan, exposed, database-admin]

services:
  pgadmin:
    image: dpage/pgadmin4:8.3
    ports: ["20059:80"]
    environment:
      PGADMIN_DEFAULT_EMAIL: "admin@admin.com"
      PGADMIN_DEFAULT_PASSWORD: "admin"

ready:
  cmd: "curl -sf -o /dev/null -w '%{http_code}' http://localhost:20059/login | grep -q 200"
  timeout: 120s
  interval: 5s

assertions:
  # Pre-flight: pgAdmin login page accessible
  - name: pgadmin-login-accessible
    type: command
    expect:
      command: "curl -sf http://localhost:20059/login | grep -qi pgadmin"
      exit_code: 0

  # Pre-flight: pgAdmin returns security headers (proving it's a real app)
  - name: pgadmin-csp-header-present
    type: command
    expect:
      command: "curl -sI http://localhost:20059/login | grep -qi 'Content-Security-Policy'"
      exit_code: 0

  # Scanner: detect pgAdmin service
  - name: detects-pgadmin-service
    type: beacon
    target: localhost:20059
    args: ["--no-enrich", "--no-nmap", "--scanners", "portscan", "--yes"]
    expect:
      check_id: port.service_identified

  # Negative: not flagged as redis
  - name: negative-not-redis
    type: beacon
    target: localhost:20059
    args: ["--no-enrich", "--no-nmap", "--scanners", "portscan", "--yes"]
    expect:
      not_check_id: port.redis_unauthenticated

  # Negative: not flagged as elasticsearch
  - name: negative-not-elasticsearch
    type: beacon
    target: localhost:20059
    args: ["--no-enrich", "--no-nmap", "--scanners", "portscan", "--yes"]
    expect:
      not_check_id: port.elasticsearch_unauthenticated

timeout: 5m
