server {
    listen 80;

    # Mock AWS IMDS metadata endpoint
    location /latest/meta-data/ {
        default_type text/plain;
        return 200 "ami-id\nami-launch-index\nami-manifest-path\nhostname\ninstance-id\ninstance-type\nlocal-hostname\nlocal-ipv4\nmac\nnetwork\nplacement\nprofile\npublic-hostname\npublic-ipv4\npublic-keys\nreservation-id\nsecurity-groups\nservices";
    }

    location / {
        return 404;
    }
}
