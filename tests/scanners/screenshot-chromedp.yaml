name: screenshot-chromedp
description: >
  Tests that the chromedp screenshot scanner captures a PNG screenshot
  and embeds it in the finding evidence as base64. Uses a simple nginx
  page as the target.
tags: [screenshot, chromedp, integration]

services:
  nginx:
    image: nginx:alpine
    ports: ["19970:80"]

ready:
  cmd: "curl -sf http://localhost:19970/ >/dev/null"
  timeout: 30s
  interval: 2s

assertions:
  # Beacon captures a screenshot
  - name: captures-screenshot
    type: beacon
    target: localhost:19970
    args: ["--no-enrich", "--no-nmap", "--scanners", "screenshot"]
    expect:
      check_id: asset.screenshot

timeout: 3m
