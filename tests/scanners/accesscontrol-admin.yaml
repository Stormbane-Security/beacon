name: accesscontrol-admin-exposed
description: >
  Nginx serving admin panel at /admin without authentication and /console
  with method-based bypass (403 on GET, 200 on POST). Beacon accesscontrol
  scanner should detect vertical privilege escalation and method bypass.
tags: [accesscontrol, scanner, web, authz]

services:
  app:
    image: nginx:alpine
    ports: ["9281:80"]
    volumes:
      - ./accesscontrol-admin/nginx.conf:/etc/nginx/conf.d/default.conf:ro

ready:
  cmd: "curl -sf http://localhost:9281/ >/dev/null"
  timeout: 30s
  interval: 2s

assertions:
  - name: exploit-admin-accessible-no-auth
    type: command
    expect:
      command: "curl -sf http://localhost:9281/admin | grep -q 'Administration Panel'"
      exit_code: 0

  - name: exploit-console-get-blocked
    type: command
    expect:
      command: "curl -s -o /dev/null -w '%{http_code}' http://localhost:9281/console | grep -q '403'"
      exit_code: 0

  - name: exploit-console-post-allowed
    type: command
    expect:
      command: "curl -s -X POST http://localhost:9281/console | grep -q 'Debug Console'"
      exit_code: 0

  - name: detects-vertical-escalation
    type: beacon
    target: localhost:9281
    args: ["--no-enrich", "--scanners", "accesscontrol", "--deep", "--permission-confirmed"]
    expect:
      check_id: api.vertical_escalation

  - name: detects-method-bypass
    type: beacon
    target: localhost:9281
    args: ["--no-enrich", "--scanners", "accesscontrol", "--deep", "--permission-confirmed"]
    expect:
      check_id: api.method_bypass

timeout: 5m
