server {
    listen 80;
    server_name _;

    # Simulate a login page without brute-force protection.
    # autoprobe scanner checks for CAPTCHA, autocomplete="off", and
    # rate limiting on auth endpoints.

    location = /login {
        default_type text/html;
        if ($request_method = POST) {
            return 200 '{"error":"Invalid credentials"}';
        }
        return 200 '<html><head><title>Login</title></head><body>
<h1>Sign In</h1>
<form method="POST" action="/login">
  <input type="text" name="username" placeholder="Username" autocomplete="on">
  <input type="password" name="password" placeholder="Password" autocomplete="on">
  <button type="submit">Login</button>
</form>
<p><a href="/forgot-password">Forgot password?</a></p>
</body></html>';
    }

    location = /api/login {
        default_type application/json;
        return 200 '{"error":"Invalid username or password","status":401}';
    }

    location / {
        default_type text/html;
        return 200 '<html><body><h1>App</h1><a href="/login">Login</a></body></html>';
    }
}
