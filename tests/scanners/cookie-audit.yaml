name: cookie-audit
description: "Web server sets insecure session cookies — beacon detects missing Secure, HttpOnly, SameSite"
tags: [cookie, scanner, web]

services:
  app:
    image: mccutchen/go-httpbin:latest
    ports: ["9240:8080"]
    environment:
      PORT: "8080"

ready:
  cmd: "curl -sf http://localhost:9240/ >/dev/null"
  timeout: 30s
  interval: 2s

assertions:
  - name: exploit-cookies-present
    type: command
    expect:
      command: "curl -sI http://localhost:9240/cookies/set/session/abc123 | grep -qi 'Set-Cookie'"
      exit_code: 0

  - name: detects-cookie-issues
    type: beacon
    target: localhost:9240
    args: ["--no-enrich", "--scanners", "cookie"]
    expect:
      check_id: cookie.missing_secure

timeout: 3m
