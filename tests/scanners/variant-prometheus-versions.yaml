name: variant-prometheus-versions
description: >
  Prometheus version variant test: 2.45 vs 2.50. Verifies that beacon
  detects unauthenticated Prometheus API access across both versions,
  catching regressions where UI or API response changes break detection.
tags: [variant, prometheus, monitoring, integration]

services:
  prom245:
    image: prom/prometheus:v2.45.0
    ports: ["20554:9090"]

  prom250:
    image: prom/prometheus:v2.50.0
    ports: ["20555:9090"]

ready:
  cmd: "curl -sf http://localhost:20554/-/healthy >/dev/null && curl -sf http://localhost:20555/-/healthy >/dev/null"
  timeout: 90s
  interval: 5s

assertions:
  # ══════════════════════════════════════════════════════════════════════
  # PROMETHEUS 2.45 — unauthenticated API
  # ══════════════════════════════════════════════════════════════════════

  - name: prom245-unauthenticated-detected
    type: beacon
    target: localhost:20554
    args: ["--no-enrich", "--no-nmap", "--ports", "20554"]
    expect:
      check_id: port.prometheus_unauthenticated

  - name: prom245-service-identified
    type: beacon
    target: localhost:20554
    args: ["--no-enrich", "--no-nmap", "--ports", "20554"]
    expect:
      check_id: port.service_identified

  - name: exploit-prom245-deep-scan
    type: beacon
    target: localhost:20554
    args: ["--no-enrich", "--no-nmap", "--ports", "20554", "--deep", "--yes"]
    expect:
      min_findings: 0

  # ══════════════════════════════════════════════════════════════════════
  # PROMETHEUS 2.50 — unauthenticated API
  # ══════════════════════════════════════════════════════════════════════

  - name: prom250-unauthenticated-detected
    type: beacon
    target: localhost:20555
    args: ["--no-enrich", "--no-nmap", "--ports", "20555"]
    expect:
      check_id: port.prometheus_unauthenticated

  - name: prom250-service-identified
    type: beacon
    target: localhost:20555
    args: ["--no-enrich", "--no-nmap", "--ports", "20555"]
    expect:
      check_id: port.service_identified

  - name: exploit-prom250-deep-scan
    type: beacon
    target: localhost:20555
    args: ["--no-enrich", "--no-nmap", "--ports", "20555", "--deep", "--yes"]
    expect:
      min_findings: 0

  # ══════════════════════════════════════════════════════════════════════
  # NEGATIVE — no cross-contamination
  # ══════════════════════════════════════════════════════════════════════

  - name: negative-prom245-not-grafana
    type: beacon
    target: localhost:20554
    args: ["--no-enrich", "--no-nmap", "--ports", "20554"]
    expect:
      not_check_id: port.grafana_default_credentials

  - name: negative-prom250-not-grafana
    type: beacon
    target: localhost:20555
    args: ["--no-enrich", "--no-nmap", "--ports", "20555"]
    expect:
      not_check_id: port.grafana_default_credentials

timeout: 5m
