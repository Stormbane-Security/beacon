server {
    listen 80;
    server_name _;

    location = / {
        default_type text/html;
        return 200 '<html><body><h1>App</h1></body></html>';
    }

    # Exposed .env file (exposure.env_file_exposed)
    location = /.env {
        default_type text/plain;
        return 200 'DATABASE_URL=postgres://admin:secret@db:5432/prod
SECRET_KEY=supersecretkey123
AWS_ACCESS_KEY_ID=AKIAIOSFODNN7EXAMPLE
';
    }

    # Exposed .git/config (exposure.git_exposed)
    location = /.git/config {
        default_type text/plain;
        return 200 '[core]
	repositoryformatversion = 0
	filemode = true
	bare = false
[remote "origin"]
	url = git@github.com:company/internal-app.git
	fetch = +refs/heads/*:refs/remotes/origin/*
';
    }

    location = /.git/HEAD {
        default_type text/plain;
        return 200 'ref: refs/heads/main
';
    }

    # Backup file (exposure.backup_file)
    location = /config.php.bak {
        default_type text/plain;
        return 200 'db_host = "localhost"
db_pass = "p@ssw0rd"
';
    }

    # Sensitive file — wp-config.php (exposure.sensitive_file)
    location = /wp-config.php.save {
        default_type text/plain;
        return 200 'DB_PASSWORD = "rootpass"
';
    }

    # robots.txt with disallow leaks (exposure.robots_disallow_leak)
    location = /robots.txt {
        default_type text/plain;
        return 200 'User-agent: *
Disallow: /admin/
Disallow: /internal-api/
Disallow: /debug/
Disallow: /staging/
';
    }
}
