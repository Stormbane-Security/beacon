server {
    listen 80;
    location / {
        return 200 '{"apiVersion":"v1","kind":"ArgoCD","metadata":{"name":"argocd-server"}}';
        add_header Content-Type application/json;
    }
    location /api/v1/applications {
        return 200 '{"items":[{"metadata":{"name":"prod-app"},"status":{"health":{"status":"Healthy"}}}]}';
        add_header Content-Type application/json;
    }
}
