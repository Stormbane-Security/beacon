server {
    listen 443 ssl;
    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    server_tokens off;
    
    # Simulate BIG-IP TMUI
    location /tmui/login.jsp {
        return 200 '<html><head><title>BIG-IP</title></head><body><form>F5 BIG-IP Configuration Utility Login</form></body></html>';
        add_header Content-Type text/html;
        add_header Server "BigIP";
    }
    location /tmui/ {
        return 200 'BIG-IP TMUI';
        add_header Server "BigIP";
    }
    location / {
        return 302 /tmui/login.jsp;
        add_header Server "BigIP";
    }
}
