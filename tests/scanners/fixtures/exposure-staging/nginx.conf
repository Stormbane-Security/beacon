server {
    listen 80;
    server_name _;

    # Simulate a staging environment that leaks its identity
    add_header X-Environment "staging";

    location / {
        default_type text/html;
        return 200 '<!DOCTYPE html><html><head><title>Staging Environment</title></head><body><h1>STAGING - Internal Use Only</h1><p>This is the staging deployment. Do not share externally.</p><div class="staging-banner">staging.example.com</div></body></html>';
    }
}
