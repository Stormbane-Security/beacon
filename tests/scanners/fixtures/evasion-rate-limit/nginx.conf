limit_req_zone $binary_remote_addr zone=scanzone:10m rate=2r/s;

server {
    listen 80;
    server_name _;

    location / {
        limit_req zone=scanzone burst=3 nodelay;
        default_type text/html;
        return 200 '<html><body><h1>Rate Limited App</h1></body></html>';
    }

    location /health {
        return 200 'OK';
        add_header Content-Type text/plain;
    }
}
