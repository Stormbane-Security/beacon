server {
    listen 80;
    server_name localhost;

    location / {
        # Simulate NTLM authentication challenge.
        # Return 401 with WWW-Authenticate: NTLM + a base64 Type 2 challenge
        # containing leaked domain/server info.
        add_header WWW-Authenticate 'NTLM TlRMTVNTUAACAAAADAAMADgAAAAFgomiESIzRFVmd4gAAAAAAAAAAIIAggBEAAAABgGxHQAAAA9UAEUAUwBUAEMAQQBQAAIADABUAEUAUwBUAEMAQQBQAAEADABFAFgAQwBIAC0AMAAxAAQAHgB0AGUAcwB0AGMAYQBwAC4AbABvAGMAYQBsAAMALABlAHgAYwBoAC0AMAAxAC4AdABlAHMAdABjAGEAcAAuAGwAbwBjAGEAbAAAAAAAAAAAAA==' always;
        return 401 "Authentication required";
    }
}
