server {
    listen 80;
    server_name localhost;

    # Check for Bearer token in Authorization header.
    # If missing or wrong, return 401.
    set $auth_ok 0;
    if ($http_authorization = "Bearer test-api-token-2024") {
        set $auth_ok 1;
    }

    location / {
        if ($auth_ok = 0) {
            return 401 '{"error":"unauthorized","message":"Bearer token required"}';
        }
        root /usr/share/nginx/html;
        index index.html;

        # Add headers that indicate an API server.
        add_header X-API-Version "2.1.0" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # Swagger/OpenAPI spec — only accessible with valid token.
    location /swagger.json {
        if ($auth_ok = 0) {
            return 401 '{"error":"unauthorized"}';
        }
        root /usr/share/nginx/html;
        default_type application/json;
    }

    location /api/v1/ {
        if ($auth_ok = 0) {
            return 401 '{"error":"unauthorized"}';
        }
        root /usr/share/nginx/html;
        default_type application/json;
    }
}
