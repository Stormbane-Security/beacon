server {
    listen 80;
    server_tokens on;
    location / {
        root /usr/share/nginx/html;
    }
    location /admin {
        return 200 'admin panel - should be hidden behind proxy';
        add_header Content-Type text/plain;
    }
    location /internal-api {
        return 200 '{"status":"ok","secret":"internal-only"}';
        add_header Content-Type application/json;
    }
}
