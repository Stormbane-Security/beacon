global
    log stdout format raw local0

defaults
    mode http
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend http_front
    bind *:80
    # Block /admin and /internal-api at proxy level
    acl is_admin path_beg /admin
    acl is_internal path_beg /internal-api
    http-request deny if is_admin
    http-request deny if is_internal
    default_backend servers

backend servers
    server backend1 backend:80
