server {
    listen 443 ssl;
    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    
    # Simulate Exchange OWA
    location /owa/ {
        return 200 '<html><head><title>Outlook Web App</title></head><body>Microsoft Exchange Server - OWA</body></html>';
        add_header Content-Type text/html;
        add_header X-OWA-Version "15.1.2507.16";
    }
    location /autodiscover/autodiscover.json {
        return 200 '{"Protocol":"ActiveSync","Url":"https://mail.corp.local/Microsoft-Server-ActiveSync"}';
        add_header Content-Type application/json;
    }
    location /mapi/nspi/ {
        return 200 '';
    }
    location /ecp/ {
        return 302 /owa/;
    }
    location / {
        return 302 /owa/;
    }
}
