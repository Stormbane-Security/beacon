server {
    listen 80;
    server_name localhost;

    # Everything behind basic auth.
    auth_basic "Restricted";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # Deliberately expose server version header (should be caught by secheaders).
    server_tokens on;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        autoindex on;
    }
}
