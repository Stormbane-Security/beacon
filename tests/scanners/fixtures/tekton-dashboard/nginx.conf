server {
    listen 80;
    location / {
        return 200 '{"kind":"Dashboard","apiVersion":"dashboard.tekton.dev/v1"}';
        add_header Content-Type application/json;
    }
    location /api/v1/namespaces {
        return 200 '{"items":[{"metadata":{"name":"default"}},{"metadata":{"name":"tekton-pipelines"}}]}';
        add_header Content-Type application/json;
    }
    location /apis/tekton.dev/v1/pipelineruns {
        return 200 '{"items":[{"metadata":{"name":"build-deploy-run"}}]}';
        add_header Content-Type application/json;
    }
}
