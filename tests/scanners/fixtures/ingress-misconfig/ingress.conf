server {
    listen 80;
    
    location / {
        proxy_pass http://app:80/;
    }
    
    # Admin panel — should be restricted but misconfigured
    location /admin/ {
        return 403;
    }
    
    # Path normalization bypass: /app/../admin/ could bypass the block
    location ~ ^/app/ {
        proxy_pass http://app:80;
    }
}
