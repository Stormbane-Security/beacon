server {
    listen 80;
    server_name _;

    # AuthFuzz test: OAuth server that does NOT validate redirect_uri,
    # accepts alg:none JWTs on protected endpoints, and allows code reuse.

    # OIDC discovery endpoint
    location = /.well-known/openid-configuration {
        default_type application/json;
        return 200 '{"issuer":"http://localhost","authorization_endpoint":"http://localhost/oauth/authorize","token_endpoint":"http://localhost/oauth/token","userinfo_endpoint":"http://localhost/api/me"}';
    }

    # OAuth authorize: blindly redirects to whatever redirect_uri is provided
    # (no validation — the vulnerability we're testing for)
    location = /oauth/authorize {
        default_type text/html;

        # Extract redirect_uri from query args and redirect to it
        # nginx can't dynamically extract query params easily, so we use
        # a simple approach: always redirect including the redirect_uri arg
        if ($arg_redirect_uri) {
            return 302 $arg_redirect_uri?code=test_auth_code&state=$arg_state;
        }

        return 400 '{"error":"missing redirect_uri"}';
    }

    # Token endpoint: accepts any code exchange, even repeated
    location = /oauth/token {
        default_type application/json;

        if ($request_method != POST) {
            return 405 '{"error":"method not allowed"}';
        }

        return 200 '{"access_token":"eyJhbGciOiJub25lIn0.eyJzdWIiOiIxIn0.","token_type":"bearer","expires_in":3600}';
    }

    # Protected endpoint: returns 401 without auth, 200 with any Bearer token
    location = /api/me {
        default_type application/json;

        set $auth_ok 0;
        if ($http_authorization ~ "Bearer ") {
            set $auth_ok 1;
        }

        if ($auth_ok = 0) {
            return 401 '{"error":"unauthorized","message":"Bearer token required"}';
        }

        return 200 '{"user":{"id":1,"name":"admin","email":"admin@example.com","role":"administrator"}}';
    }

    location = / {
        default_type text/html;
        return 200 '<html><body><h1>OAuth Provider</h1></body></html>';
    }

    location / {
        return 404;
    }
}
