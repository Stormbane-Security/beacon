name: tekton-dashboard-exposed
description: >
  Tekton Dashboard with no authentication. Beacon should detect the
  exposed CI/CD pipeline dashboard.
tags: [tekton, cicd, dashboard, kubernetes, detection]

services:
  # Simulate Tekton dashboard with nginx serving the expected API responses
  tekton:
    image: nginx:alpine
    ports: ["9097:80"]
    volumes:
      - ./fixtures/tekton-dashboard/nginx.conf:/etc/nginx/conf.d/default.conf:ro

ready:
  cmd: "curl -sf http://localhost:9097/ >/dev/null"
  timeout: 30s
  interval: 2s

assertions:
  - name: tekton-dashboard-accessible
    type: command
    expect:
      command: "curl -sf http://localhost:9097/api/v1/namespaces | grep -q items"
      exit_code: 0

  - name: detects-tekton-exposed
    type: beacon
    target: localhost:9097
    args: ["--no-enrich", "--no-nmap", "--scanners", "portscan", "--ports", "9097"]
    expect:
      check_id: port.tekton_dashboard_exposed

timeout: 3m
