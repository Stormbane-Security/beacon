name: vnc-exposed
description: >
  VNC server with no password. Beacon should detect the exposed VNC
  service via RFB protocol banner detection.
tags: [vnc, remote-access, portscan, detection]

services:
  vnc:
    image: theasp/novnc:latest
    ports: ["5900:5900"]
    environment:
      VNC_PASSWORD: ""

ready:
  cmd: "echo '' | nc -w2 localhost 5900 2>/dev/null | grep -qi RFB || curl -sf http://localhost:5900 -o /dev/null -w '%{http_code}' | grep -qE '200|400'"
  timeout: 60s
  interval: 3s

assertions:
  - name: detects-vnc-exposed
    type: beacon
    target: localhost:5900
    args: ["--no-enrich", "--no-nmap", "--scanners", "portscan", "--ports", "5900"]
    expect:
      check_id: port.vnc_exposed

timeout: 3m
