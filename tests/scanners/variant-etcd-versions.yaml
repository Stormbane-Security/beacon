name: variant-etcd-versions
description: >
  etcd version variant test: 3.4 vs 3.5. Verifies that beacon detects
  unauthenticated etcd access across both major versions, catching
  regressions where gRPC-gateway or v2/v3 API differences break detection.
tags: [variant, etcd, infrastructure, integration]

services:
  etcd34:
    image: quay.io/coreos/etcd:v3.4.30
    ports: ["20534:2379"]
    command: ["etcd", "--advertise-client-urls=http://0.0.0.0:2379", "--listen-client-urls=http://0.0.0.0:2379"]

  etcd35:
    image: quay.io/coreos/etcd:v3.5.17
    ports: ["20535:2379"]
    command: ["etcd", "--advertise-client-urls=http://0.0.0.0:2379", "--listen-client-urls=http://0.0.0.0:2379"]

ready:
  cmd: "curl -sf http://localhost:20534/version >/dev/null && curl -sf http://localhost:20535/version >/dev/null"
  timeout: 90s
  interval: 5s

assertions:
  # ══════════════════════════════════════════════════════════════════════
  # ETCD 3.4 — unauthenticated access
  # ══════════════════════════════════════════════════════════════════════

  - name: etcd34-unauthenticated-detected
    type: beacon
    target: localhost:20534
    args: ["--no-enrich", "--no-nmap", "--ports", "20534"]
    expect:
      check_id: port.etcd_exposed

  - name: etcd34-service-identified
    type: beacon
    target: localhost:20534
    args: ["--no-enrich", "--no-nmap", "--ports", "20534"]
    expect:
      check_id: port.service_identified

  - name: exploit-etcd34-deep-scan
    type: beacon
    target: localhost:20534
    args: ["--no-enrich", "--no-nmap", "--ports", "20534", "--deep", "--yes"]
    expect:
      min_findings: 0

  # ══════════════════════════════════════════════════════════════════════
  # ETCD 3.5 — unauthenticated access
  # ══════════════════════════════════════════════════════════════════════

  - name: etcd35-unauthenticated-detected
    type: beacon
    target: localhost:20535
    args: ["--no-enrich", "--no-nmap", "--ports", "20535"]
    expect:
      check_id: port.etcd_exposed

  - name: etcd35-service-identified
    type: beacon
    target: localhost:20535
    args: ["--no-enrich", "--no-nmap", "--ports", "20535"]
    expect:
      check_id: port.service_identified

  - name: exploit-etcd35-deep-scan
    type: beacon
    target: localhost:20535
    args: ["--no-enrich", "--no-nmap", "--ports", "20535", "--deep", "--yes"]
    expect:
      min_findings: 0

  # ══════════════════════════════════════════════════════════════════════
  # NEGATIVE — no cross-contamination
  # ══════════════════════════════════════════════════════════════════════

  - name: negative-etcd34-not-vault
    type: beacon
    target: localhost:20534
    args: ["--no-enrich", "--no-nmap", "--ports", "20534"]
    expect:
      not_check_id: port.vault_exposed

  - name: negative-etcd35-not-consul
    type: beacon
    target: localhost:20535
    args: ["--no-enrich", "--no-nmap", "--ports", "20535"]
    expect:
      not_check_id: port.consul_no_acl

timeout: 5m
