name: jboss-exposed
description: >
  WildFly (JBoss successor) application server with management console
  exposed. Beacon portscan jboss probe should detect the management
  interface and report the exposed admin console.
tags: [jboss, wildfly, scanner, port, infrastructure]

services:
  wildfly:
    image: quay.io/wildfly/wildfly:latest
    ports: ["20113:8080", "20114:9990"]
    command: ["/opt/jboss/wildfly/bin/standalone.sh", "-b", "0.0.0.0", "-bmanagement", "0.0.0.0"]

ready:
  cmd: "curl -sf http://localhost:20113/ >/dev/null"
  timeout: 90s
  interval: 5s

assertions:
  # Pre-flight: WildFly welcome page accessible
  - name: wildfly-welcome-page
    type: command
    expect:
      command: "curl -s http://localhost:20113/ | grep -qi 'WildFly'"
      exit_code: 0

  # Scanner: beacon detects findings on management port
  - name: detects-jboss-management-exposed
    type: beacon
    target: localhost:20114
    args: ["--no-enrich", "--no-nmap", "--scanners", "portscan"]
    expect:
      min_findings: 1

  - name: deep-mode-jboss
    type: beacon
    target: localhost:20114
    args: ["--no-enrich", "--no-nmap", "--scanners", "portscan", "--deep", "--yes", "--ports", "20113,20114"]
    expect:
      min_findings: 0

  - name: exploit-mode-jboss
    type: beacon
    target: localhost:20114
    args: ["--no-enrich", "--no-nmap", "--scanners", "portscan", "--exploit", "--yes", "--ports", "20113,20114"]
    expect:
      min_findings: 0

timeout: 8m
