name: auth-pipeline-juiceshop
description: >
  End-to-end authenticated scanning test using OWASP Juice Shop.
  Tests the full pipeline: authsurface detects login form, auto-register
  creates an account, then scanners run with the authenticated session.
tags: [auth, pipeline, juiceshop, e2e, integration]

services:
  juiceshop:
    image: bkimminich/juice-shop:latest
    ports: ["19890:3000"]
    environment:
      NODE_ENV: unsafe

ready:
  cmd: "curl -sf http://localhost:19890/ | grep -q 'OWASP Juice Shop'"
  timeout: 120s
  interval: 5s

assertions:
  # ══════════════════════════════════════════════════════════════════════
  # STEP 1: Auth surface detection — find login form
  # ══════════════════════════════════════════════════════════════════════

  - name: detects-login-form
    type: beacon
    target: localhost:19890
    args: ["--no-enrich", "--no-nmap", "--scanners", "authsurface"]
    expect:
      check_id: auth.login_form_detected

  # ══════════════════════════════════════════════════════════════════════
  # STEP 2: Registration available
  # ══════════════════════════════════════════════════════════════════════

  - name: detects-registration-open
    type: beacon
    target: localhost:19890
    args: ["--no-enrich", "--no-nmap", "--scanners", "authsurface"]
    expect:
      check_id: auth.registration_open

  # ══════════════════════════════════════════════════════════════════════
  # STEP 3: Security headers on the app
  # ══════════════════════════════════════════════════════════════════════

  - name: detects-missing-hsts
    type: beacon
    target: localhost:19890
    args: ["--no-enrich", "--no-nmap", "--scanners", "secheaders"]
    expect:
      check_id: headers.missing_hsts

  # ══════════════════════════════════════════════════════════════════════
  # STEP 4: Exposed files
  # ══════════════════════════════════════════════════════════════════════

  - name: detects-exposed-files
    type: beacon
    target: localhost:19890
    args: ["--no-enrich", "--no-nmap", "--scanners", "exposedfiles"]
    expect:
      min_findings: 1

  # ══════════════════════════════════════════════════════════════════════
  # NEGATIVE — no false positives
  # ══════════════════════════════════════════════════════════════════════

  - name: negative-no-database-on-http
    type: beacon
    target: localhost:19890
    args: ["--no-enrich", "--no-nmap", "--scanners", "portscan"]
    expect:
      not_check_id: port.redis_unauthenticated

timeout: 5m
