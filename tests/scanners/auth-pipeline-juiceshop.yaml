name: auth-pipeline-juiceshop
description: >
  Scanning OWASP Juice Shop (Angular SPA). Tests header detection and
  negative assertions. NOTE: authsurface can't detect JS-rendered login
  forms — this is a known SPA limitation documented as a TODO.
tags: [auth, juiceshop, spa, integration]

services:
  juiceshop:
    image: bkimminich/juice-shop:latest
    ports: ["19890:3000"]
    environment:
      NODE_ENV: unsafe

ready:
  cmd: "curl -sf http://localhost:19890/ | grep -q 'OWASP Juice Shop'"
  timeout: 120s
  interval: 5s

assertions:
  # Beacon detects missing security headers
  - name: detects-missing-hsts
    type: beacon
    target: localhost:19890
    args: ["--no-enrich", "--no-nmap", "--scanners", "secheaders"]
    expect:
      check_id: headers.missing_hsts

  - name: detects-missing-csp
    type: beacon
    target: localhost:19890
    args: ["--no-enrich", "--no-nmap", "--scanners", "secheaders"]
    expect:
      check_id: headers.missing_csp

  # Negative: no database on HTTP port
  - name: negative-no-redis
    type: beacon
    target: localhost:19890
    args: ["--no-enrich", "--no-nmap", "--scanners", "portscan"]
    expect:
      not_check_id: port.redis_unauthenticated

  # TODO: authsurface needs headless browser (chromedp) to detect
  # JS-rendered login forms in SPAs like Juice Shop. Currently only
  # parses server-rendered HTML.

timeout: 5m
