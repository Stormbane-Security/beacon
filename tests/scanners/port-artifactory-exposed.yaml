name: port-artifactory-exposed
description: >
  JFrog Artifactory OSS repository manager. Beacon portscan should
  detect the exposed Artifactory service on port 8081.
tags: [portscan, artifactory, jfrog, repository, detection]

services:
  artifactory:
    image: releases-docker.jfrog.io/jfrog/artifactory-oss:7.71.5
    ports: ["8081:8081"]

ready:
  cmd: "curl -sf http://localhost:8081/artifactory/api/system/ping | grep -q OK"
  timeout: 180s
  interval: 10s

assertions:
  - name: artifactory-ping-ok
    type: command
    expect:
      command: "curl -sf http://localhost:8081/artifactory/api/system/ping | grep -q OK"
      exit_code: 0

  - name: detects-artifactory-exposed
    type: beacon
    target: localhost:8081
    args: ["--no-enrich", "--scanners", "portscan", "--ports", "8081"]
    expect:
      check_id: port.artifactory_exposed

timeout: 8m
