name: csrf-missing-token
description: "Go server with POST login/register forms missing CSRF tokens and SameSite cookies — beacon detects web.csrf_token_missing"
tags: [csrf, scanner, web]

services:
  csrf-app:
    build:
      context: ./csrf
      dockerfile: Dockerfile
    ports: ["9212:8080"]

ready:
  cmd: "curl -sf http://localhost:9212/health >/dev/null"
  timeout: 30s
  interval: 2s

assertions:
  - name: exploit-csrf-form-no-token
    type: command
    expect:
      command: "curl -sf http://localhost:9212/ | grep -q '<form' && ! curl -sf http://localhost:9212/ | grep -qi 'csrf'"
      exit_code: 0

  - name: exploit-csrf-post-accepted
    type: command
    expect:
      command: "curl -sf -X POST http://localhost:9212/login -d 'user=admin&pass=admin' -o /dev/null -w '%{http_code}' | grep -qE '(200|302)'"
      exit_code: 0

  - name: detects-csrf-missing-token
    type: beacon
    target: csrf-app:8080
    args: ["--no-enrich", "--scanners", "csrf", "--deep", "--permission-confirmed", "--ports", "8080"]
    expect:
      check_id: web.csrf_token_missing

timeout: 5m
