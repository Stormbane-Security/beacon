server {
    listen 80;
    server_name _;

    # Simulate an F5 BIG-IP load balancer setting persistence cookies.
    # Cookie encodes internal backend 10.1.2.3:8080 using the real BIG-IP encoding:
    #   IP  10.1.2.3  → little-endian 32-bit = 50462986
    #   Port 8080     → byte-swapped 16-bit  = 36895
    # Cookie: BIGipServerapp_pool=50462986.36895.0000

    location / {
        add_header Set-Cookie "BIGipServerapp_pool=50462986.36895.0000; path=/";
        default_type text/html;
        return 200 '<html><body><h1>Application</h1><p>Load balanced by F5 BIG-IP</p></body></html>';
    }
}
