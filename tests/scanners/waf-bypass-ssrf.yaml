name: waf-bypass-ssrf
description: >
  Web application behind ModSecurity WAF with SSRF via URL parameter.
  Standard metadata IP 169.254.169.254 is blocked by the WAF. Beacon
  should use IP notation evasion (decimal, hex, octal, IPv6-mapped)
  to bypass the WAF filter and detect the SSRF.

services:
  webapp:
    image: mccutchen/go-httpbin:latest
    environment:
      PORT: "8080"
    expose: ["8080"]

  waf:
    image: owasp/modsecurity-crs:nginx-alpine
    ports: ["80:80"]
    environment:
      BACKEND: "http://webapp:8080"
      PARANOIA: "2"
    depends_on: [webapp]

assertions:
  # WAF blocks standard metadata IP
  - name: waf-blocks-metadata-ip
    type: command
    expect:
      command: "curl -s -o /dev/null -w '%{http_code}' 'http://localhost/?url=http://169.254.169.254/latest/meta-data/'"
      stdout_contains: "403"

  # Beacon with evasion should detect SSRF
  - name: beacon-ssrf-scan
    type: beacon
    target: localhost
    args: ["--exploit", "--deep", "--yes", "--yes", "--scanners", "ssrf", "--format", "json", "/tmp/results.json"]
    expect:
      min_findings: 1
