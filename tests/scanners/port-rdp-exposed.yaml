name: port-rdp-exposed
description: >
  xrdp server exposing RDP on port 3389. Beacon should detect the
  exposed RDP service.
tags: [portscan, rdp, remote-desktop, detection]

services:
  xrdp:
    image: scottyhardy/docker-remote-desktop:latest
    ports: ["3389:3389"]

ready:
  cmd: "nc -z localhost 3389"
  timeout: 90s
  interval: 3s

assertions:
  - name: rdp-port-open
    type: command
    expect:
      command: "nc -z -w 2 localhost 3389"
      exit_code: 0

  - name: detects-rdp-exposed
    type: beacon
    target: localhost:3389
    args: ["--no-enrich", "--scanners", "portscan", "--ports", "3389"]
    expect:
      check_id: port.rdp_exposed

timeout: 5m
