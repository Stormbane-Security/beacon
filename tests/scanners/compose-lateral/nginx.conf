server {
    listen 80;

    # Intentionally vulnerable: passes User-Agent header to shell command
    # via a CGI-like proxy to the shellshock container.
    # In the real world this simulates any app with command injection.
    location / {
        proxy_pass http://webapp:80;
        proxy_set_header Host $host;
        proxy_set_header User-Agent $http_user_agent;
    }
}
