server {
    listen 80;
    server_name _;

    # Simulates an SSRF-vulnerable proxy: proxies any URL passed in the
    # X-Fetch-URL header or ?url= query parameter. This lets the beacon
    # SSRF scanner confirm arbitrary internal URL fetching.

    location /fetch {
        # SSRF: proxy the url query parameter to an upstream
        set $target $arg_url;
        if ($target = "") {
            return 400 '{"error":"url parameter required"}';
        }
        proxy_pass $target;
        proxy_set_header Host $proxy_host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
    }

    location /api/v1/fetch {
        set $target $arg_url;
        if ($target = "") {
            return 400 '{"error":"url parameter required"}';
        }
        proxy_pass $target;
        proxy_set_header Host $proxy_host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
    }

    # Cloud metadata endpoint simulation (responds like AWS IMDS)
    location /latest/meta-data/ {
        default_type text/plain;
        return 200 'ami-id\nami-launch-index\nami-manifest-path\nhostname\ninstance-id\ninstance-type\nlocal-hostname\nlocal-ipv4\nmac\nnetwork\nplacement\nprofile\npublic-hostname\npublic-ipv4\nreservation-id\nsecurity-groups\niam';
    }

    location /latest/meta-data/iam/security-credentials/ {
        default_type text/plain;
        return 200 'test-ssrf-role';
    }

    location /latest/meta-data/iam/security-credentials/test-ssrf-role {
        default_type application/json;
        return 200 '{"Code":"Success","AccessKeyId":"AKIAIOSFODNN7EXAMPLE","SecretAccessKey":"wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY","Token":"FwoGZXIvYXdz...","Expiration":"2099-01-01T00:00:00Z"}';
    }

    location / {
        default_type text/html;
        return 200 '<html><body><h1>URL Fetcher</h1><form action="/fetch"><input name="url" placeholder="URL"><button>Fetch</button></form></body></html>';
    }

    location /health {
        default_type text/plain;
        return 200 'ok';
    }
}
