name: jwt-jti-short-lived-no-finding
description: >
  Python HTTP server issuing short-lived JWTs (30 min expiry) without jti.
  Beacon should NOT flag missing jti on short-lived tokens — they are
  replay-resistant by design via their short lifetime. Only long-lived
  tokens (>1 hour) without jti should be flagged.
tags: [jwt, scanner, auth, false-positive, negative]

services:
  jwt-app:
    image: python:3.11-alpine
    ports: ["9372:8080"]
    command:
      - sh
      - -c
      - |
        python3 -c "
        import json, base64, time
        from http.server import HTTPServer, BaseHTTPRequestHandler

        def b64url(data):
            return base64.urlsafe_b64encode(data).rstrip(b'=').decode()

        def make_jwt(claims):
            header = b64url(json.dumps({'alg': 'HS256', 'typ': 'JWT'}).encode())
            payload = b64url(json.dumps(claims).encode())
            return header + '.' + payload + '.stub_sig'

        class Handler(BaseHTTPRequestHandler):
            def do_GET(self):
                now = int(time.time())
                if self.path == '/':
                    # Short-lived token: 30 minutes, no jti
                    token = make_jwt({
                        'sub': 'user1',
                        'iat': now,
                        'exp': now + 1800,
                    })
                    self.send_response(200)
                    self.send_header('Content-Type', 'text/html')
                    self.send_header('Set-Cookie', 'session=' + token + '; Path=/')
                    self.end_headers()
                    self.wfile.write(b'<html><body>Welcome</body></html>')
                    return
                self.send_response(404)
                self.end_headers()
                self.wfile.write(b'not found')
            def log_message(self, fmt, *args):
                pass

        HTTPServer(('0.0.0.0', 8080), Handler).serve_forever()
        "

ready:
  cmd: "curl -sf http://localhost:9372/ >/dev/null"
  timeout: 60s
  interval: 3s

assertions:
  # --- Scanner must NOT flag jti-missing on short-lived tokens ---
  - name: no-jti-missing-finding
    type: beacon
    target: localhost:9372
    args: ["--no-enrich", "--no-nmap", "--scanners", "jwt"]
    expect:
      no_check_id: jwt.replay_missing

timeout: 3m
