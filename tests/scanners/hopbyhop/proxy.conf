# Reverse proxy that forwards requests to the backend.
# nginx correctly handles hop-by-hop headers per RFC 7230:
# headers listed in the Connection header are stripped before forwarding.
# This is the vulnerability — an attacker can strip X-Forwarded-For
# by listing it in the Connection header.
server {
    listen 80;
    server_name _;

    location / {
        proxy_pass http://backend:80;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Host $host;
    }
}
