# Backend server that changes response based on X-Forwarded-For presence.
# When the proxy strips X-Forwarded-For via hop-by-hop Connection abuse,
# the backend returns a different response — the scanner detects this delta.
server {
    listen 80;
    server_name _;

    location / {
        default_type text/plain;

        # If X-Forwarded-For is present, return the "authenticated" response.
        if ($http_x_forwarded_for) {
            return 200 'backend: request from $http_x_forwarded_for — access granted to internal dashboard with full admin controls and metrics data';
        }

        # Without X-Forwarded-For, return a shorter "denied" response.
        return 403 'Forbidden: direct access not allowed';
    }
}
