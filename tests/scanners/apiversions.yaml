name: apiversions-httpbin
description: >
  go-httpbin exposes multiple paths — API version scanner probes for
  versioned API endpoints and auth/rate-limit bypass between versions.
tags: [apiversions, scanner, web]

services:
  httpbin:
    image: mccutchen/go-httpbin:latest
    ports: ["9263:8080"]
    environment:
      PORT: "8080"

ready:
  cmd: "curl -sf http://localhost:9263/get >/dev/null"
  timeout: 30s
  interval: 2s

assertions:
  - name: exploit-api-responds
    type: command
    expect:
      command: "curl -sf http://localhost:9263/get | grep -q 'Host'"
      exit_code: 0

  # API version scanner probes /api/v1, /api/v2, etc. and checks for
  # auth or rate-limit differences between versions.
  - name: apiversions-scan-completes
    type: beacon
    target: localhost:9263
    args: ["--no-enrich", "--scanners", "apiversions", "--deep", "--permission-confirmed"]
    expect:
      min_findings: 0

timeout: 5m
