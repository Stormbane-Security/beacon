server {
    listen 80;
    server_name _;

    # File upload test: accepts any multipart POST to /upload and echoes
    # back a JSON response with file_url containing the original filename.
    # No extension filtering — simulates unrestricted file upload.

    location = /upload {
        default_type application/json;

        if ($request_method = GET) {
            return 200 '{"endpoint":"/upload","methods":["POST"],"max_size":"10MB"}';
        }

        # Accept any POST and return success with file path
        # The filename from the multipart body won't be parsed by nginx,
        # but beacon's scanner checks for "file_url" key in JSON response.
        return 201 '{"status":"uploaded","file_url":"/uploads/beacon_test.php.jpg","size":42}';
    }

    location = /api/upload {
        default_type application/json;

        if ($request_method != POST) {
            return 405 '{"error":"method not allowed"}';
        }

        return 201 '{"status":"uploaded","fileUrl":"/files/beacon_test.php.jpg","mime":"image/jpeg"}';
    }

    location = / {
        default_type text/html;
        return 200 '<html><body><h1>App</h1>
<form method="POST" action="/upload" enctype="multipart/form-data">
  <input type="file" name="file">
  <button type="submit">Upload</button>
</form>
</body></html>';
    }

    location / {
        return 404;
    }
}
