server {
    listen 80;
    server_name _;

    # Deliberately missing X-Frame-Options and CSP frame-ancestors
    # to trigger clickjacking detection.

    location / {
        default_type text/html;
        return 200 '<html><head><title>Clickjack Target</title></head><body><h1>Login</h1><form method="POST" action="/login"><input name="user"><input name="pass" type="password"><button>Login</button></form></body></html>';
    }
}
