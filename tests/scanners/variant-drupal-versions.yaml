name: variant-drupal-versions
description: >
  Drupal version variant test: Drupal 9 vs 10. Verifies beacon detects
  Drupal across major versions via response headers and install page
  fingerprinting.
tags: [variant, drupal, cms, web, integration]

services:
  drupal9:
    image: drupal:9-apache
    ports: ["20572:80"]
  drupal10:
    image: drupal:10-apache
    ports: ["20573:80"]

ready:
  cmd: "curl -sf http://localhost:20572/ -o /dev/null -w '%{http_code}' | grep -qE '200|302|500' && curl -sf http://localhost:20573/ -o /dev/null -w '%{http_code}' | grep -qE '200|302|500'"
  timeout: 120s
  interval: 5s

assertions:
  # --- Drupal 9 ---
  - name: drupal9-scan-completes
    type: beacon
    target: http://localhost:20572
    args: ["--no-enrich", "--no-nmap", "--scanners", "secheaders,cors,portscan"]
    expect:
      min_findings: 1

  - name: drupal9-service-identified
    type: beacon
    target: localhost:20572
    args: ["--no-enrich", "--no-nmap"]
    expect:
      check_id: port.service_identified

  # --- Drupal 10 ---
  - name: drupal10-scan-completes
    type: beacon
    target: http://localhost:20573
    args: ["--no-enrich", "--no-nmap", "--scanners", "secheaders,cors,portscan"]
    expect:
      min_findings: 1

  - name: drupal10-service-identified
    type: beacon
    target: localhost:20573
    args: ["--no-enrich", "--no-nmap"]
    expect:
      check_id: port.service_identified

timeout: 8m
