server {
    listen 80;
    server_name _;

    # Deliberately old nginx version in Server header (outdated software)
    add_header Server "nginx/1.14.0" always;
    add_header X-Powered-By "PHP/5.6.40" always;

    location / {
        default_type text/html;
        return 200 '<html><head><title>Legacy App</title></head><body><h1>Application</h1><meta name="generator" content="WordPress 4.0" /><script src="/wp-includes/js/jquery/jquery.js?ver=1.12.4"></script></body></html>';
    }

    location /health {
        return 200 'ok';
    }
}
