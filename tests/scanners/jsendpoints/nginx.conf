server {
    listen 80;

    location / {
        default_type text/html;
        return 200 '<html><head><script src="/app.js"></script></head><body><h1>App</h1></body></html>';
    }

    location /app.js {
        default_type application/javascript;
        return 200 '
            const API_BASE = "https://api-internal.staging.example.com:8443/api/v2/users";
            fetch("/api/v1/admin/settings").then(r => r.json());
            const DB_HOST = "192.168.1.50";
            const GRAPHQL = "/graphql";
            const ADMIN_URL = "/admin/dashboard/users";
            const METRICS = "https://metrics-internal.prod.example.com/api/v1/query";
            const WS_ENDPOINT = "wss://api.example.com/ws/notifications";
            const INTERNAL_API = "http://10.0.0.5:3000/internal/health";
            const API_KEY_URL = "/api/v1/data?api_key=test_key_Abc123XyzDef456Ghi789";
            fetch("/api/v1/users", {method: "POST", body: JSON.stringify({name: "test"})});
            axios.get("/api/v2/orders");
            //# sourceMappingURL=app.js.map
        ';
    }

    location /app.js.map {
        default_type application/json;
        return 200 '{"version":3,"file":"app.js","sources":["src/app.ts"],"names":[],"mappings":"AAAA","sourcesContent":["const SECRET = process.env.API_SECRET;"]}';
    }
}
