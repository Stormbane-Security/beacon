name: dlp-sensitive-data
description: >
  Nginx serving pages containing SSNs, credit card numbers, and API keys.
  Beacon DLP scanner should detect sensitive data exposure.
tags: [dlp, scanner, data-leak]

services:
  nginx:
    image: nginx:alpine
    ports: ["9253:80"]
    volumes:
      - ./dlp/nginx.conf:/etc/nginx/conf.d/default.conf:ro

ready:
  cmd: "curl -sf http://localhost:9253/ >/dev/null"
  timeout: 30s
  interval: 2s

assertions:
  - name: exploit-ssn-in-response
    type: command
    expect:
      command: "curl -sf http://localhost:9253/ | grep -qE '[0-9]{3}-[0-9]{2}-[0-9]{4}'"
      exit_code: 0

  - name: exploit-credit-card-in-response
    type: command
    expect:
      command: "curl -sf http://localhost:9253/ | grep -qE '4532015112830366'"
      exit_code: 0

  - name: detects-sensitive-data
    type: beacon
    target: localhost:9253
    args: ["--no-enrich", "--scanners", "dlp"]
    expect:
      min_findings: 1

timeout: 5m
