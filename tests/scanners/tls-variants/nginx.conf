server {
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;

    # Deliberately weak: allow TLS 1.0, 1.1, and weak ciphers
    ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
    ssl_ciphers 'DES-CBC3-SHA:AES128-SHA:AES256-SHA:HIGH:!aNULL:!MD5';
    ssl_prefer_server_ciphers off;

    location / {
        return 200 "TLS test\n";
    }
}
