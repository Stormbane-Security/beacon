name: variant-consul-versions
description: >
  Consul version variant test: 1.15 vs 1.18 in dev mode with no ACLs.
  Verifies that beacon detects unauthenticated Consul catalog access
  across both major versions, catching regressions where API response
  format changes break detection.
tags: [variant, consul, infrastructure, integration]

services:
  consul115:
    image: hashicorp/consul:1.15
    ports: ["20530:8500"]
    command: ["agent", "-dev", "-client=0.0.0.0"]

  consul118:
    image: hashicorp/consul:1.18
    ports: ["20531:8500"]
    command: ["agent", "-dev", "-client=0.0.0.0"]

ready:
  cmd: "curl -sf http://localhost:20530/v1/catalog/nodes >/dev/null && curl -sf http://localhost:20531/v1/catalog/nodes >/dev/null"
  timeout: 90s
  interval: 5s

assertions:
  # ══════════════════════════════════════════════════════════════════════
  # CONSUL 1.15 — no ACL detection
  # ══════════════════════════════════════════════════════════════════════

  - name: consul115-no-acl-detected
    type: beacon
    target: localhost:20530
    args: ["--no-enrich", "--no-nmap", "--ports", "20530"]
    expect:
      check_id: port.consul_no_acl

  - name: consul115-service-identified
    type: beacon
    target: localhost:20530
    args: ["--no-enrich", "--no-nmap", "--ports", "20530"]
    expect:
      check_id: port.service_identified

  - name: exploit-consul115-deep-scan
    type: beacon
    target: localhost:20530
    args: ["--no-enrich", "--no-nmap", "--ports", "20530", "--deep", "--yes"]
    expect:
      min_findings: 0

  # ══════════════════════════════════════════════════════════════════════
  # CONSUL 1.18 — no ACL detection
  # ══════════════════════════════════════════════════════════════════════

  - name: consul118-no-acl-detected
    type: beacon
    target: localhost:20531
    args: ["--no-enrich", "--no-nmap", "--ports", "20531"]
    expect:
      check_id: port.consul_no_acl

  - name: consul118-service-identified
    type: beacon
    target: localhost:20531
    args: ["--no-enrich", "--no-nmap", "--ports", "20531"]
    expect:
      check_id: port.service_identified

  - name: exploit-consul118-deep-scan
    type: beacon
    target: localhost:20531
    args: ["--no-enrich", "--no-nmap", "--ports", "20531", "--deep", "--yes"]
    expect:
      min_findings: 0

  # ══════════════════════════════════════════════════════════════════════
  # NEGATIVE — no cross-contamination
  # ══════════════════════════════════════════════════════════════════════

  - name: negative-consul115-not-vault
    type: beacon
    target: localhost:20530
    args: ["--no-enrich", "--no-nmap", "--ports", "20530"]
    expect:
      not_check_id: port.vault_exposed

  - name: negative-consul118-not-vault
    type: beacon
    target: localhost:20531
    args: ["--no-enrich", "--no-nmap", "--ports", "20531"]
    expect:
      not_check_id: port.vault_exposed

timeout: 5m
