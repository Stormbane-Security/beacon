server {
    listen 80;
    server_name _;

    # Simulate a PHP app with discoverable paths
    location = /admin.php {
        return 200 'PHP Admin Panel';
        add_header Content-Type text/plain;
        add_header X-Powered-By 'PHP/8.1.2';
    }

    location = /admin/config {
        return 200 'Admin Config';
        add_header Content-Type text/plain;
    }

    location = /admin/backup {
        return 200 'Backup Dir';
        add_header Content-Type text/plain;
    }

    location = /health {
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    location / {
        return 404 'Not Found';
        add_header Content-Type text/plain;
        add_header X-Powered-By 'PHP/8.1.2';
    }
}
