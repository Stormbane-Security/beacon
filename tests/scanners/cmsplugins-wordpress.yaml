name: cmsplugins-wordpress
description: "WordPress instance with default plugins — beacon detects CMS and enumerates plugins"
tags: [cmsplugins, scanner, web, cms]

services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wpuser
      MYSQL_PASSWORD: wppass

  app:
    image: wordpress:latest
    ports: ["9250:80"]
    depends_on: [db]
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wpuser
      WORDPRESS_DB_PASSWORD: wppass
      WORDPRESS_DB_NAME: wordpress

ready:
  cmd: "curl -sf http://localhost:9250/ >/dev/null"
  timeout: 120s
  interval: 5s

assertions:
  - name: exploit-wordpress-detected
    type: command
    expect:
      command: "curl -s http://localhost:9250/ | grep -qi 'wordpress'"
      exit_code: 0

  - name: detects-cms-plugins
    type: beacon
    target: localhost:9250
    args: ["--no-enrich", "--scanners", "cms-plugins"]
    expect:
      check_id: cms.plugin_found

timeout: 5m
