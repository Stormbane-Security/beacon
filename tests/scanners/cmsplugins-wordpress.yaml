name: cmsplugins-wordpress
description: "WordPress instance with classic-editor plugin — beacon detects CMS and enumerates plugins"
tags: [cmsplugins, scanner, web, cms]

services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wpuser
      MYSQL_PASSWORD: wppass

  app:
    image: wordpress:latest
    ports: ["9250:80"]
    depends_on: [db]
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wpuser
      WORDPRESS_DB_PASSWORD: wppass
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - ./cmsplugins-wordpress/classic-editor:/var/www/html/wp-content/plugins/classic-editor:ro

ready:
  cmd: "curl -sfL http://localhost:9250/wp-admin/install.php | grep -qi 'wordpress'"
  timeout: 120s
  interval: 5s

run:
  - >
    curl -s -X POST 'http://localhost:9250/wp-admin/install.php?step=2'
    -d 'weblog_title=TestSite&user_name=admin&admin_password=admin123&admin_password2=admin123&pw_weak=1&admin_email=admin@test.com&Submit=Install+WordPress'
    >/dev/null

assertions:
  - name: exploit-wordpress-detected
    type: command
    expect:
      command: "curl -sL http://localhost:9250/ | grep -qi 'wordpress'"
      exit_code: 0

  - name: exploit-plugin-readme-accessible
    type: command
    expect:
      command: "curl -sf http://localhost:9250/wp-content/plugins/classic-editor/readme.txt | grep -qi 'Stable tag'"
      exit_code: 0

  - name: detects-cms-plugins
    type: beacon
    target: localhost:9250
    args: ["--no-enrich", "--no-nmap", "--scanners", "cms-plugins"]
    expect:
      check_id: cms.plugin_found

  # WordPress REST API exposes user data at /wp-json/wp/v2/users
  - name: detects-wordpress-rest-api
    type: beacon
    target: localhost:9250
    args: ["--no-enrich", "--no-nmap", "--scanners", "cms-plugins"]
    expect:
      check_id: cms.wordpress_rest_api

  # WordPress user enumeration via REST API or author archives
  - name: detects-wordpress-user-enum
    type: beacon
    target: localhost:9250
    args: ["--no-enrich", "--no-nmap", "--scanners", "cms-plugins"]
    expect:
      check_id: cms.wordpress_user_enum

  # WordPress theme detected with version
  - name: detects-wordpress-theme
    type: beacon
    target: localhost:9250
    args: ["--no-enrich", "--no-nmap", "--scanners", "cms-plugins"]
    expect:
      check_id: cms.wordpress_theme_found

  # WordPress XML-RPC enabled (pingback/brute-force surface)
  - name: detects-wordpress-xmlrpc
    type: beacon
    target: localhost:9250
    args: ["--no-enrich", "--no-nmap", "--scanners", "cms-plugins"]
    expect:
      check_id: cms.wordpress_xmlrpc

  # WordPress wp-content/plugins directory listing
  - name: detects-wordpress-dir-listing
    type: beacon
    target: localhost:9250
    args: ["--no-enrich", "--no-nmap", "--scanners", "cms-plugins"]
    expect:
      check_id: cms.wordpress_dir_listing

  # WordPress debug.log may not exist on a fresh install — check it as negative.
  # The debug.log check fires only when /wp-content/debug.log returns 200 with
  # PHP-style error output, which a fresh install doesn't produce.

timeout: 5m
