proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=cdn_cache:10m max_size=100m inactive=10m;

server {
    listen 80;
    server_name _;

    # Simulated CDN/cache layer: nginx with proxy_cache enabled.
    # Returns cache headers (X-Cache, Age), risky Vary headers,
    # and accepts unauthenticated PURGE requests.

    # Cache behavior headers on all responses
    add_header X-Cache $upstream_cache_status;
    add_header X-Cache-Hits "1";
    add_header Vary "Accept, X-Forwarded-For, User-Agent";

    # Accept PURGE method (unauthenticated cache purge)
    location / {
        if ($request_method = PURGE) {
            return 200 'Cache purged successfully';
        }

        # Proxy to upstream with caching
        proxy_cache cdn_cache;
        proxy_cache_valid 200 10m;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        proxy_pass http://app:8080;
        proxy_set_header Host $host;

        # Echo X-Forwarded-Host in response (unkeyed header reflection)
        add_header X-Debug-Host $http_x_forwarded_host;
        add_header X-Cache $upstream_cache_status;
        add_header Vary "Accept, X-Forwarded-For, User-Agent";
    }
}
