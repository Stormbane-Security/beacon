name: ssti-static-no-finding
description: >
  Static nginx server with no template engine. SSTI payloads like {{7*7}}
  should NOT be reflected in the response. Beacon SSTI scanner must NOT
  flag static pages that never evaluate template expressions.
tags: [ssti, scanner, negative, false-positive]

services:
  app:
    image: nginx:alpine
    ports: ["9469:80"]
    volumes:
      - ./ssti-negative/default.conf:/etc/nginx/conf.d/default.conf:ro

ready:
  cmd: "curl -sf http://localhost:9469/ >/dev/null"
  timeout: 30s
  interval: 2s

assertions:
  - name: setup-static-response
    type: command
    expect:
      command: "curl -s 'http://localhost:9469/search?q={{7*7}}' | grep -c '49'"
      stdout_contains: "0"

  - name: no-ssti-false-positive
    type: beacon
    target: localhost:9469
    args: ["--no-enrich", "--no-nmap", "--scanners", "ssti", "--deep", "--yes"]
    expect:
      no_check_id: web.ssti

timeout: 3m
