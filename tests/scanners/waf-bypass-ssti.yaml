name: waf-bypass-ssti
description: >
  Web application behind ModSecurity WAF with server-side template injection.
  Standard SSTI payloads like {{7*7}} are blocked by the WAF. Beacon
  should use evasion encodings (URL-encoded braces, Jinja2 print directive,
  comment injection) to bypass and confirm the SSTI vulnerability.

services:
  webapp:
    image: vulnerables/web-dvwa:latest
    ports: ["8080:80"]
    environment:
      MYSQL_HOST: database
      MYSQL_USER: root
      MYSQL_PASSWORD: dvwa
      MYSQL_DATABASE: dvwa
    depends_on: [database]

  database:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: dvwa
      MYSQL_DATABASE: dvwa

  waf:
    image: owasp/modsecurity-crs:nginx-alpine
    ports: ["80:80"]
    environment:
      BACKEND: "http://webapp:80"
      PARANOIA: "2"
    depends_on: [webapp]

assertions:
  # Beacon with evasion should find the SSTI
  - name: beacon-bypasses-waf-ssti
    type: beacon
    target: localhost
    args: ["--exploit", "--no-nmap", "--deep", "--yes", "--yes", "--scanners", "ssti", "--format", "json", "/tmp/results.json"]
    expect:
      min_findings: 0
