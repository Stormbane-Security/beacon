name: hostheader-injection
description: "Python app that reflects Host header in redirects and body triggers web.host_header_injection"
tags: [hostheader, scanner, web]

services:
  hostheader-app:
    build:
      context: ./hostheader
      dockerfile: Dockerfile
    ports: ["9203:8080"]

ready:
  cmd: "curl -sf http://localhost:9203/health >/dev/null"
  timeout: 30s
  interval: 2s

assertions:
  - name: exploit-host-header-reflected
    type: command
    expect:
      command: "curl -sf -H 'Host: evil.com' http://localhost:9203/ | grep -q evil.com"
      exit_code: 0

  - name: detects-host-header-injection
    type: beacon
    target: localhost:9203
    args: ["--no-enrich", "--scanners", "hostheader", "--deep", "--yes", "--ports", "8080"]
    expect:
      check_id: web.host_header_injection

timeout: 5m
