server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Rewrite /.env to the renamed file (dotenv.txt) to simulate
    # a misconfigured server exposing .env — the actual file is renamed
    # to avoid being caught by .gitignore.
    location = /.env {
        alias /usr/share/nginx/html/dotenv.txt;
        default_type text/plain;
    }

    # Serve dotfiles (normally blocked) to simulate misconfigured server
    location ~ /\. {
        default_type text/plain;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
