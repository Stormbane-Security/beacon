name: fingerprint-php-framework
description: "PHP application is correctly identified via X-Powered-By header"
tags: [fingerprint, php, framework]

services:
  php:
    image: php:8.2-apache
    ports: ["80:80"]
    volumes:
      - ./php-framework/index.php:/var/www/html/index.php:ro

ready:
  cmd: "curl -so /dev/null -w '%{http_code}' http://localhost:80/ | grep -q '200'"
  timeout: 60s
  interval: 2s

assertions:
  - name: exploit-php-powered-by
    type: command
    expect:
      command: "curl -sI http://localhost:80/ | grep -qi 'X-Powered-By'"
      exit_code: 0

  - name: identifies-php-framework
    type: classify
    target: localhost:80
    expect:
      framework: php

timeout: 2m
