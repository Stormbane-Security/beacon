name: fingerprint-nginx-proxy
description: "nginx reverse proxy is correctly identified as proxy_type=nginx"
tags: [fingerprint, nginx, proxy]

services:
  nginx:
    image: nginx:alpine
    ports: ["80:80"]

ready:
  cmd: "curl -sf http://localhost:80/ >/dev/null"
  timeout: 30s
  interval: 2s

assertions:
  - name: exploit-nginx-server-header
    type: command
    expect:
      command: "curl -sI http://localhost:80/ | grep -qi 'Server: nginx'"
      exit_code: 0

  - name: identifies-nginx-proxy
    type: classify
    target: localhost:80
    expect:
      proxy_type: nginx

timeout: 2m
