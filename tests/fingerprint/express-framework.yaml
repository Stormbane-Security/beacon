name: fingerprint-express-framework
description: "Express.js app is correctly identified via X-Powered-By header"
tags: [fingerprint, express, node, framework]

services:
  app:
    image: node:20-alpine
    ports: ["3000:3000"]
    command: ["sh", "-c", "echo 'const http=require(\"http\");http.createServer((q,s)=>{s.setHeader(\"X-Powered-By\",\"Express\");s.end(\"ok\")}).listen(3000)' | node"]

ready:
  cmd: "curl -sf http://localhost:3000/ >/dev/null"
  timeout: 30s
  interval: 2s

assertions:
  - name: exploit-express-powered-by
    type: command
    expect:
      command: "curl -sI http://localhost:3000/ | grep -qi 'X-Powered-By: Express'"
      exit_code: 0

  - name: identifies-express-framework
    type: classify
    target: localhost:3000
    expect:
      framework: express

timeout: 2m
