name: grafana-path-traversal
description: "Grafana 8.2.0 with CVE-2021-43798 plugin path traversal — beacon detects arbitrary file read"
tags: [grafana, cve, path-traversal]

services:
  grafana:
    image: grafana/grafana:8.2.0
    ports: ["9232:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"

ready:
  cmd: "curl -sf http://localhost:9232/api/health >/dev/null"
  timeout: 60s
  interval: 3s

assertions:
  - name: detects-grafana-traversal
    type: beacon
    target: localhost:9232
    args: ["--no-enrich", "--no-nmap", "--scanners", "portscan", "--ports", "3000"]
    expect:
      min_findings: 1

timeout: 5m
