name: tomcat-ghostcat
description: "Apache Tomcat 9.0.30 with AJP connector exposed — CVE-2020-1938 GhostCat file read"
tags: [tomcat, cve, ajp]

services:
  tomcat:
    image: tomcat:9.0.30-jdk8
    ports:
      - "9233:8080"
      - "8009:8009"

ready:
  cmd: "curl -sf http://localhost:9233/ >/dev/null || nc -z localhost 8009"
  timeout: 60s
  interval: 3s

assertions:
  - name: exploit-ghostcat-ajp-port-open
    type: command
    expect:
      command: "nc -z -w 3 localhost 8009"
      exit_code: 0

  - name: detects-ghostcat-ajp
    type: beacon
    target: localhost:8009
    args: ["--no-enrich", "--no-nmap", "--scanners", "portscan", "--ports", "8009"]
    expect:
      check_id: cve.tomcat_ghostcat

  # ══════════════════════════════════════════════════════════════════════
  # STEP 3: EXPLOIT MODE — deep scan with exploit chain
  # ══════════════════════════════════════════════════════════════════════

  - name: ghostcat-exploit-mode
    type: beacon
    target: localhost:8009
    args: ["--no-enrich", "--no-nmap", "--scanners", "portscan", "--ports", "8009", "--deep", "--yes"]
    expect:
      min_findings: 1


timeout: 5m
