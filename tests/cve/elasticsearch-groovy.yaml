name: elasticsearch-groovy-rce
description: "Elasticsearch 1.4.2 with Groovy sandbox escape — CVE-2015-1427 unauthenticated RCE"
tags: [cve, elasticsearch, rce, authorized]

services:
  elasticsearch:
    image: elasticsearch:1.4.2
    ports: ["9274:9200"]

ready:
  cmd: "curl -sf http://localhost:9274/ >/dev/null"
  timeout: 120s
  interval: 5s

assertions:
  - name: exploit-elasticsearch-groovy-rce
    type: command
    expect:
      command: "curl -sf -X POST 'http://localhost:9274/_search?pretty' -H 'Content-Type: application/json' -d '{\"script_fields\":{\"test\":{\"script\":\"1+1\"}}}' | grep -q '\"test\"'"
      exit_code: 0

  - name: exploit-elasticsearch-cluster-info
    type: command
    expect:
      command: "curl -sf http://localhost:9274/ | grep -q '1.4.2'"
      exit_code: 0

  - name: detects-elasticsearch-groovy-rce
    type: beacon
    target: localhost:9274
    args: ["--no-enrich", "--scanners", "portscan", "--deep", "--permission-confirmed", "--authorized", "--ports", "9200"]
    expect:
      check_id: cve.elasticsearch_groovy_rce

timeout: 10m
