name: activemq-rce
description: "Apache ActiveMQ 5.15.15 with CVE-2023-46604 ClassInfo deserialization RCE"
tags: [activemq, cve, deserialization]

services:
  activemq:
    image: apache/activemq-classic:5.15.15
    ports:
      - "61617:61616"
      - "8162:8161"

ready:
  cmd: "curl -sf http://localhost:8162/ >/dev/null"
  timeout: 90s
  interval: 5s

assertions:
  - name: exploit-activemq-admin-console
    type: command
    expect:
      command: "curl -sf -u admin:admin http://localhost:8162/admin/ | grep -q ActiveMQ"
      exit_code: 0

  - name: exploit-activemq-version-exposed
    type: command
    expect:
      command: "curl -sf http://localhost:8162/api/jolokia/read/org.apache.activemq:type=Broker,brokerName=localhost/BrokerVersion 2>/dev/null | grep -q '5.15' || curl -sf -u admin:admin http://localhost:8162/admin/ | grep -q '5.15'"
      exit_code: 0

  - name: detects-activemq-rce
    type: beacon
    target: activemq:61616
    args: ["--no-enrich", "--scanners", "portscan", "--ports", "61616"]
    expect:
      check_id: cve.activemq_rce

timeout: 5m
