name: keycloak-saml-bypass
description: "Keycloak < 26.0.6 with CVE-2026-3047 SAML signature validation bypass"
tags: [cve, keycloak, saml, auth-bypass]

services:
  keycloak:
    image: quay.io/keycloak/keycloak:25.0.0
    ports: ["9278:8080"]
    command: ["start-dev"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin

ready:
  cmd: "curl -sf http://localhost:9278/realms/master/.well-known/openid-configuration >/dev/null"
  timeout: 180s
  interval: 5s

assertions:
  - name: exploit-keycloak-saml-descriptor-exposed
    type: command
    expect:
      command: "curl -sf 'http://localhost:9278/realms/master/protocol/saml/descriptor' | grep -q 'EntityDescriptor'"
      exit_code: 0

  - name: exploit-keycloak-oidc-exposed
    type: command
    expect:
      command: "curl -sf 'http://localhost:9278/realms/master/.well-known/openid-configuration' | grep -q 'issuer'"
      exit_code: 0

  - name: detects-keycloak-saml-bypass
    type: beacon
    target: localhost:9278
    args: ["--no-enrich", "--no-nmap", "--scanners", "saml,portscan", "--deep", "--permission-confirmed", "--ports", "8080"]
    expect:
      check_id: cve.keycloak_saml_bypass

timeout: 10m
