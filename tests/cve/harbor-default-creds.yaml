name: harbor-default-credentials
description: "Harbor registry with default admin:Harbor12345 credentials — beacon detects default creds"
tags: [cve, harbor, default-creds]

services:
  harbor:
    image: goharbor/harbor-core:v2.10.0
    ports: ["9273:8080"]
    environment:
      CONFIG_PATH: "/etc/core/app.conf"

ready:
  cmd: "curl -sf http://localhost:9273/api/v2.0/systeminfo >/dev/null || curl -sf http://localhost:9273/ >/dev/null"
  timeout: 120s
  interval: 5s

assertions:
  - name: detects-harbor-default-creds
    type: beacon
    target: harbor:8080
    args: ["--no-enrich", "--scanners", "portscan", "--deep", "--permission-confirmed", "--ports", "8080"]
    expect:
      check_id: cve.harbor_default_credentials

timeout: 10m
