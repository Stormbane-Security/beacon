name: minio-env-disclosure
description: "MinIO server with CVE-2023-28432 — POST /minio/health/cluster?verify leaks MINIO_SECRET_KEY"
tags: [cve, minio, information-disclosure]

services:
  minio:
    image: minio/minio:RELEASE.2023-03-13T19-46-17Z
    ports: ["9272:9000"]
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: "minioadmin"
      MINIO_ROOT_PASSWORD: "minioadmin"

ready:
  cmd: "curl -sf http://localhost:9272/minio/health/live >/dev/null"
  timeout: 60s
  interval: 3s

assertions:
  - name: detects-minio-env-disclosure
    type: beacon
    target: minio:9000
    args: ["--no-enrich", "--scanners", "portscan", "--deep", "--permission-confirmed", "--ports", "9000"]
    expect:
      check_id: cve.minio_env_disclosure

timeout: 5m
