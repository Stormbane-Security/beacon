name: drupalgeddon
description: "Drupal 7.31 with CVE-2014-3704 SQL injection — unauthenticated admin via form API"
tags: [cve, drupal, sqli, authorized]

services:
  drupal:
    image: drupal:7.31
    ports: ["9276:80"]

ready:
  cmd: "curl -sf http://localhost:9276/ >/dev/null"
  timeout: 120s
  interval: 5s

assertions:
  - name: exploit-drupal-version-exposed
    type: command
    expect:
      command: "curl -sf http://localhost:9276/CHANGELOG.txt | head -5 | grep -q 'Drupal 7'"
      exit_code: 0

  - name: exploit-drupal-form-api-accessible
    type: command
    expect:
      command: "curl -sf -o /dev/null -w '%{http_code}' 'http://localhost:9276/?q=user/password' | grep -q 200"
      exit_code: 0

  - name: detects-drupalgeddon
    type: beacon
    target: localhost:9276
    args: ["--no-enrich", "--no-nmap", "--scanners", "portscan", "--deep", "--permission-confirmed", "--authorized", "--ports", "80"]
    expect:
      check_id: cve.drupal_drupalgeddon1

timeout: 10m
