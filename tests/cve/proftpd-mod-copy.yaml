name: proftpd-mod-copy
description: "ProFTPD 1.3.5 with mod_copy enabled — CVE-2015-3306 unauthenticated file read/write"
tags: [cve, ftp, file-access, authorized]

services:
  proftpd:
    image: hauptmedia/proftpd
    ports: ["9275:21"]

ready:
  cmd: "nc -z localhost 9275"
  timeout: 30s
  interval: 2s

assertions:
  - name: exploit-proftpd-banner
    type: command
    expect:
      command: "echo '' | nc -w 3 localhost 9275 | grep -qi 'ProFTPD\\|220'"
      exit_code: 0

  - name: exploit-proftpd-site-cpfr
    type: command
    expect:
      command: "printf 'SITE CPFR /etc/passwd\\r\\n' | nc -w 3 localhost 9275 | grep -qE '(350|500)'"
      exit_code: 0

  - name: detects-proftpd-mod-copy
    type: beacon
    target: proftpd:21
    args: ["--no-enrich", "--scanners", "portscan", "--deep", "--permission-confirmed", "--authorized", "--ports", "21"]
    expect:
      check_id: cve.proftpd_mod_copy

timeout: 5m
