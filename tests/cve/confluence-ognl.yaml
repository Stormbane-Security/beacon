name: confluence-ognl-injection
description: "Confluence Server 7.13.6 with CVE-2022-26134 OGNL injection — pre-auth RCE"
tags: [cve, confluence, rce, authorized]

services:
  confluence:
    image: atlassian/confluence-server:7.13.6
    ports: ["9277:8090"]
    environment:
      JVM_MINIMUM_MEMORY: "512m"
      JVM_MAXIMUM_MEMORY: "1024m"

ready:
  cmd: "curl -sf http://localhost:9277/status >/dev/null || curl -sf http://localhost:9277/ >/dev/null"
  timeout: 300s
  interval: 10s

assertions:
  - name: exploit-confluence-version-exposed
    type: command
    expect:
      command: "curl -sf http://localhost:9277/status 2>/dev/null | grep -qi confluence || curl -sf http://localhost:9277/ 2>/dev/null | grep -qi confluence"
      exit_code: 0

  - name: detects-confluence-ognl
    type: beacon
    target: confluence:8090
    args: ["--no-enrich", "--scanners", "portscan", "--deep", "--permission-confirmed", "--authorized", "--ports", "8090"]
    expect:
      check_id: web.tech_detected

timeout: 15m
