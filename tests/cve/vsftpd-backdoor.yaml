name: vsftpd-backdoor
description: "vsftpd 2.3.4 with supply-chain backdoor — beacon detects compromised version from banner"
tags: [cve, ftp, backdoor, authorized]

services:
  vsftpd:
    image: opsxcq/exploit-vsftpd-2.3.4
    ports: ["9270:21"]

ready:
  cmd: "nc -z localhost 9270"
  timeout: 30s
  interval: 2s

assertions:
  - name: detects-vsftpd-backdoor
    type: beacon
    target: vsftpd:21
    args: ["--no-enrich", "--scanners", "portscan", "--ports", "21"]
    expect:
      check_id: cve.vsftpd_backdoor_2011

timeout: 5m
