name: neo4j-nonstandard-port
description: "Neo4j on non-standard port — probe must detect by HTTP API response, not port number"
tags: [neo4j, nonstandard-port]

services:
  neo4j:
    image: neo4j:5-community
    ports:
      - "7575:7474"
      - "7688:7687"
    environment:
      NEO4J_AUTH: "none"

ready:
  cmd: "curl -sf http://localhost:7575 >/dev/null"
  timeout: 90s
  interval: 3s

assertions:
  - name: exploit-neo4j-browser
    type: command
    expect:
      command: "curl -sf http://localhost:7575 | grep -qiE '(neo4j|browser)'"
      exit_code: 0

  - name: detects-neo4j-on-nonstandard-port
    type: beacon
    target: localhost:7688
    args: ["--no-enrich", "--no-nmap", "--scanners", "portscan", "--ports", "7575"]
    expect:
      min_findings: 0

timeout: 5m
