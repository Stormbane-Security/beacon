name: neo4j-nonstandard-port
description: "Neo4j on non-standard port — probe must detect by HTTP API response, not port number"
tags: [neo4j, nonstandard-port]

services:
  neo4j:
    image: neo4j:5-community
    ports:
      - "7575:7474"
      - "7688:7687"
    environment:
      NEO4J_AUTH: "none"

ready:
  cmd: "curl -sf http://localhost:7575 >/dev/null"
  timeout: 90s
  interval: 3s

assertions:
  - name: detects-neo4j-on-nonstandard-port
    type: beacon
    target: neo4j:7575
    args: ["--no-enrich", "--scanners", "portscan", "--ports", "7575"]
    expect:
      check_id: port.neo4j_exposed

timeout: 5m
