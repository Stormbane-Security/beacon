name: zookeeper-nonstandard-port
description: "ZooKeeper on non-standard port — probe must detect by 4LW response, not port number"
tags: [zookeeper, nonstandard-port]

services:
  zookeeper:
    image: zookeeper:3.9
    ports: ["2199:2181"]
    environment:
      ZOO_4LW_COMMANDS_WHITELIST: "*"

ready:
  cmd: "nc -z localhost 2199"
  timeout: 60s
  interval: 3s

assertions:
  - name: exploit-zookeeper-srvr
    type: command
    expect:
      command: "echo 'srvr' | nc -w 3 localhost 2199 | grep -q 'Zookeeper version'"
      exit_code: 0

  - name: detects-zookeeper-on-nonstandard-port
    type: beacon
    target: localhost:2199
    args: ["--no-enrich", "--scanners", "portscan", "--ports", "2199"]
    expect:
      check_id: port.zookeeper_exposed

timeout: 5m
