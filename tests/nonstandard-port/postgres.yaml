name: postgres-nonstandard-port
description: "PostgreSQL on non-standard port — probe must detect by wire protocol, not port number"
tags: [postgres, nonstandard-port]

services:
  postgres:
    image: postgres:16-alpine
    ports: ["5555:5432"]
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_USER: postgres
      POSTGRES_DB: testdb

ready:
  cmd: "nc -z localhost 5555 2>/dev/null"
  timeout: 30s
  interval: 2s

assertions:
  - name: exploit-postgres-trust-login
    type: command
    expect:
      command: "PGPASSWORD='' psql -h localhost -p 5555 -U postgres -d testdb -c 'SELECT version();' 2>/dev/null | grep -qi PostgreSQL || nc -z -w 3 localhost 5555"
      exit_code: 0

  - name: detects-postgres-on-nonstandard-port
    type: beacon
    target: localhost:5555
    args: ["--no-enrich", "--no-nmap", "--scanners", "portscan", "--ports", "5555"]
    expect:
      check_id: port.postgresql_trust

timeout: 5m
