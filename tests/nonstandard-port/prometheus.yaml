name: prometheus-nonstandard-port
description: "Prometheus on non-standard port — probe must detect by HTTP response, not port number"
tags: [prometheus, nonstandard-port]

services:
  prometheus:
    image: prom/prometheus:latest
    ports: ["8877:9090"]

ready:
  cmd: "curl -sf http://localhost:8877/-/healthy | grep -q OK"
  timeout: 150s
  interval: 3s

assertions:
  - name: exploit-prometheus-targets
    type: command
    expect:
      command: "curl -sf http://localhost:8877/api/v1/targets | grep -q activeTargets"
      exit_code: 0

  - name: detects-prometheus-on-nonstandard-port
    type: beacon
    target: localhost:8877
    args: ["--no-enrich", "--no-nmap", "--scanners", "portscan", "--ports", "8877"]
    expect:
      check_id: port.prometheus_unauthenticated

timeout: 5m
