name: ftp-nonstandard-port
description: "FTP on non-standard port — probe must detect by banner response, not port number"
tags: [ftp, nonstandard-port]

services:
  ftp:
    image: fauria/vsftpd
    ports:
      - "2121:21"
    environment:
      FTP_USER: testuser
      FTP_PASS: testpass
      PASV_MIN_PORT: "21100"
      PASV_MAX_PORT: "21110"
      ANONYMOUS_ENABLE: "YES"

ready:
  cmd: "nc -z localhost 2121"
  timeout: 60s
  interval: 3s

assertions:
  - name: exploit-ftp-banner
    type: command
    expect:
      command: "echo 'QUIT' | nc -w 3 localhost 2121 | grep -qiE '(220|FTP|vsFTPd)'"
      exit_code: 0

  - name: detects-ftp-on-nonstandard-port
    type: beacon
    target: localhost:2121
    args: ["--no-enrich", "--no-nmap", "--scanners", "portscan", "--ports", "2121"]
    expect:
      check_id: port.ftp_exposed

timeout: 5m
