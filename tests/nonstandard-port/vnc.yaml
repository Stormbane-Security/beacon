name: vnc-nonstandard-port
description: "VNC on non-standard port — probe must detect by RFB handshake, not port number"
tags: [vnc, nonstandard-port]

services:
  vnc:
    image: theasp/novnc:latest
    ports: ["5999:5900"]
    environment:
      DISPLAY_WIDTH: "800"
      DISPLAY_HEIGHT: "600"

ready:
  cmd: "nc -z localhost 5999"
  timeout: 60s
  interval: 3s

assertions:
  - name: detects-vnc-on-nonstandard-port
    type: beacon
    target: localhost:5999
    args: ["--no-enrich", "--no-nmap", "--scanners", "portscan", "--ports", "5999"]
    expect:
      check_id: port.vnc_exposed

  - name: deep-mode-vnc
    type: beacon
    target: localhost:5999
    args: ["--no-enrich", "--no-nmap", "--scanners", "portscan", "--deep", "--yes", "--ports", "5999"]
    expect:
      min_findings: 0

  - name: exploit-mode-vnc
    type: beacon
    target: localhost:5999
    args: ["--no-enrich", "--no-nmap", "--scanners", "portscan", "--exploit", "--yes", "--ports", "5999"]
    expect:
      min_findings: 0

timeout: 5m
