name: nats-nonstandard-port
description: "NATS monitoring on non-standard port — probe must detect by HTTP response, not port number"
tags: [nats, nonstandard-port]

services:
  nats:
    image: nats:2.10-alpine
    ports:
      - "5222:4222"
      - "9222:8222"
    command: ["--http_port", "8222"]

ready:
  cmd: "curl -sf http://localhost:9222/varz | grep -q server_id"
  timeout: 30s
  interval: 2s

assertions:
  - name: detects-nats-on-nonstandard-port
    type: beacon
    target: localhost:9222
    args: ["--no-enrich", "--scanners", "portscan", "--ports", "9222"]
    expect:
      check_id: port.nats_monitoring_exposed

timeout: 5m
