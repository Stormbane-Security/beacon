name: keycloak-nonstandard-port
description: "Keycloak on non-standard port — probe must detect OAuth/SAML by response, not port number"
tags: [keycloak, nonstandard-port]

services:
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    ports: ["8888:8080"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    command: ["start-dev"]

ready:
  cmd: "curl -sf http://localhost:8888/realms/master/.well-known/openid-configuration >/dev/null"
  timeout: 90s
  interval: 3s

assertions:
  - name: classifies-keycloak-on-nonstandard-port
    type: classify
    target: localhost:8888
    expect:
      backend_service: Keycloak

  - name: detects-oauth-on-nonstandard-port
    type: beacon
    target: localhost:8888
    args: ["--no-enrich", "--scanners", "oauth"]
    expect:
      check_id: oauth.jwks_exposed

timeout: 5m
