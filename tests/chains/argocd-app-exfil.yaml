name: chain-argocd-app-exfil
description: >
  Exploit chain: Argo CD unauthenticated API → application enumeration →
  repository credential extraction → cluster lateral movement.
  Argo CD with disabled auth exposes Kubernetes deployments and Git credentials.
tags: [chain, postexploit, argocd, credential-harvest, lateral-movement, authorized]
weight: 50

services:
  argocd:
    image: quay.io/argoproj/argocd:v2.8.0
    ports: ["9422:8080"]
    command: ["argocd-server", "--insecure", "--disable-auth"]

ready:
  cmd: "curl -sfk http://localhost:9422/api/v1/applications 2>/dev/null | grep -q items"
  timeout: 120s
  interval: 5s

assertions:
  - name: argocd-api-accessible
    type: command
    expect:
      command: "curl -sfk http://localhost:9422/api/v1/applications | grep -q items"
      exit_code: 0

  - name: chain-detects-argocd
    type: beacon
    target: "localhost:9422"
    args: ["--no-enrich", "--scanners", "portscan", "--authorized", "--deep", "--permission-confirmed", "--ports", "9422"]
    expect:
      check_id: exploit.code_execution

timeout: 10m
