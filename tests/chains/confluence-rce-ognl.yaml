name: chain-confluence-rce-ognl
description: >
  Exploit chain: Atlassian Confluence 7.13.6 → CVE-2021-26084 OGNL injection →
  CVE-2023-22515 admin creation bypass. Confluence with default setup
  exposes OGNL injection and setup wizard endpoints.
tags: [chain, postexploit, confluence-rce, cve, rce, authorized]
weight: 100

services:
  confluence:
    image: atlassian/confluence:7.13.6
    ports: ["9432:8090"]
    environment:
      - JVM_MINIMUM_MEMORY=512m
      - JVM_MAXIMUM_MEMORY=1024m

ready:
  cmd: "curl -sf http://localhost:9432/ 2>/dev/null | grep -qi confluence"
  timeout: 300s
  interval: 10s

assertions:
  - name: confluence-accessible
    type: command
    expect:
      command: "curl -sf http://localhost:9432/ | grep -qi confluence"
      exit_code: 0

  - name: chain-exploits-confluence
    type: beacon
    target: "localhost:9432"
    args: ["--no-enrich", "--scanners", "portscan", "--authorized", "--deep", "--permission-confirmed", "--ports", "9432"]
    expect:
      check_id: exploit.code_execution

timeout: 15m
