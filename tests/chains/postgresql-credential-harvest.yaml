name: chain-postgresql-credential-harvest
description: >
  Exploit chain: PostgreSQL trust auth → credential harvest → data extraction.
  The post-exploit module enumerates databases, extracts password hashes from
  pg_shadow, and harvests PII from application tables.
tags: [chain, postexploit, postgresql, credential-harvest, authorized]

services:
  postgres:
    image: postgres:16-alpine
    ports: ["9410:5432"]
    environment:
      POSTGRES_HOST_AUTH_METHOD: "trust"
      POSTGRES_DB: "production"

  seed:
    image: postgres:16-alpine
    depends_on: [postgres]
    restart: "no"
    entrypoint: ["sh", "-c"]
    command:
      - |
        sleep 5
        psql -h postgres -U postgres -d production -c "
          CREATE ROLE app_user WITH LOGIN PASSWORD 'DbS3cret!Prod';
          CREATE TABLE IF NOT EXISTS employees (
            id SERIAL PRIMARY KEY,
            name TEXT,
            email TEXT,
            ssn TEXT,
            salary NUMERIC
          );
          INSERT INTO employees (name, email, ssn, salary) VALUES
            ('Charlie Cook', 'charlie@example.com', '111-22-3333', 95000),
            ('Diana Drake', 'diana@example.com', '444-55-6666', 120000);
          CREATE TABLE IF NOT EXISTS config (
            key TEXT PRIMARY KEY,
            value TEXT
          );
          INSERT INTO config (key, value) VALUES
            ('stripe_secret', 'sk_test_FAKE000000000000000'),
            ('jwt_signing_key', 'HS256-super-secret-signing-key-2024');
        "

ready:
  cmd: "psql -h localhost -p 9410 -U postgres -c 'SELECT 1' 2>/dev/null"
  timeout: 30s
  interval: 2s

assertions:
  - name: exploit-postgres-trust-auth
    type: command
    expect:
      command: "psql -h localhost -p 9410 -U postgres -d production -c 'SELECT count(*) FROM employees' | grep -q 2"
      exit_code: 0

  - name: detects-postgres-trust
    type: beacon
    target: "localhost:9410"
    args: ["--no-enrich", "--scanners", "portscan", "--ports", "9410"]
    expect:
      check_id: port.postgresql_trust

  - name: chain-harvests-credentials
    type: beacon
    target: "localhost:9410"
    args: ["--no-enrich", "--scanners", "portscan", "--authorized", "--deep", "--permission-confirmed", "--ports", "9410"]
    expect:
      check_id: exploit.credential_harvest

  - name: chain-extracts-data
    type: beacon
    target: "localhost:9410"
    args: ["--no-enrich", "--scanners", "portscan", "--authorized", "--deep", "--permission-confirmed", "--ports", "9410"]
    expect:
      check_id: exploit.data_extracted

timeout: 5m
