name: chain-portainer-uninitialized
description: >
  Exploit chain: Portainer uninitialized instance → admin account creatable.
  Fresh Portainer installations allow creating the first admin account
  without authentication.
tags: [chain, postexploit, portainer, privilege-escalation, authorized]

services:
  portainer:
    image: portainer/portainer-ce:latest
    ports: ["9416:9000"]

ready:
  cmd: "curl -sf http://localhost:9416/api/status | grep -q Version"
  timeout: 30s
  interval: 2s

assertions:
  - name: detects-portainer-service
    type: beacon
    target: "localhost:9416"
    args: ["--no-enrich", "--scanners", "portscan", "--ports", "9416"]
    expect:
      check_id: port.service_identified

  - name: chain-detects-uninitialized-portainer
    type: beacon
    target: "localhost:9416"
    args: ["--no-enrich", "--scanners", "portscan", "--authorized", "--deep", "--permission-confirmed", "--ports", "9416"]
    expect:
      check_id: exploit.code_execution

timeout: 10m
