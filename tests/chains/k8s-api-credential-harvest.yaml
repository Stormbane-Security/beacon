name: chain-k8s-api-credential-harvest
description: >
  Exploit chain: Kubernetes API anonymous auth → namespace enumeration →
  secret extraction → credential harvest.
tags: [chain, postexploit, kubernetes, credential-harvest, authorized, slow]
weight: 90

services:
  k3s:
    image: rancher/k3s:v1.29.2-k3s1
    ports: ["9420:6443"]
    privileged: true
    command:
      - server
      - "--disable=traefik,servicelb,metrics-server"
      - "--kube-apiserver-arg=anonymous-auth=true"
      - "--kube-apiserver-arg=authorization-mode=AlwaysAllow"
    environment:
      K3S_KUBECONFIG_MODE: "644"

  seed:
    image: rancher/k3s:v1.29.2-k3s1
    depends_on: [k3s]
    restart: "no"
    entrypoint: ["sh", "-c"]
    command:
      - |
        sleep 30
        export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
        kubectl config set-cluster default --server=https://k3s:6443 --insecure-skip-tls-verify=true
        kubectl create namespace production 2>/dev/null || true
        kubectl create secret generic db-credentials \
          --namespace=production \
          --from-literal=username=admin \
          --from-literal=password='K8sDbPass!Secret789' 2>/dev/null || true
        kubectl create secret generic api-keys \
          --namespace=production \
          --from-literal=stripe='sk_test_FAKE000000000000000' \
          --from-literal=internal='ik_prod_x1y2z3w4' 2>/dev/null || true

ready:
  cmd: "curl -sfk https://localhost:9420/api/v1/namespaces | grep -q production"
  timeout: 120s
  interval: 5s

assertions:
  - name: exploit-k8s-anonymous-access
    type: command
    expect:
      command: "curl -sfk https://localhost:9420/api/v1/namespaces | grep -q production"
      exit_code: 0

  - name: detects-k8s-api-exposed
    type: beacon
    target: "localhost:9420"
    args: ["--no-enrich", "--no-nmap", "--scanners", "portscan", "--ports", "9420"]
    expect:
      check_id: port.k8s_api_exposed

  - name: chain-harvests-credentials
    type: beacon
    target: "localhost:9420"
    args: ["--no-enrich", "--no-nmap", "--scanners", "portscan", "--authorized", "--deep", "--permission-confirmed", "--ports", "9420"]
    expect:
      check_id: exploit.credential_harvest

timeout: 10m
