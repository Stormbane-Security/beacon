name: chain-minio-bucket-exfil
description: >
  Exploit chain: MinIO default credentials → bucket listing → data exfiltration.
  MinIO ships with minioadmin/minioadmin default credentials.
tags: [chain, postexploit, minio, data-exfil, authorized]

services:
  minio:
    image: minio/minio:latest
    ports: ["9414:9000"]
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: ["server", "/data"]

ready:
  cmd: "curl -sf http://localhost:9414/minio/health/live"
  timeout: 30s
  interval: 2s

assertions:
  - name: detects-minio-service
    type: beacon
    target: "localhost:9414"
    args: ["--no-enrich", "--no-nmap", "--scanners", "portscan", "--ports", "9414"]
    expect:
      check_id: port.service_identified

  - name: chain-exploits-minio-default-creds
    type: beacon
    target: "localhost:9414"
    args: ["--no-enrich", "--no-nmap", "--scanners", "portscan", "--authorized", "--deep", "--permission-confirmed", "--ports", "9414"]
    expect:
      check_id: port.service_identified

timeout: 10m
