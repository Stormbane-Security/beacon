name: chain-activemq-rce
description: >
  Exploit chain: Apache ActiveMQ CVE-2023-46604 deserialization RCE.
  ActiveMQ 5.15.x is vulnerable to ClassInfo deserialization on the
  OpenWire protocol port (61616). Web console accessible via default creds.
tags: [chain, postexploit, activemq-rce, cve, rce, authorized]

services:
  activemq:
    image: apache/activemq-classic:5.15.15
    ports:
      - "9417:61616"
      - "9418:8161"

ready:
  cmd: "curl -sf -u admin:admin http://localhost:9418/admin/ | grep -qi activemq"
  timeout: 60s
  interval: 3s

assertions:
  - name: detects-activemq-service
    type: beacon
    target: "localhost:9417"
    args: ["--no-enrich", "--no-nmap", "--scanners", "portscan", "--ports", "9417"]
    expect:
      check_id: port.service_identified

  - name: chain-exploits-activemq-rce
    type: beacon
    target: "localhost:9417"
    args: ["--no-enrich", "--no-nmap", "--scanners", "portscan", "--authorized", "--deep", "--permission-confirmed", "--ports", "9417,9418"]
    expect:
      check_id: exploit.code_execution

timeout: 10m
