name: chain-jenkins-script-console-rce
description: >
  Exploit chain: Jenkins unauthenticated Script Console → Groovy RCE.
  Jenkins in development mode exposes the Script Console without authentication.
  The post-exploit chain detects this, executes a proof-of-concept Groovy script,
  and extracts credentials from the credential store.
tags: [chain, postexploit, jenkins, rce, credential-harvest, authorized]
weight: 70

services:
  jenkins:
    image: jenkins/jenkins:2.387.1-lts
    ports: ["9411:8080"]
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false

ready:
  cmd: "curl -sf http://localhost:9411/ | grep -qi jenkins"
  timeout: 120s
  interval: 5s

assertions:
  - name: detects-jenkins-service
    type: beacon
    target: "localhost:9411"
    args: ["--no-enrich", "--scanners", "portscan", "--ports", "9411"]
    expect:
      check_id: port.service_identified

  - name: chain-exploits-jenkins-script-console
    type: beacon
    target: "localhost:9411"
    args: ["--no-enrich", "--scanners", "portscan", "--authorized", "--deep", "--permission-confirmed", "--ports", "9411"]
    expect:
      check_id: exploit.code_execution

timeout: 10m
