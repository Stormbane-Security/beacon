name: chain-mysql-credential-harvest
description: >
  Exploit chain: MySQL no-password root → credential harvest → data extraction.
  The post-exploit module enumerates databases, extracts user credentials from
  mysql.user, and harvests sensitive data from application tables.
tags: [chain, postexploit, mysql, credential-harvest, authorized]

services:
  mysql:
    image: mysql:8.0
    ports: ["9409:3306"]
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: "production"

  seed:
    image: mysql:8.0
    depends_on: [mysql]
    restart: "no"
    entrypoint: ["sh", "-c"]
    command:
      - |
        sleep 15
        mysql -h mysql -u root -e "
          CREATE USER IF NOT EXISTS 'app_user'@'%' IDENTIFIED BY 'AppSecretP@ss!';
          GRANT ALL ON production.* TO 'app_user'@'%';
          USE production;
          CREATE TABLE IF NOT EXISTS customers (
            id INT AUTO_INCREMENT PRIMARY KEY,
            name VARCHAR(100),
            email VARCHAR(100),
            ssn VARCHAR(20),
            card_number VARCHAR(20)
          );
          INSERT INTO customers (name, email, ssn, card_number) VALUES
            ('Alice Admin', 'alice@example.com', '123-45-6789', '4532015112830366'),
            ('Bob Baker', 'bob@example.com', '987-65-4321', '6011514433546201');
          CREATE TABLE IF NOT EXISTS api_keys (
            service VARCHAR(50),
            api_key VARCHAR(200)
          );
          INSERT INTO api_keys (service, api_key) VALUES
            ('internal-api', 'iak_prod_a1b2c3d4e5f6g7h8'),
            ('backup-svc', 'bak_secret_x9y8z7w6v5');
        "

ready:
  cmd: "nc -z localhost 9409 2>/dev/null"
  timeout: 60s
  interval: 3s

assertions:
  - name: exploit-mysql-no-password
    type: command
    expect:
      command: "mysql -h localhost -P 9409 -u root -e 'SHOW DATABASES' 2>/dev/null | grep -q production || nc -z -w 3 localhost 9409"
      exit_code: 0

  - name: detects-mysql-no-auth
    type: beacon
    target: "localhost:9409"
    args: ["--no-enrich", "--no-nmap", "--scanners", "portscan", "--ports", "9409"]
    expect:
      check_id: port.mysql_no_auth

  - name: chain-harvests-credentials
    type: beacon
    target: "localhost:9409"
    args: ["--no-enrich", "--no-nmap", "--scanners", "portscan", "--authorized", "--deep", "--permission-confirmed", "--ports", "9409"]
    expect:
      check_id: port.mysql_no_auth

timeout: 10m
