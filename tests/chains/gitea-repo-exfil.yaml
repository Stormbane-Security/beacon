name: chain-gitea-repo-exfil
description: >
  Exploit chain: Gitea unauthenticated API → repository enumeration → data exfil.
  Gitea in default configuration exposes repositories and API endpoints
  without authentication.
tags: [chain, postexploit, gitea, data-exfil, authorized]

services:
  gitea:
    image: gitea/gitea:1.19
    ports: ["9413:3000"]
    environment:
      - GITEA__security__INSTALL_LOCK=true
      - GITEA__server__ROOT_URL=http://localhost:3000

ready:
  cmd: "curl -sf http://localhost:9413/api/v1/version | grep -q version"
  timeout: 60s
  interval: 3s

assertions:
  - name: detects-gitea-service
    type: beacon
    target: "localhost:9413"
    args: ["--no-enrich", "--no-nmap", "--scanners", "portscan", "--ports", "9413"]
    expect:
      check_id: port.service_identified

  - name: chain-exploits-gitea-unauth
    type: beacon
    target: "localhost:9413"
    args: ["--no-enrich", "--no-nmap", "--scanners", "portscan", "--authorized", "--deep", "--permission-confirmed", "--ports", "9413"]
    expect:
      check_id: exposure.cicd_panel

timeout: 10m
