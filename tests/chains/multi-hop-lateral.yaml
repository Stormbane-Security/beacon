name: chain-multi-hop-lateral
description: >
  Multi-hop exploit chain: unauthenticated Consul → discover Redis + MongoDB →
  harvest credentials from Redis → extract data from MongoDB.
tags: [chain, postexploit, multi-hop, lateral-movement, consul, redis, mongodb, authorized]

services:
  consul:
    image: hashicorp/consul:1.18
    ports: ["9407:8500"]
    command: ["agent", "-dev", "-client", "0.0.0.0"]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--protected-mode", "no"]
    expose: ["6379"]

  mongodb:
    image: mongo:7.0
    expose: ["27017"]

  seed:
    image: hashicorp/consul:1.18
    depends_on: [consul, redis, mongodb]
    restart: "no"
    entrypoint: ["sh", "-c"]
    command:
      - |
        sleep 5
        curl -sf -X PUT http://consul:8500/v1/agent/service/register -d '{"Name":"redis-cache","Port":6379,"Address":"redis"}'
        curl -sf -X PUT http://consul:8500/v1/agent/service/register -d '{"Name":"user-db","Port":27017,"Address":"mongodb"}'
        consul kv put -http-addr=http://consul:8500 config/mongodb/connection 'mongodb://mongodb:27017/production'
        consul kv put -http-addr=http://consul:8500 secrets/api/master-key 'mk_prod_a1b2c3d4e5f6'

  seed-redis:
    image: redis:7-alpine
    depends_on: [redis]
    restart: "no"
    entrypoint: ["sh", "-c"]
    command:
      - |
        sleep 4
        redis-cli -h redis SET session:admin '{"uid":1,"role":"superadmin","token":"eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9"}'
        redis-cli -h redis SET config:db_password 'MongoSecretPass!789'

  seed-mongo:
    image: mongo:7.0
    depends_on: [mongodb]
    restart: "no"
    entrypoint: ["sh", "-c"]
    command:
      - |
        sleep 6
        mongosh --host mongodb --eval '
          db = db.getSiblingDB("production");
          db.customers.insertMany([
            {name:"Charlie Brown",email:"charlie@example.com",ssn:"222-33-4444",card:"4532015112830366"},
            {name:"Diana Prince",email:"diana@example.com",ssn:"555-66-7777",card:"6011514433546201"}
          ]);
        '

ready:
  cmd: "curl -sf http://localhost:9407/v1/catalog/services | grep -q redis-cache"
  timeout: 60s
  interval: 3s

assertions:
  - name: detects-consul-entry-point
    type: beacon
    target: "localhost:9407"
    args: ["--no-enrich", "--scanners", "portscan", "--ports", "9407"]
    expect:
      check_id: port.consul_no_acl

  - name: chain-discovers-internal-topology
    type: beacon
    target: "localhost:9407"
    args: ["--no-enrich", "--scanners", "portscan", "--authorized", "--deep", "--permission-confirmed", "--ports", "9407"]
    expect:
      check_id: exploit.internal_network_discovered

  - name: chain-harvests-credentials
    type: beacon
    target: "localhost:9407"
    args: ["--no-enrich", "--scanners", "portscan", "--authorized", "--deep", "--permission-confirmed", "--ports", "9407"]
    expect:
      check_id: exploit.credential_harvest

  - name: chain-extracts-data
    type: beacon
    target: "localhost:9407"
    args: ["--no-enrich", "--scanners", "portscan", "--authorized", "--deep", "--permission-confirmed", "--ports", "9407"]
    expect:
      check_id: exploit.data_extracted

timeout: 10m
