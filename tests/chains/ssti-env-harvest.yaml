name: chain-ssti-env-harvest
description: >
  Exploit chain: SSTI in Jinja2 template → code execution →
  environment variable credential harvest. The SSTI scanner confirms
  code execution, then the post-exploit module harvests credentials
  from environment variables in the container.
tags: [chain, postexploit, ssti, credential-harvest, authorized]

services:
  ssti-app:
    build:
      context: ./ssti-env
      dockerfile: Dockerfile
    ports: ["0:8080"]
    environment:
      DATABASE_PASSWORD: "ProdDBPass!Secret123"
      AWS_ACCESS_KEY_ID: "AKIAIOSFODNN7EXAMPLE"
      AWS_SECRET_ACCESS_KEY: "wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY"
      API_TOKEN: "tok_live_abc123def456"
      REDIS_AUTH: "RedisAuthToken!789"

ready:
  cmd: "curl -sf http://localhost:${fixture.ssti-app.port}/"
  timeout: 30s
  interval: 2s

assertions:
  # Verify SSTI works
  - name: exploit-ssti-code-execution
    type: command
    expect:
      command: "curl -sf 'http://localhost:${fixture.ssti-app.port}/greet?name={{7*7}}' | grep -q 49"
      exit_code: 0

  # Beacon detects SSTI
  - name: detects-ssti
    type: beacon
    target: "localhost:${fixture.ssti-app.port}"
    args: ["--no-enrich", "--scanners", "ssti", "--authorized", "--ports", "${fixture.ssti-app.port}"]
    expect:
      check_id: web.ssti

  # Post-exploit: credential harvest from environment
  - name: chain-harvests-env-credentials
    type: beacon
    target: "localhost:${fixture.ssti-app.port}"
    args: ["--no-enrich", "--authorized", "--ports", "${fixture.ssti-app.port}"]
    expect:
      check_id: exploit.credential_harvest

timeout: 5m
