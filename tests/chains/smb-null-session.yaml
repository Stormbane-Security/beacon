name: chain-smb-null-session
description: >
  Exploit chain: Samba with guest access → null session share enumeration →
  share listing. ProbeDirect uses smbclient when available on the host.
  Falls back to port identification if smbclient is not installed.
tags: [chain, postexploit, smb, data-extraction, authorized]

services:
  smb:
    image: dperson/samba:latest
    ports: ["9430:445"]
    command: ["-p", "-s", "public;/share;yes;no;yes;all;none;;public share", "-u", "guest;guest"]

ready:
  cmd: "nc -z localhost 9430 2>/dev/null"
  timeout: 30s
  interval: 3s

assertions:
  - name: smb-null-session-share-list
    type: command
    expect:
      command: "smbclient -L localhost -p 9430 -N 2>/dev/null | grep -qi share"
      exit_code: 0

  - name: chain-detects-smb
    type: beacon
    target: "localhost:9430"
    args: ["--no-enrich", "--scanners", "portscan", "--authorized", "--deep", "--permission-confirmed", "--ports", "9430"]
    expect:
      check_id: exploit.data_extracted

timeout: 5m
