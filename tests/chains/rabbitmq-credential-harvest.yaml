name: chain-rabbitmq-credential-harvest
description: >
  Exploit chain: RabbitMQ default credentials → management API → credential harvest.
tags: [chain, postexploit, rabbitmq, credential-harvest, authorized]

services:
  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "9413:5672"
      - "9414:15672"
    environment:
      RABBITMQ_DEFAULT_USER: "guest"
      RABBITMQ_DEFAULT_PASS: "guest"

  seed:
    image: curlimages/curl:latest
    depends_on: [rabbitmq]
    restart: "no"
    entrypoint: ["sh", "-c"]
    command:
      - |
        sleep 15
        curl -sf -u guest:guest -X PUT \
          http://rabbitmq:15672/api/queues/%2F/config-updates \
          -H 'Content-Type: application/json' \
          -d '{"auto_delete":false,"durable":true}'
        curl -sf -u guest:guest -X POST \
          http://rabbitmq:15672/api/exchanges/%2F/amq.default/publish \
          -H 'Content-Type: application/json' \
          -d '{"properties":{},"routing_key":"config-updates","payload":"{\"db_host\":\"10.0.0.5\",\"db_pass\":\"ProdDbPass!Secret\",\"api_key\":\"ak_prod_x1y2z3\"}","payload_encoding":"string"}'

ready:
  cmd: "curl -sf -u guest:guest http://localhost:9414/api/overview | grep -q rabbitmq_version"
  timeout: 60s
  interval: 3s

assertions:
  - name: exploit-rabbitmq-default-creds
    type: command
    expect:
      command: "curl -sf -u guest:guest http://localhost:9414/api/users | grep -q guest"
      exit_code: 0

  - name: detects-rabbitmq-default-creds
    type: beacon
    target: "localhost:9414"
    args: ["--no-enrich", "--no-nmap", "--scanners", "portscan", "--ports", "9414"]
    expect:
      check_id: port.rabbitmq_default_creds

  - name: chain-harvests-credentials
    type: beacon
    target: "localhost:9414"
    args: ["--no-enrich", "--no-nmap", "--scanners", "portscan", "--authorized", "--deep", "--permission-confirmed", "--ports", "9413,9414"]
    expect:
      check_id: port.rabbitmq_default_creds

timeout: 10m
