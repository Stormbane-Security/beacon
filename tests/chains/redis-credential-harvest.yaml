name: chain-redis-credential-harvest
description: >
  Exploit chain: unauthenticated Redis → credential harvest → data extraction.
  Redis stores database credentials and session tokens in keys. The post-exploit
  chain discovers these credentials, classifies them, and reports data extraction.
tags: [chain, postexploit, redis, credential-harvest, authorized]

services:
  redis:
    image: redis:7-alpine
    ports: ["9400:6379"]
    command: ["redis-server", "--protected-mode", "no"]

  seed:
    image: redis:7-alpine
    depends_on: [redis]
    restart: "no"
    entrypoint: ["sh", "-c"]
    command:
      - |
        sleep 2
        redis-cli -h redis SET db_password 'P@ssw0rd!SuperSecret123'
        redis-cli -h redis SET aws_access_key 'AKIAIOSFODNN7EXAMPLE'
        redis-cli -h redis SET aws_secret_key 'wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY'
        redis-cli -h redis SET session:admin '{"user":"admin","role":"superuser","token":"eyJhbGciOiJIUzI1NiJ9.dGVzdA.abc123"}'
        redis-cli -h redis SET internal_api_url 'http://10.0.0.5:8080/api/v1'
        redis-cli -h redis SET stripe_key 'sk_live_abc123def456ghi789'

ready:
  cmd: "redis-cli -h localhost -p 9400 GET db_password | grep -q P@ssw0rd"
  timeout: 30s
  interval: 2s

assertions:
  - name: exploit-redis-keys-readable
    type: command
    expect:
      command: "redis-cli -h localhost -p 9400 KEYS '*' | wc -l | grep -q '[3-9]'"
      exit_code: 0

  - name: exploit-aws-creds-extractable
    type: command
    expect:
      command: "redis-cli -h localhost -p 9400 GET aws_access_key | grep -q AKIA"
      exit_code: 0

  - name: detects-redis-no-auth
    type: beacon
    target: "localhost:9400"
    args: ["--no-enrich", "--scanners", "portscan", "--ports", "9400"]
    expect:
      check_id: port.redis_unauthenticated

  - name: chain-harvests-credentials-and-data
    type: beacon
    target: "localhost:9400"
    args: ["--no-enrich", "--scanners", "portscan", "--authorized", "--deep", "--permission-confirmed", "--ports", "9400"]
    expect:
      check_id: exploit.credential_harvest

timeout: 10m
