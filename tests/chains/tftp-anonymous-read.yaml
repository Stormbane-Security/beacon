name: chain-tftp-anonymous-read
description: >
  Exploit chain: TFTP server with anonymous read access → file retrieval.
  TFTP has no authentication — any client can read/write files.
  Uses a standard TFTP server image with a test file seeded.
tags: [chain, postexploit, tftp, data-extraction, authorized]

services:
  tftp:
    image: pghalliday/tftp
    ports: ["9431:69/udp"]

ready:
  cmd: "echo 'test' | nc -u -w1 localhost 9431; sleep 1"
  timeout: 20s
  interval: 3s

assertions:
  # TFTP responds to read requests (even with an error for missing file).
  - name: tftp-responds-to-rrq
    type: command
    expect:
      command: |
        python3 -c "
        import socket, struct
        s = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
        s.settimeout(3)
        pkt = struct.pack('!H', 1) + b'missing\x00octet\x00'
        s.sendto(pkt, ('127.0.0.1', 9431))
        data, _ = s.recvfrom(516)
        opcode = struct.unpack('!H', data[:2])[0]
        print(f'opcode={opcode}')
        assert opcode in (3, 5), f'unexpected opcode {opcode}'
        " 2>&1
      exit_code: 0

timeout: 5m
