name: rabbitmq-default-creds
description: "RabbitMQ management API accepts default guest:guest credentials"
tags: [rabbitmq, messaging, credentials, port]

services:
  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5673:5672"
      - "15673:15672"

ready:
  cmd: "curl -sf -u guest:guest http://localhost:15673/api/overview >/dev/null"
  timeout: 90s
  interval: 5s

assertions:
  - name: exploit-rabbitmq-default-login
    type: command
    expect:
      command: "curl -sf -u guest:guest http://localhost:15673/api/whoami | grep -q guest"
      exit_code: 0

  - name: exploit-rabbitmq-list-queues
    type: command
    expect:
      command: "curl -sf -u guest:guest http://localhost:15673/api/overview | grep -q rabbitmq_version"
      exit_code: 0

  - name: detects-rabbitmq-default-creds
    type: beacon
    target: localhost:15673
    args: ["--no-enrich", "--scanners", "portscan", "--ports", "15672"]
    expect:
      check_id: port.rabbitmq_default_creds

timeout: 5m
