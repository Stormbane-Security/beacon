name: mongodb-no-auth
description: "MongoDB 7 with no authentication exposes unauthenticated database access"
tags: [mongodb, database, portscan]

services:
  mongodb:
    image: mongo:7
    ports: ["9108:27017"]
    command: ["mongod", "--bind_ip_all"]

ready:
  cmd: "mongosh --host localhost --port 9108 --eval 'db.runCommand({ping:1})' --quiet"
  timeout: 30s
  interval: 2s

assertions:
  - name: detects-exposed-mongodb
    type: beacon
    target: localhost:9108
    args: ["--scanners", "portscan"]
    expect:
      check_id: port.database_exposed

timeout: 5m
