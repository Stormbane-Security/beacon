name: mariadb-with-password
description: >
  MariaDB with root password set. Should detect database_exposed (HIGH)
  but NOT mysql_no_auth (CRITICAL). Catches the false positive where
  probeMySQL returned true based on greeting alone, emitting no-auth
  finding even though auth is required.
tags: [database, mariadb, regression]

services:
  mariadb:
    image: mariadb:11
    ports: ["43306:3306"]
    environment:
      MARIADB_ROOT_PASSWORD: strongpassword

ready:
  cmd: "sleep 15 && nc -z localhost 43306"
  timeout: 90s
  interval: 5s

assertions:
  - name: detects-database-exposed
    type: beacon
    target: localhost:43306
    args: ["--no-enrich", "--no-nmap", "--no-nuclei", "--ports", "43306", "--verbose"]
    expect:
      min_findings: 1
      has_check_id: "port.database_exposed"

  - name: no-false-no-auth
    type: beacon
    target: localhost:43306
    args: ["--no-enrich", "--no-nmap", "--no-nuclei", "--ports", "43306", "--verbose"]
    expect:
      no_check_id: "port.mysql_no_auth"

timeout: 5m
