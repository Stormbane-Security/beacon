name: mysql-no-auth
description: "MySQL root login with empty password — beacon detects unauthenticated database"
tags: [mysql, database, credentials, port]

services:
  mysql:
    image: mysql:8.0
    ports: ["3307:3306"]
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_ROOT_HOST: "%"

ready:
  cmd: "nc -z localhost 3307"
  timeout: 90s
  interval: 5s

assertions:
  - name: detects-mysql-no-auth
    type: beacon
    target: localhost:3307
    args: ["--no-enrich", "--no-nmap", "--scanners", "portscan", "--ports", "3307"]
    expect:
      min_findings: 0

timeout: 5m
