name: mysql-no-auth
description: "MySQL root login with empty password — beacon detects unauthenticated database"
tags: [mysql, database, credentials, port]

services:
  mysql:
    image: mysql:8.0
    ports: ["3307:3306"]
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_ROOT_HOST: "%"

ready:
  container: mysql
  cmd: "mysqladmin -u root status"
  timeout: 90s
  interval: 5s

assertions:
  - name: exploit-mysql-noauth-query
    type: command
    expect:
      command: "mysql -h 127.0.0.1 -P 3307 -u root --skip-password -e 'SELECT current_user();' 2>/dev/null | grep -q root || nc -z -w 3 localhost 3307"
      exit_code: 0

  - name: detects-mysql-no-auth
    type: beacon
    target: localhost:3307
    args: ["--no-enrich", "--no-nmap", "--scanners", "portscan", "--ports", "3306"]
    expect:
      check_id: port.mysql_no_auth

timeout: 5m
