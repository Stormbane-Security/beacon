name: couchdb-no-auth
description: "CouchDB 3 with no authentication allows unauthenticated access to all databases"
tags: [couchdb, database, nosql]

services:
  couchdb:
    image: couchdb:3
    ports: ["5984:5984"]
    environment:
      COUCHDB_USER: admin
      COUCHDB_PASSWORD: admin

ready:
  cmd: "curl -sf http://localhost:5984/ | grep -q couchdb"
  timeout: 60s
  interval: 3s

assertions:
  - name: detects-couchdb-exposed
    type: beacon
    target: localhost:5984
    args: ["--no-enrich", "--no-nmap", "--scanners", "portscan", "--ports", "5984"]
    expect:
      check_id: port.database_exposed

timeout: 5m
