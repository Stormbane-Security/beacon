name: couchdb-no-auth
description: "CouchDB 3 with no authentication allows unauthenticated access to all databases"
tags: [couchdb, database, nosql]

services:
  couchdb:
    image: couchdb:3
    ports: ["5984:5984"]
    environment:
      COUCHDB_USER: admin
      COUCHDB_PASSWORD: admin

ready:
  cmd: "curl -sf http://localhost:5984/ | grep -q couchdb"
  timeout: 60s
  interval: 3s

assertions:
  - name: exploit-couchdb-list-dbs
    type: command
    expect:
      command: "curl -sf http://admin:admin@localhost:5984/_all_dbs | grep -q '_users'"
      exit_code: 0

  - name: exploit-couchdb-server-info
    type: command
    expect:
      command: "curl -sf http://localhost:5984/ | grep -q couchdb"
      exit_code: 0

  - name: classifies-as-couchdb
    type: classify
    target: localhost:5984
    expect:
      backend_service: CouchDB

  - name: detects-unauthenticated-couchdb
    type: beacon
    target: localhost:5984
    args: ["--no-enrich", "--no-nmap", "--scanners", "portscan", "--ports", "5984"]
    expect:
      check_id: port.couchdb_unauthenticated

timeout: 5m
