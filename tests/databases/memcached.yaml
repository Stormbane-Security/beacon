name: memcached-no-auth
description: "Memcached 1 with no authentication exposes unauthenticated cache access"
tags: [memcached, database, portscan]

services:
  memcached:
    image: memcached:1-alpine
    ports: ["11211:11211"]

ready:
  cmd: "echo stats | nc -w 1 localhost 11211 | grep -q pid"
  timeout: 30s
  interval: 2s

assertions:
  - name: exploit-memcached-stats
    type: command
    expect:
      command: "echo 'stats' | nc -w 2 localhost 11211 | grep -q 'STAT pid'"
      exit_code: 0

  - name: exploit-memcached-set-get
    type: command
    expect:
      command: "printf 'set drydock 0 60 6\\r\\npwned!\\r\\nget drydock\\r\\nquit\\r\\n' | nc -w 2 localhost 11211 | grep -q pwned"
      exit_code: 0

  - name: detects-unauthenticated-memcached
    type: beacon
    target: localhost:11211
    args: ["--no-enrich", "--scanners", "portscan", "--ports", "11211"]
    expect:
      check_id: port.memcached_unauthenticated

timeout: 5m
