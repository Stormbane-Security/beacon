name: postgresql-trust
description: "PostgreSQL trust authentication — connects as postgres with no password"
tags: [postgresql, database, credentials, port]

services:
  postgres:
    image: postgres:16-alpine
    ports: ["5433:5432"]
    environment:
      POSTGRES_HOST_AUTH_METHOD: "trust"

ready:
  container: postgres
  cmd: "pg_isready -U postgres"
  timeout: 30s
  interval: 2s

assertions:
  - name: detects-postgresql-trust
    type: beacon
    target: postgres:5432
    args: ["--no-enrich", "--scanners", "portscan", "--ports", "5432"]
    expect:
      check_id: port.postgresql_trust

timeout: 5m
