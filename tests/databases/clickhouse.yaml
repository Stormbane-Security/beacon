name: clickhouse-exposed
description: "ClickHouse analytics DB with HTTP interface exposed without authentication"
tags: [clickhouse, database, analytics]

services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    ports: ["8123:8123"]

ready:
  cmd: "curl -sf http://localhost:8123/ | grep -q Ok"
  timeout: 60s
  interval: 3s

assertions:
  - name: detects-clickhouse-exposed
    type: beacon
    target: localhost:8123
    args: ["--no-enrich", "--no-nmap", "--scanners", "portscan", "--ports", "8123"]
    expect:
      check_id: port.clickhouse_exposed

timeout: 5m
