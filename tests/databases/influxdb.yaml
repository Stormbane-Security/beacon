name: influxdb-exposed
description: "InfluxDB 2.7 with no authentication exposes time-series data"
tags: [influxdb, database, timeseries]

services:
  influxdb:
    image: influxdb:2.7-alpine
    ports: ["8086:8086"]
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: password123
      DOCKER_INFLUXDB_INIT_ORG: test
      DOCKER_INFLUXDB_INIT_BUCKET: default

ready:
  cmd: "curl -sf http://localhost:8086/health | grep -q pass"
  timeout: 60s
  interval: 3s

assertions:
  - name: classifies-as-influxdb
    type: classify
    target: localhost:8086
    expect:
      path_responds: /health

  - name: detects-influxdb-exposed
    type: beacon
    target: localhost:8086
    args: ["--no-enrich", "--scanners", "portscan", "--ports", "8086"]
    expect:
      check_id: port.influxdb_exposed

timeout: 5m
