name: consul-dev-mode
description: "HashiCorp Consul 1.18 in dev mode with no ACLs exposes service catalog"
tags: [consul, infrastructure, service-discovery]

services:
  consul:
    image: hashicorp/consul:1.18
    ports: ["9216:8500"]
    command: ["agent", "-dev", "-client=0.0.0.0"]

ready:
  cmd: "curl -sf http://localhost:9216/v1/status/leader >/dev/null"
  timeout: 60s
  interval: 2s

assertions:
  - name: classifies-as-consul
    type: classify
    target: localhost:9216
    expect:
      technology: Consul

  - name: detects-consul-no-acl
    type: beacon
    target: localhost:9216
    args: ["--scanners", "portscan"]
    expect:
      check_id: port.consul_no_acl

timeout: 5m
