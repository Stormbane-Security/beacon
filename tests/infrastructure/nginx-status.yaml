name: nginx-status-exposed
description: "nginx with stub_status module enabled on public-facing endpoint"
tags: [nginx, gateway, proxy]

services:
  nginx:
    image: nginx:alpine
    ports: ["9143:80"]
    volumes:
      - ./nginx-status/nginx.conf:/etc/nginx/conf.d/default.conf:ro

ready:
  cmd: "curl -sf http://localhost:9143/ >/dev/null"
  timeout: 30s
  interval: 2s

assertions:
  - name: detects-nginx-status-exposed
    type: beacon
    target: localhost:9143
    args: ["--scanners", "gateway"]
    expect:
      check_id: gateway.nginx_status_exposed

timeout: 5m
