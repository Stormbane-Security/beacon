name: nginx-status-exposed
description: "nginx with stub_status module enabled on public-facing endpoint"
tags: [nginx, gateway, proxy]

services:
  nginx:
    image: nginx:alpine
    ports: ["80:80"]
    volumes:
      - ./nginx-status/nginx.conf:/etc/nginx/conf.d/default.conf:ro

ready:
  cmd: "curl -sf http://localhost:80/ >/dev/null"
  timeout: 30s
  interval: 2s

assertions:
  - name: exploit-nginx-stub-status-readable
    type: command
    expect:
      command: "curl -sf http://localhost:80/nginx_status | grep -q 'Active connections'"
      exit_code: 0

  - name: detects-nginx-status-exposed
    type: beacon
    target: localhost:80
    args: ["--no-enrich", "--scanners", "gateway"]
    expect:
      check_id: gateway.nginx_status_exposed

timeout: 5m
