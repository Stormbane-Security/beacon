name: wordpress-detection
description: "Static mock of WordPress site — should detect CMS, version, wp-login, wp-admin"
tags: [vulnerable, wordpress, cms]

services:
  nginx:
    image: nginx:alpine
    ports: ["80:80"]
    volumes:
      - ./wordpress-detection/html:/usr/share/nginx/html:ro
      - ./wordpress-detection/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

ready:
  cmd: "curl -sf http://localhost:80/ >/dev/null"
  timeout: 30s
  interval: 2s

assertions:
  - name: detects-wordpress-cms
    type: beacon
    target: localhost:80
    args: ["--no-enrich", "--no-nmap", "--no-nuclei", "--ports", "80", "--verbose"]
    expect:
      min_findings: 1

timeout: 5m
