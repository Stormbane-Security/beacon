name: nginx-directory-listing
description: "Nginx with autoindex on — directory listing enabled"
tags: [vulnerable, nginx, directory-listing]

services:
  nginx:
    image: nginx:alpine
    ports: ["80:80"]
    volumes:
      - ./nginx-directory-listing/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx-directory-listing/files:/usr/share/nginx/html/files:ro

ready:
  cmd: "curl -sf http://localhost:80/ >/dev/null"
  timeout: 30s
  interval: 2s

assertions:
  - name: detects-directory-listing
    type: beacon
    target: localhost:80
    args: ["--no-enrich", "--no-nmap", "--no-nuclei", "--ports", "80", "--verbose"]
    expect:
      min_findings: 1

timeout: 5m
