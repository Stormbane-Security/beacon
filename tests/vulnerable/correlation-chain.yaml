name: correlation-chain-fires
description: >
  Server with missing HSTS + insecure cookies + missing CSP. The correlation
  engine should combine these into a session hijack chain finding.
tags: [vulnerable, correlation, chain, regression]

services:
  nginx:
    image: nginx:alpine
    ports: ["80:80"]
    volumes:
      - ./correlation-chain/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

ready:
  cmd: "curl -sf http://localhost:80/ >/dev/null"
  timeout: 30s
  interval: 2s

assertions:
  - name: detects-insecure-cookie
    type: beacon
    target: localhost:80
    args: ["--no-enrich", "--no-nmap", "--no-nuclei", "--ports", "80", "--verbose"]
    expect:
      min_findings: 3

  - name: detects-missing-headers
    type: beacon
    target: localhost:80
    args: ["--no-enrich", "--no-nmap", "--no-nuclei", "--scanners", "secheaders", "--ports", "80", "--verbose"]
    expect:
      has_check_id: "headers.missing_hsts"

timeout: 5m
