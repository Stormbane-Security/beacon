name: etcd-unauthenticated
description: "etcd v3 with no auth — should detect exposed API + version"
tags: [vulnerable, etcd, database]

services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.17
    ports: ["2379:2379"]
    command: ["/usr/local/bin/etcd", "--listen-client-urls", "http://0.0.0.0:2379", "--advertise-client-urls", "http://0.0.0.0:2379"]

ready:
  cmd: "curl -sf http://localhost:2379/version >/dev/null"
  timeout: 30s
  interval: 2s

assertions:
  - name: detects-etcd-exposed
    type: beacon
    target: localhost:2379
    args: ["--no-enrich", "--no-nmap", "--no-nuclei", "--ports", "2379", "--verbose"]
    expect:
      min_findings: 1
      has_check_id: "port.etcd_exposed"

timeout: 5m
