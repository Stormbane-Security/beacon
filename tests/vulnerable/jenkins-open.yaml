name: jenkins-unauthenticated
description: "Jenkins with no authentication — script console accessible"
tags: [vulnerable, jenkins, cicd]

services:
  jenkins:
    image: jenkins/jenkins:lts-jdk11
    ports: ["8080:8080"]
    environment:
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=false"

ready:
  cmd: "curl -sf http://localhost:8080/login >/dev/null || curl -sf http://localhost:8080/ >/dev/null"
  timeout: 120s
  interval: 5s

assertions:
  - name: detects-jenkins
    type: beacon
    target: localhost:8080
    args: ["--no-enrich", "--no-nmap", "--no-nuclei", "--ports", "8080", "--verbose"]
    expect:
      min_findings: 1

timeout: 10m
