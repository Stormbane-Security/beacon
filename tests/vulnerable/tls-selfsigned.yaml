name: tls-selfsigned-weak-ciphers
description: "HTTPS with self-signed cert, TLSv1.0/1.1 enabled, weak ciphers"
tags: [vulnerable, tls, certificate]

services:
  nginx:
    image: nginx:alpine
    ports: ["443:443"]
    volumes:
      - ./tls-selfsigned/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./tls-selfsigned/certs:/etc/nginx/certs:ro

ready:
  cmd: "curl -sk https://localhost:443/ >/dev/null"
  timeout: 30s
  interval: 2s

assertions:
  - name: detects-tls-issues
    type: beacon
    target: localhost:443
    args: ["--no-enrich", "--no-nmap", "--no-nuclei", "--ports", "443", "--verbose"]
    expect:
      min_findings: 1

timeout: 5m
