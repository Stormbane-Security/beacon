name: error-disclosure-stack-trace
description: "Server leaking Java stack trace in error responses"
tags: [vulnerable, error, disclosure, stack-trace]

services:
  nginx:
    image: nginx:alpine
    ports: ["80:80"]
    volumes:
      - ./error-disclosure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

ready:
  cmd: "curl -sf http://localhost:80/ >/dev/null"
  timeout: 30s
  interval: 2s

assertions:
  - name: detects-error-info
    type: beacon
    target: localhost:80
    args: ["--no-enrich", "--no-nmap", "--no-nuclei", "--ports", "80", "--verbose"]
    expect:
      min_findings: 1

timeout: 5m
