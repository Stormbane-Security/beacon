name: cors-origin-reflection
description: "Server reflects Origin header in Access-Control-Allow-Origin with credentials — worse than wildcard"
tags: [vulnerable, cors, misconfiguration]

services:
  nginx:
    image: nginx:alpine
    ports: ["80:80"]
    volumes:
      - ./cors-reflection/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

ready:
  cmd: "curl -sf http://localhost:80/ >/dev/null"
  timeout: 30s
  interval: 2s

assertions:
  - name: detects-cors-reflection
    type: beacon
    target: localhost:80
    args: ["--no-enrich", "--no-nmap", "--no-nuclei", "--scanners", "cors", "--ports", "80", "--verbose"]
    expect:
      min_findings: 1

timeout: 5m
