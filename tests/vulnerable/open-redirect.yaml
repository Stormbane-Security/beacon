name: open-redirect
description: "Server with open redirect via ?url= parameter"
tags: [vulnerable, redirect, owasp]

services:
  nginx:
    image: nginx:alpine
    ports: ["80:80"]
    volumes:
      - ./open-redirect/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

ready:
  cmd: "curl -sf http://localhost:80/ >/dev/null"
  timeout: 30s
  interval: 2s

assertions:
  - name: detects-open-redirect
    type: beacon
    target: localhost:80
    args: ["--no-enrich", "--no-nmap", "--no-nuclei", "--ports", "80", "--verbose"]
    expect:
      min_findings: 1

timeout: 5m
