name: ssh-weak-config
description: "OpenSSH with weak ciphers and MACs — should detect weak crypto"
tags: [vulnerable, ssh, crypto]

services:
  ssh:
    image: linuxserver/openssh-server:latest
    ports: ["2222:2222"]
    environment:
      PUID: 1000
      PGID: 1000
      PASSWORD_ACCESS: "true"
      USER_PASSWORD: password123
      USER_NAME: testuser

ready:
  cmd: "nc -z localhost 2222"
  timeout: 60s
  interval: 3s

assertions:
  - name: detects-ssh-service
    type: beacon
    target: localhost:2222
    args: ["--no-enrich", "--no-nmap", "--no-nuclei", "--ports", "2222", "--verbose"]
    expect:
      min_findings: 1
      has_check_id: "port.ssh_exposed"

timeout: 5m
