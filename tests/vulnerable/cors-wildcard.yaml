name: cors-wildcard-with-creds
description: "Server with Access-Control-Allow-Origin: * and Allow-Credentials: true"
tags: [vulnerable, cors, misconfiguration]

services:
  nginx:
    image: nginx:alpine
    ports: ["80:80"]
    volumes:
      - ./cors-wildcard/nginx.conf:/etc/nginx/conf.d/default.conf:ro

ready:
  cmd: "curl -sf http://localhost:80/ >/dev/null"
  timeout: 30s
  interval: 2s

assertions:
  - name: detects-cors-misconfig
    type: beacon
    target: localhost:80
    args: ["--no-enrich", "--no-nmap", "--no-nuclei", "--scanners", "cors", "--ports", "80", "--verbose"]
    expect:
      min_findings: 1

timeout: 5m
