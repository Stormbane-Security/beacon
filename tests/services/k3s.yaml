name: k3s-api-exposed
description: "K3s lightweight Kubernetes with API server exposed — beacon detects K8s API"
tags: [kubernetes, k3s, api, portscan]

services:
  k3s:
    image: rancher/k3s:v1.28.4-k3s1
    command: ["server", "--disable=traefik,servicelb,metrics-server"]
    ports: ["9283:6443"]
    cap_add: [SYS_ADMIN, NET_ADMIN]
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    environment:
      K3S_KUBECONFIG_MODE: "644"

ready:
  cmd: "curl -kf https://localhost:9283/readyz >/dev/null 2>&1 || curl -kf https://localhost:9283/version >/dev/null 2>&1"
  timeout: 120s
  interval: 5s

assertions:
  - name: exploit-k8s-version
    type: command
    expect:
      command: "curl -sfk https://localhost:9283/version | grep -q gitVersion"
      exit_code: 0

  - name: exploit-k8s-api-accessible
    type: command
    expect:
      command: "curl -sfk -o /dev/null -w '%{http_code}' https://localhost:9283/api | grep -qE '(200|401|403)'"
      exit_code: 0

  - name: detects-k8s-api-exposed
    type: beacon
    target: k3s:6443
    args: ["--no-enrich", "--scanners", "portscan", "--ports", "6443"]
    expect:
      check_id: port.k8s_api_exposed

timeout: 10m
