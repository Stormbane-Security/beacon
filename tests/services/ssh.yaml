name: ssh-exposed
description: "OpenSSH server exposed — beacon detects SSH service on port 22"
tags: [ssh, port, remote-access]

services:
  ssh:
    image: linuxserver/openssh-server:latest
    ports: ["2222:2222"]
    environment:
      PUID: "1000"
      PGID: "1000"
      PASSWORD_ACCESS: "true"
      USER_PASSWORD: "testpassword"
      USER_NAME: "testuser"

ready:
  cmd: "nc -z localhost 2222"
  timeout: 60s
  interval: 3s

assertions:
  - name: exploit-ssh-banner-grab
    type: command
    expect:
      command: "echo '' | nc -w 3 localhost 2222 | grep -qi 'SSH'"
      exit_code: 0

  - name: detects-ssh-exposed
    type: beacon
    target: localhost:2222
    args: ["--no-enrich", "--scanners", "portscan", "--ports", "2222"]
    expect:
      check_id: port.ssh_exposed

timeout: 5m
