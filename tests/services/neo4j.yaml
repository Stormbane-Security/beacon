name: neo4j-exposed
description: "Neo4j graph database HTTP API exposed without authentication"
tags: [neo4j, database, port]

services:
  neo4j:
    image: neo4j:5-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: "none"

ready:
  cmd: "curl -sf http://localhost:7474 >/dev/null"
  timeout: 90s
  interval: 3s

assertions:
  - name: exploit-neo4j-cypher-query
    type: command
    expect:
      command: "curl -sf -X POST http://localhost:7474/db/neo4j/tx/commit -H 'Content-Type: application/json' -d '{\"statements\":[{\"statement\":\"RETURN 1 AS pwned\"}]}' | grep -q pwned"
      exit_code: 0

  - name: detects-neo4j-exposed
    type: beacon
    target: localhost:7687
    args: ["--no-enrich", "--scanners", "portscan", "--ports", "7474"]
    expect:
      check_id: port.neo4j_exposed

timeout: 5m
