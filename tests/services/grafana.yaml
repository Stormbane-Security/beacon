name: grafana-anonymous-access
description: "Grafana 10.4.0 with anonymous access enabled exposes monitoring panel"
tags: [grafana, service, monitoring]

services:
  grafana:
    image: grafana/grafana:10.4.0
    ports: ["9103:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_SECURITY_ADMIN_PASSWORD: admin

ready:
  cmd: "curl -sf http://localhost:9103/api/health >/dev/null"
  timeout: 60s
  interval: 2s

assertions:
  - name: classifies-as-grafana
    type: classify
    target: localhost:9103
    expect:
      technology: Grafana

  - name: detects-monitoring-panel
    type: beacon
    target: localhost:9103
    expect:
      check_id: exposure.monitoring_panel

timeout: 5m
