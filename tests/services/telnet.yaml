name: telnet-exposed
description: "Telnet server exposed — beacon detects plaintext remote access"
tags: [telnet, port, remote-access]

services:
  telnet:
    image: alpine:3.19
    ports: ["23:23"]
    command: ["sh", "-c", "apk add --no-cache busybox-extras && busybox telnetd -F -l /bin/sh -p 23"]

ready:
  cmd: "nc -z localhost 23"
  timeout: 60s
  interval: 3s

assertions:
  - name: detects-telnet-exposed
    type: beacon
    target: telnet:23
    args: ["--no-enrich", "--scanners", "portscan", "--ports", "23"]
    expect:
      check_id: port.telnet_exposed

timeout: 5m
