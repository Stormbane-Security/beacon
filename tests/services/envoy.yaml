name: envoy-admin-exposed
description: "Envoy proxy with admin interface exposed on public port"
tags: [envoy, gateway, proxy]

services:
  envoy:
    image: envoyproxy/envoy:v1.29-latest
    ports: ["9901:9901"]
    command: ["envoy", "-c", "/etc/envoy/envoy.yaml"]
    volumes:
      - ./envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro

ready:
  cmd: "curl -sf http://localhost:9901/server_info >/dev/null"
  timeout: 30s
  interval: 2s

assertions:
  - name: exploit-envoy-server-info
    type: command
    expect:
      command: "curl -sf http://localhost:9901/server_info | grep -qE '(version|state)'"
      exit_code: 0

  - name: exploit-envoy-clusters
    type: command
    expect:
      command: "curl -sf http://localhost:9901/clusters | grep -qE '(cluster|cx_active)'"
      exit_code: 0

  - name: classifies-as-envoy
    type: classify
    target: localhost:9901
    expect:
      proxy_type: envoy

  - name: detects-envoy-admin-exposed
    type: beacon
    target: localhost:9901
    args: ["--no-enrich", "--no-nmap", "--scanners", "gateway"]
    expect:
      check_id: gateway.envoy_admin_exposed

timeout: 5m
