name: netdata-exposed
description: "Netdata monitoring dashboard exposed without authentication"
tags: [netdata, monitoring, dashboard]

services:
  netdata:
    image: netdata/netdata:stable
    ports: ["9131:19999"]
    cap_add:
      - SYS_PTRACE
    security_opt:
      - apparmor:unconfined

ready:
  cmd: "curl -sf http://localhost:9131/api/v1/info | grep -q version"
  timeout: 60s
  interval: 3s

assertions:
  - name: classifies-as-netdata
    type: classify
    target: localhost:9131
    expect:
      backend_service: Netdata

  - name: detects-netdata-exposed
    type: beacon
    target: localhost:9131
    args: ["--scanners", "portscan"]
    expect:
      check_id: port.netdata_exposed

timeout: 5m
