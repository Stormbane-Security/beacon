name: netdata-exposed
description: "Netdata monitoring dashboard exposed without authentication"
tags: [netdata, monitoring, dashboard]

services:
  netdata:
    image: netdata/netdata:stable
    ports: ["19999:19999"]
    cap_add:
      - SYS_PTRACE
    security_opt:
      - apparmor:unconfined

ready:
  cmd: "curl -sf http://localhost:19999/api/v1/info | grep -q version"
  timeout: 60s
  interval: 3s

assertions:
  - name: exploit-netdata-system-info
    type: command
    expect:
      command: "curl -sf http://localhost:19999/api/v1/info | grep -q version"
      exit_code: 0

  - name: exploit-netdata-allmetrics
    type: command
    expect:
      command: "curl -sf 'http://localhost:19999/api/v1/allmetrics?format=json' | grep -qE '(system|cpu)'"
      exit_code: 0

  - name: classifies-as-netdata
    type: classify
    target: localhost:19999
    expect:
      title_contains: Netdata

  - name: detects-netdata-exposed
    type: beacon
    target: localhost:19999
    args: ["--no-enrich", "--scanners", "portscan", "--ports", "19999"]
    expect:
      check_id: port.netdata_exposed

timeout: 5m
