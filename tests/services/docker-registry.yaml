name: docker-registry-exposed
description: "Docker Registry V2 API exposed without authentication — beacon detects unauthenticated registry"
tags: [docker, registry, container, port]

services:
  registry:
    image: registry:2
    ports: ["5000:5000"]
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"

ready:
  cmd: "curl -sf http://localhost:5000/v2/ >/dev/null"
  timeout: 30s
  interval: 2s

assertions:
  - name: exploit-registry-catalog
    type: command
    expect:
      command: "curl -sf http://localhost:5000/v2/_catalog | grep -q repositories"
      exit_code: 0

  - name: exploit-registry-api-version
    type: command
    expect:
      command: "curl -sf -o /dev/null -w '%{http_code}' http://localhost:5000/v2/ | grep -q 200"
      exit_code: 0

  - name: detects-registry-exposed
    type: beacon
    target: localhost:5000
    args: ["--no-enrich", "--scanners", "portscan", "--ports", "5000"]
    expect:
      check_id: container.registry_exposed

timeout: 5m
