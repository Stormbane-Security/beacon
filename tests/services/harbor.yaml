name: harbor-registry-exposed
description: "Harbor container registry with API accessible"
tags: [harbor, container-registry, cicd]

services:
  registry:
    image: registry:2
    ports: ["9160:5000"]
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"

ready:
  cmd: "curl -sf http://localhost:9160/v2/ >/dev/null"
  timeout: 30s
  interval: 2s

assertions:
  - name: detects-container-registry
    type: beacon
    target: localhost:9160
    args: ["--scanners", "containerimage"]
    expect:
      check_id: port.docker_unauthenticated

timeout: 5m
