name: harbor-registry-exposed
description: "Harbor container registry with API accessible"
tags: [harbor, container-registry, cicd]

services:
  registry:
    image: registry:2
    ports: ["5000:5000"]
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"

ready:
  cmd: "curl -sf http://localhost:5000/v2/ >/dev/null"
  timeout: 30s
  interval: 2s

assertions:
  - name: exploit-harbor-catalog
    type: command
    expect:
      command: "curl -sf http://localhost:5000/v2/_catalog | grep -q repositories"
      exit_code: 0

  - name: exploit-harbor-api
    type: command
    expect:
      command: "curl -sf -o /dev/null -w '%{http_code}' http://localhost:5000/v2/ | grep -q 200"
      exit_code: 0

  - name: detects-container-registry
    type: beacon
    target: localhost:5000
    args: ["--no-enrich", "--no-nmap", "--scanners", "containerimage", "--deep", "--permission-confirmed"]
    expect:
      check_id: container.registry_exposed

timeout: 5m
