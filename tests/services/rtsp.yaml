name: rtsp-stream-exposed
description: "RTSP video streaming server exposed — beacon detects RTSP on port 554"
tags: [rtsp, video, streaming, portscan]

services:
  rtsp:
    image: bluenviron/mediamtx:latest
    ports: ["9286:554", "9287:8554"]

ready:
  cmd: "nc -z localhost 9286"
  timeout: 30s
  interval: 2s

assertions:
  - name: detects-rtsp-exposed
    type: beacon
    target: rtsp:554
    args: ["--no-enrich", "--scanners", "portscan", "--ports", "554"]
    expect:
      check_id: port.rtsp_exposed

timeout: 5m
