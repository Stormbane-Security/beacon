name: ollama-exposed
description: "Ollama LLM server exposed without auth — beacon detects unauthenticated LLM API"
tags: [ollama, ai, llm, portscan]

services:
  ollama:
    image: ollama/ollama:latest
    ports: ["9285:11434"]

ready:
  cmd: "curl -sf http://localhost:9285/api/tags >/dev/null"
  timeout: 60s
  interval: 3s

assertions:
  - name: exploit-ollama-list-models
    type: command
    expect:
      command: "curl -sf http://localhost:9285/api/tags | grep -q models"
      exit_code: 0

  - name: exploit-ollama-version
    type: command
    expect:
      command: "curl -sf http://localhost:9285/api/version | grep -q version"
      exit_code: 0

  - name: detects-ollama-exposed
    type: beacon
    target: localhost:9285
    args: ["--no-enrich", "--no-nmap", "--scanners", "portscan", "--ports", "11434"]
    expect:
      check_id: port.ollama_exposed

timeout: 5m
