name: nifi-exposed
description: "Apache NiFi data pipeline UI exposed without authentication"
tags: [nifi, data-pipeline, port]

services:
  nifi:
    image: apache/nifi:1.25.0
    ports: ["8443:8443"]
    environment:
      NIFI_WEB_HTTPS_PORT: "8443"
      SINGLE_USER_CREDENTIALS_USERNAME: "admin"
      SINGLE_USER_CREDENTIALS_PASSWORD: "admin1234567890"

ready:
  cmd: "curl -sfk https://localhost:8443/nifi/ >/dev/null"
  timeout: 120s
  interval: 5s

assertions:
  - name: exploit-nifi-web-ui
    type: command
    expect:
      command: "curl -sfk https://localhost:8443/nifi/ | grep -qiE '(NiFi|nifi)'"
      exit_code: 0

  - name: exploit-nifi-api-resources
    type: command
    expect:
      command: "curl -sfk https://localhost:8443/nifi-api/access/config | grep -qE '(supportsLogin|config)'"
      exit_code: 0

  - name: detects-nifi-exposed
    type: beacon
    target: localhost:8443
    args: ["--no-enrich", "--no-nmap", "--scanners", "portscan", "--ports", "8443"]
    expect:
      min_findings: 1

timeout: 10m
