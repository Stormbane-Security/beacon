name: activemq-exposed
description: "Apache ActiveMQ Classic broker exposed with default admin credentials"
tags: [activemq, messaging, jms]

services:
  activemq:
    image: rmohr/activemq:5.15.9-alpine
    ports:
      - "9126:61616"
      - "9127:8161"

ready:
  cmd: "curl -sf http://admin:admin@localhost:9127/api/jolokia >/dev/null"
  timeout: 90s
  interval: 3s

assertions:
  - name: classifies-as-activemq
    type: classify
    target: localhost:9127
    expect:
      backend_service: ActiveMQ

  - name: detects-activemq-exposed
    type: beacon
    target: localhost:9126
    args: ["--scanners", "portscan"]
    expect:
      check_id: port.activemq_exposed

timeout: 5m
