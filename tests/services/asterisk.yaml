name: asterisk-sip-exposed
description: "Asterisk PBX with SIP exposed — beacon detects SIP service on port 5060"
tags: [asterisk, sip, voip, portscan]

services:
  asterisk:
    image: andrius/asterisk:20
    ports: ["9280:5060/udp", "9281:5060"]

ready:
  cmd: "nc -z localhost 9281"
  timeout: 60s
  interval: 3s

assertions:
  - name: exploit-sip-options
    type: command
    expect:
      command: "printf 'OPTIONS sip:test@localhost SIP/2.0\\r\\nVia: SIP/2.0/TCP localhost:5060\\r\\nTo: <sip:test@localhost>\\r\\nFrom: <sip:probe@localhost>;tag=drydock\\r\\nCall-ID: drydock123\\r\\nCSeq: 1 OPTIONS\\r\\nContent-Length: 0\\r\\n\\r\\n' | nc -w 3 localhost 9281 | grep -qiE '(SIP/2.0|Asterisk)'"
      exit_code: 0

  - name: detects-sip-exposed
    type: beacon
    target: asterisk:5060
    args: ["--no-enrich", "--scanners", "portscan", "--ports", "5060"]
    expect:
      check_id: port.sip_exposed

timeout: 5m
