name: jenkins-exposed
description: "Jenkins LTS with default setup wizard exposes CI/CD panel and management console"
tags: [jenkins, service, cicd]

services:
  jenkins:
    image: jenkins/jenkins:lts-alpine
    ports: ["9101:8080"]
    environment:
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=false"

ready:
  cmd: "curl -sf http://localhost:9101/login >/dev/null"
  timeout: 90s
  interval: 3s

assertions:
  - name: classifies-as-jenkins
    type: classify
    target: localhost:9101
    expect:
      backend_service: Jenkins

  - name: detects-cicd-panel
    type: beacon
    target: localhost:9101
    expect:
      check_id: exposure.cicd_panel

timeout: 5m
