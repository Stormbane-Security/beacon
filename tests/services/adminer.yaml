name: adminer-exposed
description: "Adminer database management tool exposed publicly"
tags: [adminer, database, admin-panel]

services:
  adminer:
    image: adminer:latest
    ports: ["8080:8080"]

ready:
  cmd: "curl -sf http://localhost:8080/ | grep -qi adminer"
  timeout: 30s
  interval: 2s

assertions:
  - name: classifies-as-adminer
    type: classify
    target: localhost:8080
    expect:
      title_contains: Adminer

timeout: 5m
