name: minio-default-creds
description: "MinIO with default minioadmin credentials exposes S3-compatible storage"
tags: [minio, service, storage]

services:
  minio:
    image: minio/minio
    ports:
      - "9202:9000"
      - "9203:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: ["server", "/data", "--console-address", ":9001"]

ready:
  cmd: "curl -sf http://localhost:9202/minio/health/live >/dev/null"
  timeout: 60s
  interval: 2s

assertions:
  - name: classifies-as-minio
    type: classify
    target: localhost:9203
    expect:
      technology: MinIO

  - name: detects-default-credentials
    type: beacon
    target: localhost:9202
    args: ["--scanners", "portscan"]
    expect:
      check_id: port.minio_default_credentials

timeout: 5m
