name: gitea-exposed
description: "Gitea 1.21 rootless instance with default configuration exposes Git hosting"
tags: [gitea, service, git]

services:
  gitea:
    image: gitea/gitea:1.21-rootless
    ports: ["9201:3000"]
    environment:
      GITEA__server__ROOT_URL: "http://localhost:9201"
      GITEA__server__DOMAIN: localhost
      GITEA__database__DB_TYPE: sqlite3

ready:
  cmd: "curl -sf http://localhost:9201/api/v1/version >/dev/null"
  timeout: 60s
  interval: 3s

assertions:
  - name: classifies-as-git-hosting
    type: classify
    target: localhost:9201
    expect:
      technology: Gitea

  - name: detects-exposed-instance
    type: beacon
    target: localhost:9201
    expect:
      check_id: exposure.cicd_panel

timeout: 5m
