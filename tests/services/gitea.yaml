name: gitea-exposed
description: "Gitea 1.21 rootless instance with default configuration exposes Git hosting"
tags: [gitea, service, git]

services:
  gitea:
    image: gitea/gitea:1.21-rootless
    ports: ["3000:3000"]
    environment:
      GITEA__server__ROOT_URL: "http://localhost:3000"
      GITEA__server__DOMAIN: localhost
      GITEA__database__DB_TYPE: sqlite3

ready:
  cmd: "curl -sf http://localhost:3000/api/v1/version >/dev/null"
  timeout: 120s
  interval: 3s

assertions:
  - name: exploit-gitea-api-version
    type: command
    expect:
      command: "curl -sf http://localhost:3000/api/v1/version | grep -q version"
      exit_code: 0

  - name: exploit-gitea-public-repos
    type: command
    expect:
      command: "curl -sf -o /dev/null -w '%{http_code}' http://localhost:3000/explore/repos | grep -q 200"
      exit_code: 0

  - name: classifies-as-git-hosting
    type: classify
    target: localhost:3000
    expect:
      service_version: platform

  - name: detects-exposed-instance
    type: beacon
    target: localhost:3000
    args: ["--no-enrich", "--no-nmap", "--scanners", "exposedfiles"]
    expect:
      check_id: port.gitea_no_auth

timeout: 5m
