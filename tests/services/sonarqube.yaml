name: sonarqube-exposed
description: "SonarQube 10 Community Edition with default configuration"
tags: [sonarqube, service, cicd]

services:
  sonarqube:
    image: sonarqube:10-community
    ports: ["9204:9000"]
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"

ready:
  cmd: "curl -sf http://localhost:9204/api/system/status | grep -q UP"
  timeout: 120s
  interval: 5s

assertions:
  - name: classifies-as-sonarqube
    type: classify
    target: localhost:9204
    expect:
      technology: SonarQube

  - name: detects-cicd-panel
    type: beacon
    target: localhost:9204
    expect:
      check_id: exposure.cicd_panel

timeout: 5m
