name: elasticsearch-no-auth
description: "Elasticsearch 8.13.0 with security disabled exposes unauthenticated cluster API"
tags: [elasticsearch, service, database]

services:
  elasticsearch:
    image: elasticsearch:8.13.0
    ports: ["9104:9200"]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"

ready:
  cmd: "curl -sf http://localhost:9104/_cluster/health >/dev/null"
  timeout: 90s
  interval: 3s

assertions:
  - name: classifies-as-elasticsearch
    type: classify
    target: localhost:9104
    expect:
      technology: Elasticsearch

  - name: detects-unauthenticated-elasticsearch
    type: beacon
    target: localhost:9104
    args: ["--scanners", "portscan"]
    expect:
      check_id: port.elasticsearch_unauthenticated

timeout: 5m
