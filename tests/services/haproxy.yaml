name: haproxy-stats-exposed
description: "HAProxy with stats page exposed without authentication"
tags: [haproxy, gateway, proxy]

services:
  haproxy:
    image: haproxy:2.9-alpine
    ports: ["8080:8080"]
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro

ready:
  cmd: "curl -sf http://localhost:8080/haproxy?stats >/dev/null"
  timeout: 30s
  interval: 2s

assertions:
  - name: exploit-haproxy-stats-page
    type: command
    expect:
      command: "curl -sf http://localhost:8080/haproxy?stats | grep -qiE '(HAProxy|Statistics|frontend)'"
      exit_code: 0

  - name: classifies-as-haproxy
    type: classify
    target: localhost:8080
    expect:
      proxy_type: haproxy

  - name: detects-haproxy-stats-exposed
    type: beacon
    target: localhost:8080
    args: ["--no-enrich", "--scanners", "gateway"]
    expect:
      check_id: gateway.haproxy_stats_exposed

timeout: 5m
