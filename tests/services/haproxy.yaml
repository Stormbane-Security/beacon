name: haproxy-stats-exposed
description: "HAProxy with stats page exposed without authentication"
tags: [haproxy, gateway, proxy]

services:
  haproxy:
    image: haproxy:2.9-alpine
    ports: ["9140:8080"]
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro

ready:
  cmd: "curl -sf http://localhost:9140/haproxy?stats >/dev/null"
  timeout: 30s
  interval: 2s

assertions:
  - name: classifies-as-haproxy
    type: classify
    target: localhost:9140
    expect:
      backend_service: HAProxy

  - name: detects-haproxy-stats-exposed
    type: beacon
    target: localhost:9140
    args: ["--scanners", "gateway"]
    expect:
      check_id: gateway.haproxy_stats_exposed

timeout: 5m
