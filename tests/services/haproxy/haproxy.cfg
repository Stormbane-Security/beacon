global
    log stdout local0

defaults
    log     global
    mode    http
    timeout connect 5s
    timeout client  30s
    timeout server  30s

frontend http_front
    bind *:8080
    http-after-response set-header Server HAProxy
    stats enable
    stats uri /haproxy?stats
    stats refresh 10s
    default_backend http_back

backend http_back
    server local 127.0.0.1:80 check
