name: nats-monitoring-exposed
description: "NATS message broker with monitoring API exposed without auth"
tags: [nats, messaging, monitoring]

services:
  nats:
    image: nats:2.10-alpine
    ports:
      - "9128:4222"
      - "9129:8222"
    command: ["--http_port", "8222"]

ready:
  cmd: "curl -sf http://localhost:9129/varz | grep -q server_id"
  timeout: 30s
  interval: 2s

assertions:
  - name: detects-nats-monitoring-exposed
    type: beacon
    target: localhost:9129
    args: ["--scanners", "portscan"]
    expect:
      check_id: port.nats_monitoring_exposed

timeout: 5m
