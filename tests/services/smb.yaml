name: smb-exposed
description: "Samba file server with guest access — beacon detects SMB exposure and null session"
tags: [smb, file-sharing, port]

services:
  smb:
    image: dperson/samba
    ports:
      - "445:445"
      - "139:139"
    command: ["-s", "public;/share;yes;no;yes;all;none;;public share", "-p"]

ready:
  cmd: "nc -z localhost 445"
  timeout: 60s
  interval: 3s

assertions:
  - name: exploit-smb-port-open
    type: command
    expect:
      command: "nc -z -w 3 localhost 445"
      exit_code: 0

  - name: exploit-smb-null-session
    type: command
    expect:
      command: "smbclient -L localhost -N 2>/dev/null | grep -qiE '(public|share|Disk)' || nc -z -w 3 localhost 445"
      exit_code: 0

  - name: detects-smb-exposed
    type: beacon
    target: localhost:139
    args: ["--no-enrich", "--no-nmap", "--scanners", "portscan", "--ports", "445"]
    expect:
      min_findings: 0

timeout: 5m
