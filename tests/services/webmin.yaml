name: webmin-exposed
description: "Webmin server management panel exposed"
tags: [webmin, management, port]

services:
  webmin:
    image: jlndk/webmin:latest
    ports: ["10000:10000"]
    environment:
      WEBMIN_ENABLED: "true"

ready:
  cmd: "curl -sfk https://localhost:10000 >/dev/null || curl -sf http://localhost:10000 >/dev/null"
  timeout: 90s
  interval: 5s

assertions:
  - name: detects-webmin-exposed
    type: beacon
    target: webmin:10000
    args: ["--no-enrich", "--scanners", "portscan", "--ports", "10000"]
    expect:
      check_id: port.webmin_exposed

timeout: 5m
