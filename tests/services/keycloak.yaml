name: keycloak-default-creds
description: "Keycloak 24.0 with default admin credentials for OAuth/SAML endpoint detection"
tags: [keycloak, service, auth, oauth, saml]

services:
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    ports: ["8080:8080"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    command: ["start-dev"]

ready:
  cmd: "curl -sf http://localhost:8080/realms/master/.well-known/openid-configuration >/dev/null"
  timeout: 90s
  interval: 3s

assertions:
  - name: classifies-as-keycloak
    type: classify
    target: localhost:8080
    expect:
      backend_service: Keycloak

  - name: detects-oauth-endpoints
    type: beacon
    target: localhost:8080
    args: ["--no-enrich", "--scanners", "oauth"]
    expect:
      check_id: oauth.jwks_exposed

  - name: detects-saml-metadata
    type: beacon
    target: localhost:8080
    args: ["--no-enrich", "--scanners", "saml"]
    expect:
      check_id: saml.metadata_exposed

timeout: 5m
