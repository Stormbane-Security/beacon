name: ldap-exposed
description: "OpenLDAP server allowing anonymous bind and enumeration"
tags: [ldap, directory, identity]

services:
  ldap:
    image: osixia/openldap:1.5.0
    ports: ["9133:389"]
    environment:
      LDAP_ORGANISATION: "Test Corp"
      LDAP_DOMAIN: "test.local"
      LDAP_ADMIN_PASSWORD: "admin"

ready:
  cmd: "nc -z localhost 9133"
  timeout: 60s
  interval: 3s

assertions:
  - name: detects-ldap-exposed
    type: beacon
    target: localhost:9133
    args: ["--scanners", "portscan"]
    expect:
      check_id: port.ldap_exposed

timeout: 5m
