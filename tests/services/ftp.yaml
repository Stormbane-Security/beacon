name: ftp-anonymous
description: "vsftpd FTP server allowing anonymous login"
tags: [ftp, file-sharing, anonymous]

services:
  ftp:
    image: fauria/vsftpd
    ports:
      - "21:21"
      - "21100-21110:21100-21110"
    environment:
      FTP_USER: testuser
      FTP_PASS: testpass
      PASV_MIN_PORT: "21100"
      PASV_MAX_PORT: "21110"
      ANONYMOUS_ENABLE: "YES"

ready:
  cmd: "nc -z localhost 21"
  timeout: 60s
  interval: 3s

assertions:
  - name: exploit-ftp-banner
    type: command
    expect:
      command: "echo '' | nc -w 3 localhost 21 | grep -q '220'"
      exit_code: 0

  - name: exploit-ftp-anonymous-login
    type: command
    expect:
      command: "curl -sf ftp://anonymous:@localhost:21/ -o /dev/null -w '%{http_code}' | grep -qE '(226|250|150|200)' || echo '' | nc -w 3 localhost 21 | grep -qi 'vsftpd\\|FTP'"
      exit_code: 0

  - name: detects-ftp-anonymous
    type: beacon
    target: localhost:21
    args: ["--no-enrich", "--no-nmap", "--scanners", "portscan", "--ports", "21"]
    expect:
      check_id: port.ftp_anonymous

timeout: 5m
