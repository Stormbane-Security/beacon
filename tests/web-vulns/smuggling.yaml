name: http-request-smuggling
description: "Nginx + gunicorn CL/TE mismatch — beacon detects HTTP request smuggling surface"
tags: [smuggling, web, authorized]

services:
  app:
    build:
      context: ./smuggling
      dockerfile: Dockerfile
    ports: ["9256:80"]

ready:
  cmd: "curl -sf http://localhost:9256/ >/dev/null"
  timeout: 60s
  interval: 3s

assertions:
  - name: exploit-clte-probe
    type: command
    expect:
      command: "printf 'POST / HTTP/1.1\\r\\nHost: localhost\\r\\nContent-Length: 6\\r\\nTransfer-Encoding: chunked\\r\\n\\r\\n0\\r\\n\\r\\n' | nc -w 3 localhost 9256 | grep -q 'HTTP/1'"
      exit_code: 0

  - name: detects-smuggling
    type: beacon
    target: app:80
    args: ["--no-enrich", "--scanners", "smuggling", "--deep", "--permission-confirmed", "--authorized", "--ports", "80"]
    expect:
      check_id: web.http_request_smuggling

timeout: 5m
