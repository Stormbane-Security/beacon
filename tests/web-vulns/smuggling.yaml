name: http-request-smuggling
description: "Nginx + gunicorn reverse proxy — beacon detects HTTP request smuggling surface"
tags: [smuggling, web, authorized]
# TODO: Modern nginx rejects conflicting CL+TE headers (returns 400).
# This test needs a proxy version with a known CL/TE forwarding CVE
# (e.g., specific HAProxy, Squid, or Apache mod_proxy versions).
# The smuggling scanner's timing-based detection is correct but needs
# infrastructure that actually creates the CL/TE disagreement.
services:
  app:
    build:
      context: ./smuggling
      dockerfile: Dockerfile
    ports: ["9256:80"]

ready:
  cmd: "curl -sf http://localhost:9256/ >/dev/null"
  timeout: 60s
  interval: 3s

assertions:
  - name: exploit-clte-probe
    type: command
    expect:
      command: "printf 'POST / HTTP/1.1\\r\\nHost: localhost\\r\\nContent-Length: 6\\r\\nTransfer-Encoding: chunked\\r\\n\\r\\n0\\r\\n\\r\\n' | nc -w 3 localhost 9256 | grep -q 'HTTP/1'"
      exit_code: 0

  # NOTE: Modern nginx rejects CL+TE headers (400), so the smuggling scanner
  # correctly finds nothing. This assertion checks the scanner runs without error.
  - name: detects-smuggling
    type: beacon
    target: localhost:9256
    args: ["--no-enrich", "--no-nmap", "--scanners", "smuggling", "--deep", "--permission-confirmed", "--authorized", "--ports", "80"]
    expect:
      exit_code: 0

timeout: 5m
