name: insecure-deserialization
description: "Python Flask app with insecure pickle deserialization — beacon detects unsafe deserialization"
tags: [deserialization, web, authorized]

services:
  app:
    build:
      context: ./deserialize
      dockerfile: Dockerfile
    ports: ["9255:8080"]

ready:
  cmd: "curl -sf http://localhost:9255/health >/dev/null"
  timeout: 30s
  interval: 2s

assertions:
  - name: exploit-pickle-endpoint-accepts-data
    type: command
    expect:
      command: "curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:9255/api/v1/session -H 'Content-Type: application/octet-stream' -d 'test' | grep -qE '(200|400|500)'"
      exit_code: 0

  - name: detects-insecure-deserialize
    type: beacon
    target: localhost:9255
    args: ["--no-enrich", "--no-nmap", "--scanners", "deserial", "--deep", "--permission-confirmed", "--authorized", "--ports", "8080"]
    expect:
      check_id: web.insecure_deserialize

timeout: 5m
