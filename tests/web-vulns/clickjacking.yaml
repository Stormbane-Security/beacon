name: clickjacking
description: "Web app with no X-Frame-Options or CSP frame-ancestors — beacon detects clickjacking"
tags: [clickjacking, web, headers]

services:
  app:
    image: nginx:alpine
    ports: ["9253:80"]
    command: ["sh", "-c", "echo '<html><body><h1>Bank Login</h1><form method=POST action=/login><input name=user><input name=pass type=password><button>Login</button></form></body></html>' > /usr/share/nginx/html/index.html && echo 'server { listen 80; location / { root /usr/share/nginx/html; } }' > /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"]

ready:
  cmd: "curl -sf http://localhost:9253/ >/dev/null"
  timeout: 30s
  interval: 2s

assertions:
  - name: exploit-no-xframe-options
    type: command
    expect:
      command: "curl -sI http://localhost:9253/ | grep -ciE 'x-frame-options|frame-ancestors' | grep -q '^0$'"
      exit_code: 0

  - name: exploit-page-has-login-form
    type: command
    expect:
      command: "curl -sf http://localhost:9253/ | grep -q 'Login'"
      exit_code: 0

  - name: detects-clickjacking
    type: beacon
    target: localhost:9253
    args: ["--no-enrich", "--scanners", "clickjacking", "--ports", "80"]
    expect:
      check_id: http.clickjacking

timeout: 5m
