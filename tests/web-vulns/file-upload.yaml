name: file-upload-bypass
description: "PHP file upload with insufficient MIME/extension validation — beacon detects upload bypass"
tags: [file-upload, web, authorized]

services:
  app:
    build:
      context: ./file-upload
      dockerfile: Dockerfile
    ports: ["9252:80"]

ready:
  cmd: "curl -sf http://localhost:9252/ >/dev/null"
  timeout: 60s
  interval: 3s

assertions:
  - name: exploit-upload-endpoint-exists
    type: command
    expect:
      command: "curl -sf http://localhost:9252/ | grep -qiE '(upload|form)'"
      exit_code: 0

  - name: detects-file-upload-bypass
    type: beacon
    target: localhost:9252
    args: ["--no-enrich", "--no-nmap", "--scanners", "fileupload", "--deep", "--permission-confirmed", "--authorized", "--ports", "80"]
    expect:
      check_id: web.file_upload_bypass

timeout: 5m
