name: env-file-exposed
description: "Web server with .env file accessible at the document root"
tags: [exposure, env, sensitive-file]

services:
  nginx:
    image: nginx:alpine
    ports: ["80:80"]
    volumes:
      - ./env-file/html:/usr/share/nginx/html:ro

ready:
  cmd: "curl -sf http://localhost:80/ >/dev/null"
  timeout: 30s
  interval: 2s

assertions:
  - name: detects-env-file-exposed
    type: beacon
    target: localhost:80
    args: ["--no-enrich", "--no-nmap", "--no-nuclei", "--scanners", "exposedfiles", "--ports", "80", "--verbose"]
    expect:
      min_findings: 1
      has_check_id: "exposure.env_file_exposed"

timeout: 5m
