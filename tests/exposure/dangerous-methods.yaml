name: dangerous-http-methods
description: "nginx with PUT and DELETE methods enabled"
tags: [http-methods, web, nginx]

services:
  nginx:
    image: nginx:alpine
    ports: ["80:80"]
    volumes:
      - ./dangerous-methods/nginx.conf:/etc/nginx/conf.d/default.conf:ro

ready:
  cmd: "curl -sf http://localhost:80/ >/dev/null"
  timeout: 30s
  interval: 2s

assertions:
  - name: exploit-put-method-write-file
    type: command
    expect:
      command: "curl -sf -X PUT -d 'drydock_exploit_proof' http://localhost:80/proof.txt && curl -sf http://localhost:80/proof.txt | grep -q drydock_exploit_proof"
      exit_code: 0

  - name: exploit-options-reveals-methods
    type: command
    expect:
      command: "curl -sf -X OPTIONS -I http://localhost:80/ 2>&1 | grep -qi 'PUT\\|DELETE'"
      exit_code: 0

  - name: detects-dangerous-methods
    type: beacon
    target: nginx
    args: ["--no-enrich", "--scanners", "httpmethods", "--ports", "80"]
    expect:
      check_id: web.dangerous_method_enabled

timeout: 5m
