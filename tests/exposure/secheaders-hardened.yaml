name: secheaders-hardened
description: "Web server with all security headers correctly configured — should produce 0 header findings"
tags: [headers, security, surface, negative-test]

services:
  nginx:
    image: nginx:alpine
    ports: ["80:80"]
    volumes:
      - ./secheaders-hardened/html:/usr/share/nginx/html:ro
      - ./secheaders-hardened/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

ready:
  cmd: "curl -sf http://localhost:80/ >/dev/null"
  timeout: 30s
  interval: 2s

assertions:
  - name: no-missing-csp
    type: beacon
    target: localhost:80
    args: ["--no-enrich", "--no-nmap", "--no-nuclei", "--scanners", "secheaders", "--ports", "80", "--verbose"]
    expect:
      no_check_id: "headers.missing_csp"
  - name: no-missing-hsts
    type: beacon
    target: localhost:80
    args: ["--no-enrich", "--no-nmap", "--no-nuclei", "--scanners", "secheaders", "--ports", "80", "--verbose"]
    expect:
      no_check_id: "headers.missing_hsts"
  - name: no-missing-xframe
    type: beacon
    target: localhost:80
    args: ["--no-enrich", "--no-nmap", "--no-nuclei", "--scanners", "secheaders", "--ports", "80", "--verbose"]
    expect:
      no_check_id: "headers.missing_x_frame_options"

timeout: 5m
