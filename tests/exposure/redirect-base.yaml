name: redirect-base-follows
description: "Exposedfiles follows 308 redirects to find canonical base before probing paths"
tags: [exposure, redirect, env]

services:
  nginx:
    image: nginx:alpine
    ports: ["8080:80", "8081:8081"]
    volumes:
      - ./redirect-base/html:/usr/share/nginx/html:ro
      - ./redirect-base/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

ready:
  cmd: "curl -sf http://localhost:8080/ >/dev/null && curl -sI http://localhost:8081/ | grep -q 308"
  timeout: 30s
  interval: 2s

assertions:
  - name: finds-env-via-redirect
    type: beacon
    target: localhost:8081
    args: ["--no-enrich", "--no-nmap", "--no-nuclei", "--scanners", "exposedfiles", "--ports", "8081", "--verbose"]
    expect:
      min_findings: 1
      has_check_id: "exposure.env_file_exposed"

timeout: 5m
