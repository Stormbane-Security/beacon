name: spring-actuator-exposed
description: "Spring Boot application with actuator endpoints exposed without authentication"
tags: [spring, java, actuator, exposure]

services:
  spring:
    image: springio/gs-spring-boot-docker:latest
    ports: ["8080:8080"]
    environment:
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "*"
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: always

ready:
  cmd: "curl -sf http://localhost:8080/actuator/health >/dev/null"
  timeout: 180s
  interval: 3s

assertions:
  - name: exploit-actuator-env
    type: command
    expect:
      command: "curl -sf http://localhost:8080/actuator/env | grep -qE '(activeProfiles|propertySources)'"
      exit_code: 0

  - name: exploit-actuator-health-details
    type: command
    expect:
      command: "curl -sf http://localhost:8080/actuator/health | grep -q status"
      exit_code: 0

  - name: detects-spring-actuator-exposed
    type: beacon
    target: localhost:8080
    args: ["--no-enrich", "--no-nmap", "--scanners", "exposedfiles", "--ports", "8080"]
    expect:
      check_id: exposure.spring_actuator

timeout: 5m
