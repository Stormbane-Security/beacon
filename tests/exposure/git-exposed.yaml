name: git-exposed
description: "Web server with .git directory accessible via HTTP"
tags: [exposure, git, sensitive-file]

services:
  nginx:
    image: nginx:alpine
    ports: ["80:80"]
    volumes:
      - ./git-exposed/html:/usr/share/nginx/html:ro

ready:
  cmd: "curl -sf http://localhost:80/ >/dev/null"
  timeout: 30s
  interval: 2s

assertions:
  - name: detects-git-exposed
    type: beacon
    target: localhost:80
    args: ["--no-enrich", "--no-nmap", "--scanners", "exposedfiles", "--ports", "80"]
    expect:
      min_findings: 0

timeout: 5m
