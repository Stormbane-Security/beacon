name: Drydock Baseline

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: drydock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: "E2E: ${{ matrix.category }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        category:
          - chains
          - databases
          - services
          - scanners
          - e2e
          - cve
          - fingerprint
          - exposure
          - web-vulns
          - infrastructure
          - nonstandard-port
          - scanner-selection
          - cicd
          - identity
          - email
          - dns
          - dlp

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d # v2.16.1
        if: runner.environment == 'github-hosted'
        with:
          egress-policy: audit

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install tools
        run: |
          CGO_ENABLED=1 go build -o /usr/local/bin/beacon ./cmd/beacon
          go install github.com/stormbane-security/drydock/cmd/drydock@latest
          cp ~/go/bin/drydock /usr/local/bin/drydock

      - name: Skip if category is empty
        id: check
        run: |
          if [ ! -d "tests/${{ matrix.category }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache Docker images
        if: steps.check.outputs.skip != 'true'
        id: docker-cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: /tmp/docker-cache
          key: docker-${{ matrix.category }}-${{ hashFiles(format('tests/{0}/**/*.yaml', matrix.category)) }}

      - name: Load cached Docker images
        if: steps.check.outputs.skip != 'true' && steps.docker-cache.outputs.cache-hit == 'true'
        run: |
          if [ -f /tmp/docker-cache/images.tar.zst ]; then
            echo "Loading cached Docker images..."
            zstd -d /tmp/docker-cache/images.tar.zst --stdout | docker load
          fi

      - name: Run drydock tests
        if: steps.check.outputs.skip != 'true'
        env:
          BEACON_AUTHORIZED_ACK: "1"
        run: |
          drydock run tests/${{ matrix.category }} \
            --fixed-ports \
            --artifacts .drydock/runs 2>&1 | tee drydock-output.log

      - name: Save Docker images to cache
        if: always() && steps.check.outputs.skip != 'true' && steps.docker-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/docker-cache
          images=$(docker images --format '{{.Repository}}:{{.Tag}}' | grep -v '<none>')
          if [ -n "$images" ]; then
            echo "Saving Docker images to cache..."
            echo "$images" | xargs docker save | zstd -T0 -3 -o /tmp/docker-cache/images.tar.zst
            echo "Cache size: $(du -sh /tmp/docker-cache/images.tar.zst | cut -f1)"
          fi

      - name: Upload test artifacts
        if: always() && steps.check.outputs.skip != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: drydock-${{ matrix.category }}
          path: |
            .drydock/runs/
            drydock-output.log
          retention-days: 7

  results:
    name: Baseline Results
    needs: test
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: results
          pattern: drydock-*

      - name: Summarize results
        run: |
          echo "## Drydock Baseline Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Category | Passed | Failed |" >> "$GITHUB_STEP_SUMMARY"
          echo "|----------|--------|--------|" >> "$GITHUB_STEP_SUMMARY"
          for dir in results/drydock-*/; do
            category=$(basename "$dir" | sed 's/drydock-//')
            if [ -f "$dir/drydock-output.log" ]; then
              pass=$(grep -c "PASS" "$dir/drydock-output.log" 2>/dev/null || echo 0)
              fail=$(grep -c "FAIL" "$dir/drydock-output.log" 2>/dev/null || echo 0)
              echo "| $category | $pass | $fail |" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
