name: Drydock Manual

on:
  workflow_dispatch:
    inputs:
      category:
        description: "Test category (blank = all)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  drydock:
    name: "E2E: ${{ matrix.category }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        category:
          - chains
          - databases
          - services
          - scanners
          - e2e
          - cve
          - fingerprint
          - exposure
          - web-vulns
          - infrastructure
          - nonstandard-port
          - scanner-selection
          - cicd
          - identity
          - email
          - dns
          - dlp

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install tools
        run: |
          CGO_ENABLED=1 go build -o /usr/local/bin/beacon ./cmd/beacon
          git clone --depth 1 --branch v0.3.0 https://github.com/stormbane-security/drydock.git /tmp/drydock-src
          cd /tmp/drydock-src && go build -o /usr/local/bin/drydock ./cmd/drydock
          drydock 2>&1 | head -1 || true

      - name: Skip if category is empty or filtered
        id: check
        run: |
          FILTER="${{ github.event.inputs.category }}"
          if [ -n "$FILTER" ] && [ "$FILTER" != "${{ matrix.category }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ ! -d "tests/${{ matrix.category }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run drydock tests
        if: steps.check.outputs.skip != 'true'
        env:
          BEACON_AUTHORIZED_ACK: "1"
        run: |
          set -o pipefail
          drydock run tests/${{ matrix.category }} \
            --fixed-ports \
            --artifacts .drydock/runs 2>&1 | tee drydock-output.log

      - name: Upload test artifacts
        if: always() && steps.check.outputs.skip != 'true'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: drydock-${{ matrix.category }}
          path: |
            .drydock/runs/
            drydock-output.log
          retention-days: 7
