name: CI

on:
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, Vet & Test
    runs-on: ubuntu-latest

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d # v2.16.1
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Configure private Go modules
        run: |
          git config --global url."https://${{ secrets.GOPRIVATE_TOKEN }}@github.com/".insteadOf "https://github.com/"
        env:
          GOPRIVATE: github.com/stormbane-security/*

      - name: Download dependencies
        run: go mod download
        env:
          GOPRIVATE: github.com/stormbane-security/*

      - name: Build
        run: go build ./...
        env:
          GOPRIVATE: github.com/stormbane-security/*

      - name: Vet
        run: go vet ./...
        env:
          GOPRIVATE: github.com/stormbane-security/*

      - name: Test
        run: go test -race -timeout 5m ./...
        env:
          GOPRIVATE: github.com/stormbane-security/*
